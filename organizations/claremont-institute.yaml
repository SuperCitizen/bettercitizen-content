description: "Conservative institute in California, founded in 1979, devoted to recovering the political philosophy of the American founding. Publishes the Claremont Review of Books, runs fellowships for rising conservatives, and files constitutional litigation through its Center for Constitutional Jurisprudence. Despite the name, it is not affiliated with the Claremont Colleges."
