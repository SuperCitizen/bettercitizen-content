title: Citizens United v. FEC
summary: What the 2010 ruling actually held, why corporations and unions can now spend unlimited independent expenditures on elections, the strongest case the majority and dissent each made, and what's happened in the fifteen years since — Super PACs, McCutcheon, the FEC's regulatory paralysis, and the live disclosure fight. Contested by design — the constitutional question is unsettled and the empirical claims about corruption are genuinely disputed.
