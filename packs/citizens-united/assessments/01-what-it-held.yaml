schema: bettercitizen.assessment/v1
lesson: what-it-held
questions:
  - id: q1
    kind: multiple-choice
    text: "What did Citizens United v. FEC (2010) actually strike down?"
    choices:
      - id: a
        text: "All campaign-finance regulation, including direct contributions to candidates."
      - id: b
        text: "BCRA §203's ban on corporate and union independent expenditures from general-treasury funds."
      - id: c
        text: "The Tillman Act of 1907's ban on corporate contributions to candidates."
      - id: d
        text: "Buckley v. Valeo's framework for distinguishing contributions from expenditures."
    correct_choice_id: b
    explanation: "The Court struck down BCRA §203 facially, allowing corporations and unions to make unlimited independent expenditures. It did NOT touch direct contributions (still banned under the Tillman Act and FECA), and it did NOT overrule Buckley — it built on Buckley's contribution/expenditure distinction."
    concepts: [citizens-united, independent-expenditures]

  - id: q2
    kind: multiple-choice
    text: "A national labor union plans two uses of its treasury funds in a Senate race: (1) \\$2 million on its own TV ads urging the incumbent's defeat, with no contact with any campaign, and (2) a \\$25,000 check from the same treasury directly to the challenger's campaign. After Citizens United, what does federal law allow?"
    choices:
      - id: a
        text: "Both — Citizens United deregulated corporate and union money across the board."
      - id: b
        text: "The ads but not the check — independent expenditures from a union treasury are now protected speech, while the Taft–Hartley ban on union treasury contributions to candidates stands."
      - id: c
        text: "The check but not the ads — direct contributions are smaller and therefore less corrupting."
      - id: d
        text: "Neither — the holding covered corporations only, leaving unions outside it."
    correct_choice_id: b
    explanation: "Citizens United extended Buckley's independent-expenditure protection to corporate AND union treasuries, but it never touched the direct-contribution track: union treasury contributions to federal candidates have been banned since Taft–Hartley (1947), just as corporate ones have been since the Tillman Act (1907). Option d misses that the holding expressly covered unions alongside corporations; option c inverts the doctrine, which treats contributions as MORE regulable, not less."
    concepts: [citizens-united, independent-expenditures, campaign-finance]

  - id: q3
    kind: multiple-choice
    text: "What was the vote on the disclosure-and-disclaimer portion of Citizens United?"
    choices:
      - id: a
        text: "5–4, with the same alignment as the main holding."
      - id: b
        text: "8–1, with only Justice Thomas dissenting."
      - id: c
        text: "9–0 unanimous."
      - id: d
        text: "There was no separate disclosure ruling; it was part of the main 5–4 holding."
    correct_choice_id: b
    explanation: "BCRA §§201 and 311 (disclosure and disclaimer requirements) were upheld 8–1, with only Justice Thomas dissenting. This part of the holding is often elided in popular accounts but is doing real work in current policy debates — it's why the DISCLOSE Act framework is constitutionally available."
    concepts: [citizens-united, donor-disclosure]

  - id: q4
    kind: multiple-choice
    text: "Which case actually created the legal vehicle now called a 'Super PAC'?"
    choices:
      - id: a
        text: "Citizens United v. FEC (Supreme Court, January 2010)."
      - id: b
        text: "SpeechNow.org v. FEC (D.C. Circuit, March 2010)."
      - id: c
        text: "McCutcheon v. FEC (Supreme Court, 2014)."
      - id: d
        text: "Buckley v. Valeo (Supreme Court, 1976)."
    correct_choice_id: b
    explanation: "Citizens United opened the funding source — corporations and unions can spend unlimited independent expenditures. SpeechNow.org, decided two months later by the D.C. Circuit (sitting en banc), opened the aggregation vehicle — political committees can accept unlimited contributions to fund those expenditures. The combination is the Super PAC."
    concepts: [super-pacs, citizens-united, independent-expenditures]

  - id: q5
    kind: free-response
    text: "Citizens United is often summarized as 'the case that ruled corporations are people.' Why is this characterization misleading? Be specific about what the case actually held."
    socratic_seed: "Consider two distinctions: (1) corporate personhood as a doctrine vs. corporate speech as a First Amendment matter, and (2) what the case said about who can SPEAK vs. who can spend without limit. The 'corporations are people' phrase predates CU by a century — it goes back to Santa Clara County v. Southern Pacific Railroad (1886) — and applies far beyond election law."
    concepts: [citizens-united]
