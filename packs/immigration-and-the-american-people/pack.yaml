title: Immigration and the American People
summary: From the colonial era forward, successive waves of newcomers built the American population, each wave reshaping the country's economy, cities, and sense of itself. This pack traces that demographic history and the recurring cycle of welcome and restriction, and examines how the contested idea of "becoming American" evolved alongside changing laws of citizenship and naturalization.
