title: War and the American Republic
summary: War has been present at every turning point in United States history, from the Revolution that created the nation to the Cold War that defined its global role. This pack surveys how the country's major wars forged a shared national identity and examines, thematically, how war repeatedly expanded federal power, drove industry and technology, and reshaped American society.
