schema: bettercitizen.assessment/v1
lesson: what-it-believes
questions:
  - id: q1
    kind: multiple-choice
    text: "Herbert Croly's foundational text The Promise of American Life (1909) advocated combining which two American traditions?"
    choices:
      - id: a
        text: "Jacksonian populism and Madisonian federalism."
      - id: b
        text: "Hamiltonian strong federal government in service of Jeffersonian-democratic ends."
      - id: c
        text: "Wilsonian internationalism and Jeffersonian agrarianism."
      - id: d
        text: "Hamiltonian commercialism and Jacksonian honor culture."
    correct_choice_id: b
    explanation: "Croly argued for using Hamiltonian strong-federal-government instruments in service of Jeffersonian-democratic ends — i.e., active federal government pursuing equality and shared prosperity. This synthesis was foundational for the early-1900s progressive movement and influenced Theodore Roosevelt's 'New Nationalism' platform."
    concepts: [progressivism]

  - id: q2
    kind: multiple-choice
    text: "Which of these did the New Deal NOT include?"
    choices:
      - id: a
        text: "Social Security (Old-Age Insurance)."
      - id: b
        text: "Securities and Exchange Commission."
      - id: c
        text: "Medicare and Medicaid."
      - id: d
        text: "National Labor Relations Act (Wagner Act)."
    correct_choice_id: c
    explanation: "Medicare and Medicaid were Great Society programs (1965 Social Security Amendments under Lyndon Johnson), not New Deal. The New Deal (1933-1945) included Social Security, the SEC, the Wagner Act, FDIC, agricultural reform, and the Tennessee Valley Authority. The Great Society explicitly extended the New Deal framework to healthcare and to civil rights."
    concepts: [progressivism, new-deal]

  - id: q3
    kind: multiple-choice
    text: "A county board votes to keep its 150-year-old at-large election system. One member argues: 'It has lasted a century and a half — that is evidence it embodies accumulated wisdom.' Which response best captures the progressive position developed in this lesson?"
    choices:
      - id: a
        text: "Any institution older than a century is presumptively unjust and should be replaced."
      - id: b
        text: "Longevity is evidence of survival, not of wisdom — an arrangement can persist because it serves entrenched power, so it earns scrutiny on its merits rather than the benefit of the doubt."
      - id: c
        text: "The decision should be transferred from the elected board to administrative experts, who are better placed to judge electoral systems."
      - id: d
        text: "Inherited institutions deserve deference, but only those that predate the Constitution."
    correct_choice_id: b
    explanation: "This is the lesson's temperamental break with the Burkean presumption-of-continuity: inherited arrangements may be defensible on their merits, but they don't get the benefit of the doubt that comes from longevity, because persistence can reflect accumulated power rather than accumulated wisdom — at-large systems, in fact, were sometimes retained precisely because they diluted minority voting strength. Choice (a) overstates the claim: progressives say 'presumptively suspect, judge on the merits,' not 'presumptively unjust.' Choice (c) confuses the separate expertise commitment with the argument about tradition; (d) is no tradition's position."
    concepts: [progressivism]

  - id: q4
    kind: multiple-choice
    text: "Why did the New Deal initially exclude many Black Americans from key programs like Social Security?"
    choices:
      - id: a
        text: "FDR personally opposed including Black Americans."
      - id: b
        text: "Constitutional limitations prevented federal coverage of all workers."
      - id: c
        text: "Compromises with Southern Democrats — needed for Senate passage — excluded agricultural and domestic workers, who were overwhelmingly Black."
      - id: d
        text: "The programs were never intended to be universal."
    correct_choice_id: c
    explanation: "Social Security as enacted in 1935 excluded agricultural and domestic workers (roughly 65% of Black workers nationally, even higher in the South), in part to secure the Southern Democratic votes needed for passage. Subsequent expansions (1950, 1954) gradually included these categories. The identity-justice progressive reading: this is not an accident but a structural feature of the New Deal coalition. The New Deal liberal reading: the exclusions were tragic compromises that subsequent legislation has corrected."
    concepts: [progressivism, new-deal]

  - id: q5
    kind: free-response
    text: "This lesson names trust in expert judgment and the widening of democratic inclusion as two core progressive commitments. Describe a concrete situation where the two commitments pull against each other, and explain how a progressive could honor both without abandoning either."
    socratic_seed: "Candidate situations: public-health mandates (expert agencies overriding contested public preferences), central-bank independence, environmental permitting (agency science vs. community input), curriculum standards. The tension: expertise concentrates authority in unelected institutions, while inclusion promises every citizen an equal political voice. Resolution moves available within the tradition: Dewey's answer — expertise informs but an educated, deliberating public decides; procedural designs (notice-and-comment, citizen assemblies, agency accountability to elected branches); distinguishing technical questions about means from value questions about ends. Strong answers notice that this same tension is what populist critics of progressivism exploit, and say what evidence would show a given delegation to experts had gone too far."
    concepts: [progressivism]
