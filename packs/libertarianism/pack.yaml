title: Libertarianism
summary: What the libertarian tradition actually believes (steel-manned by adherents), the internal disagreements that have shaped it from classical liberals through Rothbard's anarcho-capitalism through bleeding-heart libertarianism, and how it relates to other American ideological traditions. Libertarianism is not "Republican lite" — it is a distinct tradition with strong commitments that often align with neither conservatism nor progressivism.
