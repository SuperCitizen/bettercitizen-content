title: How a bill becomes law
summary: The actual path from a senator or representative's idea to an enacted
  federal law — committee, floor, conference, and the President's desk. Then the
  way modern lawmaking really works, where leadership-negotiated packages, omnibus
  bills, continuing resolutions, and reconciliation have displaced the textbook
  diagram. The pack closes with the vetogate arithmetic — 218, 51, 60, 67 — that
  explains in advance where most bills die.
