schema: bettercitizen.assessment/v1
lesson: from-idea-to-law
questions:
  - id: q1-introduction
    kind: multiple-choice
    text: Who can formally introduce a bill in the U.S. House of Representatives?
    choices:
      - id: a
        text: Any U.S. citizen
      - id: b
        text: Only the President
      - id: c
        text: Only a member of the House
      - id: d
        text: Lobbyists registered with Congress
    correct_choice_id: c
    explanation: Only a member of the House can formally introduce a bill there, by
      dropping it in the hopper. Citizens, lobbyists, and the executive branch can
      draft text or press for it, but a member must put their name on it — and
      revenue bills must start in the House under Article I §7.
    concepts:
      - legislative-process
  - id: q2-committee
    kind: multiple-choice
    text: Roughly what share of the bills introduced in a given Congress are
      eventually enacted into law?
    choices:
      - id: a
        text: About half
      - id: b
        text: About a quarter
      - id: c
        text: Less than 5%
      - id: d
        text: Almost all of them
    correct_choice_id: c
    explanation: Across recent decades roughly 2–5% of introduced bills become law,
      and the 118th Congress (2023–24) was starker still — more than 19,000
      measures introduced, 274 public laws enacted, under 2%. Most die in
      committee without a hearing or a vote, which is why committee is the
      single deadliest kill point.
    concepts:
      - committee-system
      - legislative-process
  - id: q3-cloture
    kind: multiple-choice
    text: The Majority Leader files a cloture motion on an ordinary (non-budget)
      bill. The cloture vote is 58–42, with all 100 senators voting. What is the
      bill's status?
    choices:
      - id: a
        text: It passed — 58 votes is well above the simple majority needed
      - id: b
        text: It advances to a final passage vote, where it will need 60 votes
      - id: c
        text: Debate continues and the bill remains blocked — cloture failed, two
          votes short of the 60 required
      - id: d
        text: It is dead for the rest of the Congress — a failed cloture vote
          kills a bill permanently
    correct_choice_id: c
    explanation: Cloture on legislation takes three-fifths of the full Senate —
      60 votes — so 58 fails and the blockade continues. The thresholds run in
      the opposite order from choice (b) — 60 to *reach* the final vote, then only
      a simple majority to pass. And a failed cloture motion is not fatal in
      itself — leaders can file again if they can find the missing votes, which
      is why contested bills sometimes fail cloture repeatedly before passing or
      being shelved.
    concepts:
      - filibuster
      - cloture
  - id: q4-discharge
    kind: multiple-choice
    text: A bill with broad public support sits in a House committee whose chair
      refuses to act, and leadership won't schedule it. In November 2025, supporters
      of the Epstein Files Transparency Act faced exactly this. What mechanism did
      they use to force a floor vote?
    choices:
      - id: a
        text: A discharge petition signed by 218 members — a majority of the House
      - id: b
        text: A two-thirds cloture vote in the House
      - id: c
        text: A presidential order moving the bill to the floor
      - id: d
        text: A Supreme Court order compelling the committee to report the bill
    correct_choice_id: a
    explanation: A discharge petition with 218 signatures — a House majority —
      pries a bill out of committee regardless of the chair's or the Speaker's
      wishes. It is rare because signing is public defiance of one's own
      leadership, but in November 2025 the petition reached 218, the House passed
      the bill 427–1, and it became law within days. Cloture is a Senate device,
      and neither the President nor the courts can schedule House business.
    concepts:
      - committee-system
      - legislative-process
  - id: q5-veto
    kind: free-response
    text: The President vetoes a major bill and returns it to Congress in the middle
      of the session. Walk through what Congress can do to enact it anyway, the
      vote thresholds involved, and why the same path would be unavailable if the
      President had instead pocket-vetoed the bill after adjournment.
    concepts:
      - veto
      - veto-override
    socratic_seed: "Start with where the returned bill goes and what share of those
      present and voting must support it in each chamber. Then ask: what exactly
      would Congress be 'overriding' if no veto message ever came back?"
