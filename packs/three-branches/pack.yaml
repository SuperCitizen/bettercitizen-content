title: The three branches
summary: How U.S. federal power is divided across the legislative, executive, and judicial branches — what each does, what it cannot do, and why the Founders separated them. The first lesson maps the architecture of Articles I–III and Madison's case for splitting power; the second inventories the enforcement machinery of checks and balances, from the veto and the purse to judicial review, through cases like Youngstown, Chadha, and the impoundment fights of the 2020s.
