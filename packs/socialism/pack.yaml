title: Socialism
summary: What the socialist tradition actually believes (steel-manned by adherents), the deep distinction between democratic socialism and 20th-century state socialism, the internal disagreements among democratic socialists, market socialists, and Marxist-revolutionary streams, and how socialism relates to American progressivism. American socialism is much closer to European social democracy than to Soviet-style state socialism — and the difference matters.
