title: Industry and American Manufacturing
summary: Manufacturing transformed the United States from an agrarian republic into the world's leading industrial power, raising living standards and reshaping where and how Americans lived and worked. This pack traces that arc — from the early factory system and the second industrial revolution through mass production, the World War II "arsenal of democracy," and the postwar boom — and then examines deindustrialization and the live debate over reshoring and industrial policy.
