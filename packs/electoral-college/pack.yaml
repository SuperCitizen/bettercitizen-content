title: The Electoral College
summary: How U.S. presidential elections actually work — state-level allocation, the 12th Amendment, faithless electors, the contingent-election fallback — plus the strongest cases for keeping it, abolishing it, and reforming it without amending the Constitution. Five elections have ended with the popular-vote loser winning; the institution is a live political question and was a contested compromise from the day it was drafted.
