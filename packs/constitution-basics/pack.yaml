title: Constitution basics
summary: What the Constitution actually says, what it set out to do, and how it
  changes. The pack maps the Preamble and the seven Articles, takes the Article V
  amendment machine apart — from the 27th Amendment's 202-year ratification to
  the Equal Rights Amendment's contested present — and ends with the unwritten
  constitution of precedent, practice, and norm that does much of the daily
  governing.
