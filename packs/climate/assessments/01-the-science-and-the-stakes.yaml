schema: bettercitizen.assessment/v1
lesson: the-science-and-the-stakes
questions:
  - id: q1
    kind: multiple-choice
    text: "Which of these claims is established (not contested) in the climate-science literature?"
    choices:
      - id: a
        text: "Whether human emissions are the primary cause of the post-1850 warming."
      - id: b
        text: "Whether warming this century will be 1.5°C or 4°C."
      - id: c
        text: "Whether geoengineering should be deployed as a backup option."
      - id: d
        text: "Whether the optimal carbon price is above $50 per ton."
    correct_choice_id: a
    explanation: "The first is established science (IPCC AR6 calls human influence 'unequivocal,' resting on multiple independent lines of evidence). The second is a *projection* — it depends on emissions trajectories, which depend on policy choices not yet made. The third and fourth are policy and valuation questions the physics cannot answer. Separating established physics from conditional projections from policy judgments is the core skill of careful climate reasoning."
    concepts: [climate]

  - id: q2
    kind: multiple-choice
    text: "In early 2025 the WMO confirmed 2024 as the warmest year on record at about 1.55°C above pre-industrial — yet also reported the long-term warming level at about 1.34–1.41°C. A commentator concludes the Paris 1.5°C limit 'has already been breached.' What is wrong with that conclusion?"
    choices:
      - id: a
        text: "Nothing — the first calendar year above 1.5°C formally breaches the Paris target."
      - id: b
        text: "The Paris targets refer to the long-term, human-caused warming level, not a single year that rides on natural variability like El Niño."
      - id: c
        text: "The WMO figure is unreliable because temperature datasets disagree with each other."
      - id: d
        text: "Warming estimates only count land temperatures, so the global figure overstates the trend."
    correct_choice_id: b
    explanation: "A single year combines the human-caused trend with natural variability — the 2023–24 El Niño pushed 2024 well above the underlying trend line, just as a La Niña year falls below it. The Paris targets reference the long-term level (roughly decadal averages), currently about 1.3–1.4°C. So the limit has not formally been breached — though with the 2023–2025 three-year average itself topping 1.5°C, the trend is on course to cross it within about a decade. Choices (c) and (d) are factually wrong: the major datasets are independent and concordant, and they cover ocean and land."
    concepts: [climate, paris-agreement]

  - id: q3
    kind: multiple-choice
    text: "IPCC AR6's scenario table spans best-estimate warming from 1.4°C (SSP1-1.9) to 4.4°C (SSP5-8.5) by 2081–2100. What primarily accounts for the spread between those rows?"
    choices:
      - id: a
        text: "Scientific disagreement about how much warming a given amount of CO2 produces."
      - id: b
        text: "Different assumptions about future human emissions — the rows are conditional menus, not competing forecasts."
      - id: c
        text: "Random natural variability, which makes century-scale warming unpredictable."
      - id: d
        text: "Measurement uncertainty in the historical temperature record."
    correct_choice_id: b
    explanation: "The rows differ by emissions pathway — human choices about energy, policy, and growth — not by physics. Physical uncertainty (climate sensitivity) shows up as the *range around* each row's best estimate, and it is much smaller than the spread *between* rows. That is why the IPCC calls the SSPs conditional projections rather than predictions: the biggest unknown in 2100's temperature is what people decide to emit. Current-policy analyses (UNEP's Emissions Gap Report 2025) place the world's trajectory near the middle rows, around 2.3–2.8°C."
    concepts: [climate]

  - id: q4
    kind: multiple-choice
    text: "A country funds three projects: (1) a seawall protecting a coastal capital, (2) a subsidy making electric buses cheaper than diesel ones, and (3) a pilot plant capturing CO2 directly from the air for permanent burial. Using the lesson's three response categories, what are they, in order?"
    choices:
      - id: a
        text: "Adaptation, mitigation, geoengineering (carbon dioxide removal)."
      - id: b
        text: "Adaptation, mitigation, mitigation."
      - id: c
        text: "Mitigation, adaptation, geoengineering."
      - id: d
        text: "Adaptation, geoengineering, mitigation."
    correct_choice_id: a
    explanation: "The seawall reduces damage from warming that arrives regardless — adaptation, with benefits captured locally. The bus subsidy reduces emissions — mitigation. Direct air capture does not reduce emissions or harden infrastructure; it actively intervenes in the climate system by drawing down CO2 — the carbon-dioxide-removal branch of geoengineering, still unproven at scale. Keeping the categories distinct matters because the three perspectives in this pack are, at bottom, different weightings of this menu."
    concepts: [climate, mitigation, adaptation]

  - id: q5
    kind: free-response
    text: "Paris's designers made NDCs legally nonbinding and withdrawal easy (Article 28's one-year clock) — and the United States has now used that exit twice. Make the strongest case that this design is a strength, and the strongest case that it is a fatal weakness."
    socratic_seed: "Strength: the binding-quota alternative (Kyoto) failed — hard obligations deterred participation (the U.S. never ratified) and invited exit (Canada quit); Paris trades enforceability for universality, transparency, and a five-year ratchet, betting that visibility plus falling technology costs move behavior better than unenforceable mandates. Weakness: nonbindingness means the pledge-trajectory gap (2.3–2.8°C per UNEP 2025 versus the 1.5–2°C goals) carries no consequence, and easy exit lets the largest historical emitter defect whenever its politics swing — with the withdrawal effective January 27, 2026, canceling roughly 0.1°C of projected improvement and inviting free-riding by others. Strong answers connect the design to the free-rider problem and note that the real test is whether the ratchet-plus-transparency machinery outlasts defections."
    concepts: [climate, paris-agreement, treaty, multilateral]
