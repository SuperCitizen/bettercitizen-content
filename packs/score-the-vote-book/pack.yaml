slug: score-the-vote-book
title: Score the Vote
summary: >-
  A book-length advocacy case by Chris Borgia (2026) for score voting —
  rate every candidate on a scale, highest total wins — as the best practical
  repair for American elections. The chapters argue that the pick-one ballot
  manufactures spoilers, duopoly, and primary extremism; weigh the rival
  reforms (ranked-choice, STAR, approval) on simulations, real election
  returns, and court records; and close with a campaign playbook built on the
  Fargo and St. Louis approval-voting experiments. Ingested as a contested
  pack: the first-person advocacy voice is preserved, and each lesson carries
  named perspectives.
author: Chris Borgia
