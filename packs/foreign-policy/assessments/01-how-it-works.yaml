schema: bettercitizen.assessment/v1
lesson: how-it-works
questions:
  - id: q1
    kind: multiple-choice
    text: "When was the last formal U.S. declaration of war?"
    choices:
      - id: a
        text: "Korea (1950)"
      - id: b
        text: "Vietnam (1964)"
      - id: c
        text: "World War II (1941-1942)"
      - id: d
        text: "The Iraq War (2003)"
    correct_choice_id: c
    explanation: "The last formal U.S. declarations of war were in 1942 against Bulgaria, Hungary, and Romania. Korea, Vietnam, the Gulf, Afghanistan, and Iraq all proceeded under various authorizations short of formal declaration. The drift from declared wars to AUMF-based operations is a defining feature of post-WWII war-powers practice."
    concepts: [foreign-policy, war-powers]

  - id: q2
    kind: multiple-choice
    text: "What does the 2001 AUMF (Authorization for Use of Military Force) authorize?"
    choices:
      - id: a
        text: "Only force in Afghanistan."
      - id: b
        text: "Force against 'those nations, organizations, or persons' responsible for 9/11 and to prevent any future acts of international terrorism."
      - id: c
        text: "Force against any country designated a state sponsor of terrorism by the State Department."
      - id: d
        text: "Force against any country that has nuclear weapons capability."
    correct_choice_id: b
    explanation: "The 2001 AUMF is roughly 60 words long and has been used as legal basis for U.S. military operations in Afghanistan, Yemen, Somalia, Libya, Pakistan, Syria, Niger, Mali, Cameroon, Kenya, and other countries — including against ISIS, an organization that didn't exist in 2001. The expansive reading is itself contested but has been accepted by every administration since."
    concepts: [foreign-policy, aumf]

  - id: q3
    kind: multiple-choice
    text: "What is the difference between a 'mutual defense treaty ally' and a 'Major Non-NATO Ally' (MNNA)?"
    choices:
      - id: a
        text: "MNNAs are required to spend 2% of GDP on defense; treaty allies are not."
      - id: b
        text: "Treaty allies have a binding U.S. defense commitment ratified by the Senate; MNNAs have a designation conferring some defense-cooperation benefits without full treaty status."
      - id: c
        text: "MNNAs are NATO members; treaty allies are not."
      - id: d
        text: "There's no functional difference."
    correct_choice_id: b
    explanation: "Treaty allies (NATO members, Japan, South Korea, the Philippines, Australia, Thailand) have mutual-defense commitments ratified by the Senate. MNNAs (Israel, Egypt, Jordan, Argentina, Brazil, Bahrain, etc.) have designations conferring access to cooperative programs (foreign military financing, certain technology) without the binding mutual-defense commitment. The distinction matters enormously for crisis credibility."
    concepts: [foreign-policy, alliance-system]

  - id: q4
    kind: multiple-choice
    text: "At a summit, a President announces that the United States 'commits' to defend a new partner country. Nothing is ever submitted to Congress. Her successor disavows the commitment on day one. What did the partner actually have?"
    choices:
      - id: a
        text: "A binding treaty obligation — a President's public commitment binds successors until the Senate votes to withdraw from it."
      - id: b
        text: "A congressional-executive agreement, enforceable as a statute until repealed."
      - id: c
        text: "A political commitment with no domestic legal force — exactly the form a successor can walk away from with a signature."
      - id: d
        text: "Nothing unusual was lost: even Senate-ratified treaties lapse automatically when a new President takes office."
    correct_choice_id: c
    explanation: "Durability tracks the approval hurdle. A summit announcement that never goes to Congress is a political commitment — the Paris/JCPOA pattern, built for speed and unwound by a signature. A congressional-executive agreement (b) requires actual passage by both chambers, which never happened here. And treaties do not lapse with administrations (a, d) — that durability is precisely why the two-thirds Senate hurdle exists, and why foreign capitals price the difference between the instruments."
    concepts: [foreign-policy, treaty]

  - id: q5
    kind: free-response
    text: "The June 2025 Iran strikes produced a 48-hour report, one failed Senate resolution, and no other congressional action. Using this lesson's war-powers history, explain why the War Powers Resolution has constrained presidents so little — and name the one congressional tool presidents cannot work around."
    socratic_seed: "Press on the mechanics: every administration files reports 'consistent with,' never 'pursuant to,' the Resolution; only the 1975 Mayaguez report ever cited the clause that starts the 60-day clock, and after the fact; executives read 'hostilities' narrowly (Libya 2011) or declare them terminated on their own schedule (the June 2025 ceasefire). Then press on the math: binding the executive requires both chambers plus a veto-proof margin, which no war-powers measure has ever assembled. The tool that cannot be lawyered around is the appropriations power — force can be ordered, but money must be voted. Close by connecting that to the December 2025 Iraq-AUMF repeals: symbolically real, but irrelevant to operations resting on Article II claims alone."
    concepts: [foreign-policy, war-powers, war-powers-act]
