title: Free Speech and the First Amendment
summary: What the First Amendment actually protects and against whom — the state-action doctrine, the unprotected categories and their tests (Brandenburg, Counterman, Chaplinsky, Miller, Sullivan) — then the hard cases (hate speech, compelled speech, money as speech, students and public employees) and the modern fight over platforms, Section 230, content moderation, and government jawboning. The doctrine is among the most speech-protective in the world, and nearly every piece of it is contested by serious people on serious grounds.
