title: The Federal Budget
summary: Where the federal government's $7 trillion actually goes (mandatory programs, discretionary spending, and an interest bill that now exceeds defense), the strongest cases for fiscal consolidation, full-employment functional finance, and a public-investment standard for judging debt, and how the budget process actually works — appropriations, shutdowns, reconciliation, the debt ceiling, and the 2025–26 impoundment fights. The composition of spending is settled arithmetic; what the deficit means and who should bear the adjustment is genuinely contested.
