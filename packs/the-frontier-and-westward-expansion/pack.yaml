title: The Frontier and Westward Expansion
summary: From the Louisiana Purchase to the closing of the frontier, westward expansion roughly tripled the size of the United States and reshaped its economy, politics, and sense of itself. This pack traces the doctrine of manifest destiny and the territorial gains it justified, and examines how the idea of "the frontier" became central to American identity — including the wars, dispossession, and removal of Native nations that were part of the record.
