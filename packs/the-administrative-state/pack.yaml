title: The Administrative State
summary: How federal agencies actually make binding law — organic statutes and delegation, APA notice-and-comment, OIRA review and the 2025–26 executive-order regime, the Congressional Review Act's record-setting use, and hard-look judicial review — and why that machinery is in its deepest constitutional renovation since 1935. Chevron is overruled, the major questions doctrine is ascendant, nondelegation has three declared votes, and Humphrey's Executor awaits judgment in Trump v. Slaughter. The mechanics are settled law; whether insulated expertise or presidential control better serves accountable government is genuinely contested, and this pack steel-mans Landis, Hamburger, and the congressional reformers alike.
