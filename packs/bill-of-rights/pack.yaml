title: The Bill of Rights
summary: What the first ten amendments protect, why the Anti-Federalists forced
  them into the Constitution in 1791, and how their reach has changed since. The
  pack follows the full arc — Barron v. Baltimore confining the Bill of Rights to
  the federal government, the Fourteenth Amendment and selective incorporation
  extending it to the states, and the quiet amendments (Third, Seventh, Ninth,
  Tenth) that rarely reach a courtroom yet still shape constitutional argument.
