title: Voting systems — a neutral overview
summary: How plurality, ranked-choice (IRV), approval, score, and STAR voting actually work, system by system — what the ballot asks, how the count proceeds, and where each is used as of mid-2026. A second lesson weighs the tradeoffs, from Arrow's theorem and Gibbard–Satterthwaite to the empirical record on turnout, ballot errors, and the Burlington 2009 center squeeze. The neutral counterpart to the two advocacy book packs in this library.
