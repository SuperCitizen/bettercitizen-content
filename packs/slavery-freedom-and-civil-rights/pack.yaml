title: Slavery, Freedom, and Civil Rights
summary: From the colonies through the early republic, slavery was woven into American law and the Constitution itself, until civil war and the Reconstruction Amendments abolished it and promised equal citizenship. This pack traces that long struggle — through the betrayal of Reconstruction, the rise of Jim Crow, and the twentieth-century civil rights movement that sought to make the promise of equal citizenship real — grounded in the primary documents that mark each turning point.
