summary: Why U.S. housing has gotten so expensive in the past two decades, the strongest cases for supply-side (zoning reform), demand-side (subsidies and assistance), and tenant-protection-led approaches, and the live debate over zoning, mortgage finance, and homelessness response. Mostly local but increasingly federal — and the empirical story is clearer than the political coalition makes it look.
