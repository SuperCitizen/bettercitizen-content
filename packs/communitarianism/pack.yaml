summary: What the communitarian tradition actually believes (steel-manned by adherents), how it crosses the conventional left-right axis, the internal differences among civic-republican, religious-traditionalist, and progressive-communitarian streams, and how it relates to the other major American ideological traditions. Communitarianism is the most cross-cutting of the traditions in this pack — it has serious adherents among progressives, conservatives, and religious thinkers.
