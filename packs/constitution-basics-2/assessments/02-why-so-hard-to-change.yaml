schema: bettercitizen.assessment/v1
lesson: why-so-hard-to-change
questions:
  - id: q1
    kind: multiple-choice
    text: "Article V says amendments are valid \"when ratified by the Legislatures of three fourths of the several States, or by Conventions in three fourths thereof.\" With fifty states, what is the smallest number of states that can block an amendment?"
    choices:
      - id: a
        text: "Twelve"
      - id: b
        text: "Thirteen"
      - id: c
        text: "Seventeen"
      - id: d
        text: "Twenty-six"
    correct_choice_id: b
    explanation: "Three-fourths of fifty is 37.5, so ratification takes 38 states. If thirteen states decline, only 37 remain, and the amendment fails. Seventeen is the number that can block a convention call, which takes two-thirds of the states."
    concepts: [amendment-process, supermajority]

  - id: q2
    kind: multiple-choice
    text: "An amendment passes the House with two-thirds and the Senate with two-thirds. The President announces a veto. What is the effect of the veto?"
    choices:
      - id: a
        text: "None, because the President has no role in the amendment process"
      - id: b
        text: "The amendment dies unless both chambers override by two-thirds"
      - id: c
        text: "The amendment is delayed until the next Congress takes office"
      - id: d
        text: "The amendment goes to the Supreme Court for a final ruling"
    correct_choice_id: a
    explanation: "Article V does not mention the President. A proposed amendment is sent directly to the states, and nothing a President says can stop it. The two-thirds vote that would override a veto has, in effect, already been required just to propose the amendment."
    concepts: [amendment-process]

  - id: q3
    kind: multiple-choice
    text: "Which fact is the strongest support for the claim that the Equal Rights Amendment has been validly ratified?"
    choices:
      - id: a
        text: "Article V sets no time limit, and 38 states have voted to ratify"
      - id: b
        text: "Congress extended the original deadline from 1979 to 1982"
      - id: c
        text: "Five states voted to withdraw their earlier ratifications"
      - id: d
        text: "The Archivist stated in 2024 that the amendment cannot be published"
    correct_choice_id: a
    explanation: "Supporters rest their case on the text of Article V, which says an amendment is valid when three-fourths of the states ratify and mentions no deadline. The extension, the rescissions and the Archivist's statement are all facts that opponents cite, or that complicate the count."
    concepts: [amendment-process, ratification]

  - id: q4
    kind: multiple-choice
    text: "Madison warned that frequent appeals to the people would \"deprive the government of that veneration which time bestows on every thing.\" Which practice would he most likely oppose?"
    choices:
      - id: a
        text: "Holding a national vote on rewriting the Constitution every ten years"
      - id: b
        text: "Requiring two-thirds of Congress to propose an amendment"
      - id: c
        text: "Requiring three-fourths of the states to ratify an amendment"
      - id: d
        text: "Letting the courts interpret unclear words in the Constitution"
    correct_choice_id: a
    explanation: "Madison's concern is that a constitution reopened on a schedule would lose the respect that long standing gives it. A regular vote on rewriting it is the frequent appeal he feared, and it is close to what Jefferson favored. The supermajority rules in b and c are the safeguards Madison's side built."
    concepts: [amendment-process]

  - id: q5
    kind: free-response
    text: "Donald Lutz argued that when a constitution is very hard to amend, change moves into the courts. Using Madison's and Jefferson's words from this lesson, argue whether that is a strength or a weakness of the American system. Name one piece of evidence that would count against your view."
    concepts: [amendment-process, amendment]
    socratic_seed: "Who decides what the Constitution means when it cannot be amended, and who chose those people? Would Jefferson be satisfied with that answer? Would Madison?"
