slug: ranked-choice-voting-book
title: Rank the Vote
summary: >-
  How ranked choice voting is fixing American democracy — one ballot at a
  time. A book-length advocacy treatment by Chris Borgia (2026), ingested as
  a contested pack in the author's first-person voice. It diagnoses what the
  pick-one plurality ballot discards, walks the instant-runoff mechanics, and
  builds the evidence case from Maine, Alaska, two decades of American
  cities, and a century abroad — then gives the opposition's strongest
  arguments a full chapter, surveys the research literature costs and all,
  and closes with the legal landscape, the state-by-state map as of
  mid-2026, and a practical playbook for adoption and defense.
author: Chris Borgia
