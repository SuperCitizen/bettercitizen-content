title: Political Parties
summary: >-
  What American political parties actually are and why there are exactly two —
  the Framers' party-less Constitution colliding with parties by 1796,
  V. O. Key's three faces, the real org chart and the super-PAC economy that
  eclipsed it, and the party-systems history — plus the strongest cases for
  stronger parties, weaker parties, and the weak-parties/strong-partisanship
  diagnosis, and the live reform landscape of primary rules, fusion voting,
  proportional representation, party finance, and internal party democracy.
  Washington warned against parties while his own cabinet was splitting into
  them; the argument has never stopped.
