schema: bettercitizen.assessment/v1
lesson: how-it-works
questions:
  - id: q1
    kind: multiple-choice
    text: "Which is the second-largest source of federal revenue (after individual income taxes)?"
    choices:
      - id: a
        text: "Corporate income taxes"
      - id: b
        text: "Payroll taxes (Social Security + Medicare)"
      - id: c
        text: "Excise taxes"
      - id: d
        text: "Estate and gift taxes"
    correct_choice_id: b
    explanation: "Payroll taxes were about 33% of federal revenue in FY2025, second only to individual income taxes (about 51%). Corporate income taxes were under 9%. For a large share of working households, payroll taxes exceed income taxes paid — especially once the employer half, which economists generally treat as coming out of wages, is counted. The political rhetoric typically focuses on income taxes, which means much of the actual tax burden goes underdiscussed."
    concepts: [taxes]

  - id: q2
    kind: multiple-choice
    text: "What does the term 'effective tax rate' mean?"
    choices:
      - id: a
        text: "The rate on your next dollar of income."
      - id: b
        text: "The rate at which the IRS effectively collects taxes after audit."
      - id: c
        text: "Total taxes paid divided by total income."
      - id: d
        text: "The statutory rate Congress sets in law."
    correct_choice_id: c
    explanation: "Effective rate = total taxes / total income. The marginal rate (the rate on your next dollar) is generally higher than the effective rate because the standard deduction and the lower brackets shield the first dollars. The lesson's worked example: a single filer with a $100,000 salary in 2026 is 'in the 22 percent bracket' but owes $13,170 — an effective income-tax rate of about 13 percent. Confusing the two numbers is the most common arithmetic error in tax politics."
    concepts: [taxes]

  - id: q3
    kind: multiple-choice
    text: "In early 2026 a financial blog warns readers: 'Brace yourselves — the TCJA expires this year, so your tax rates are about to snap back to pre-2017 levels.' What is wrong with that warning?"
    choices:
      - id: a
        text: "Nothing — the TCJA's individual provisions expired on schedule at the end of 2025."
      - id: b
        text: "The TCJA never had an expiration date; its provisions were always permanent."
      - id: c
        text: "The One Big Beautiful Bill Act (July 2025) made the TCJA's individual rate structure and enlarged standard deduction permanent, so no reversion is scheduled — though OBBBA added its own new deductions that expire after 2028."
      - id: d
        text: "Only the corporate rate was scheduled to revert, so individual rates were never at stake."
    correct_choice_id: c
    explanation: "The TCJA really did schedule almost all of its individual provisions to die at the end of 2025 — that was the price of passing it through reconciliation. But the expiration never came: OBBBA (Pub. L. 119-21, signed July 4, 2025) made the seven-bracket rate structure, the enlarged standard deduction, and the $2,200 child tax credit permanent. The blog is recycling a pre-2025 talking point. The reverse confusion also matters: OBBBA's own headline deductions (tips, overtime, seniors, car loans) are deliberately temporary, lapsing after 2028."
    concepts: [taxes, tcja]

  - id: q4
    kind: multiple-choice
    text: "Why is corporate-tax incidence empirically contested?"
    choices:
      - id: a
        text: "It's not — corporations always bear the tax themselves."
      - id: b
        text: "Because the tax burden is split between shareholders, workers, and consumers, with the proportions depending on capital mobility, market structure, and time horizon."
      - id: c
        text: "Because the IRS doesn't collect it consistently."
      - id: d
        text: "Because Congress changes the rate too often to study."
    correct_choice_id: b
    explanation: "Who actually bears a corporate tax depends on economic responses. Some falls on shareholders (lower returns), some on workers (lower wages), some on consumers (higher prices). CBO assumes 75% to capital, 25% to labor in long-run analysis; some research suggests labor shares more. The split matters enormously for distributional analysis but is empirically uncertain — and the question of *who actually bears* the tax is separate from *who writes the check.*"
    concepts: [taxes, tax-incidence]

  - id: q5
    kind: free-response
    text: "The progressive-expansion advocate and the consumption-tax restructuring advocate both want a more progressive overall tax system, but propose very different mechanisms. State the strongest version of each side's argument about why their mechanism is better."
    socratic_seed: "Progressive-expansion: target the top of the income/wealth distribution directly through higher top rates, capital-gains parity with ordinary income, wealth taxes. The advantage is direct addressal of concentration. Consumption-tax restructuring: tax wealth when it's spent rather than when it's accumulated; achieve progressivity through brackets in the consumption-tax base; avoid the saving-disincentive of income taxation. The advantage is less distortion of the underlying economic decisions. Both sides care about progressivity; they disagree about what the right tax base is."
    concepts: [taxes, progressive-taxation, vat]
