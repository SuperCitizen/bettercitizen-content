schema: bettercitizen.assessment/v1
lesson: what-it-believes
questions:
  - id: q1
    kind: multiple-choice
    text: "Edmund Burke is often called the 'father of modern conservatism' even though he was a Whig in British parliamentary terms. Why?"
    choices:
      - id: a
        text: "He invented the term 'conservative' in 1790."
      - id: b
        text: "Reflections on the Revolution in France (1790) gave the canonical statement of skepticism toward revolutionary politics in favor of inherited institutions."
      - id: c
        text: "He was the first to argue against democracy."
      - id: d
        text: "He converted to Catholicism late in life."
    correct_choice_id: b
    explanation: "Burke's Reflections on the Revolution in France (1790) is the canonical defense of inherited institutions against revolutionary disruption. It introduced themes — order before freedom, accumulated wisdom, generational contract — that became central to the conservative tradition that emerged in the next century. Burke himself was a Whig, but the substance of his arguments became foundational for what conservatives later named themselves."
    concepts: [conservatism]

  - id: q2
    kind: multiple-choice
    text: "What did the post-WWII 'fusionist' synthesis combine?"
    choices:
      - id: a
        text: "Republicans and Democrats."
      - id: b
        text: "Traditionalists, free-market classical liberals, and anti-communists."
      - id: c
        text: "Religious conservatives and secular conservatives."
      - id: d
        text: "Northern and Southern conservative voters."
    correct_choice_id: b
    explanation: "Frank Meyer and William F. Buckley's fusionism combined three streams: traditionalists (Kirk's circle, focused on cultural and religious continuity), free-market classical liberals (Hayek and Friedman, focused on economic freedom), and anti-communists (Chambers, Burnham, focused on the Soviet threat). The synthesis defined American conservatism roughly 1955-2008."
    concepts: [conservatism]

  - id: q3
    kind: multiple-choice
    text: "Which of these is the strongest version of the national-conservative critique of classical-liberal conservatism?"
    choices:
      - id: a
        text: "Classical liberalism is too individualistic and ignores class."
      - id: b
        text: "Classical liberalism conflates one variant of conservatism (post-WWII fusionist) with conservatism as such, and the older conservative tradition was more comfortable with state action in service of national interests."
      - id: c
        text: "Classical liberalism is incompatible with religious commitment."
      - id: d
        text: "Classical liberalism produces inequality."
    correct_choice_id: b
    explanation: "The strongest national-conservative critique is historical: that the post-WWII fusionist synthesis was a particular response to particular conditions (Cold War, globalization, mass prosperity), and treating it as conservatism-as-such ignores the older Burkean and civic-republican traditions that were more comfortable with state action in service of national interests. Hazony's Conservatism: A Rediscovery makes this case at book length."
    concepts: [conservatism, national-conservatism]

  - id: q4
    kind: multiple-choice
    text: "A city's church-run shelter network, built up over decades, is failing financially. One councilmember proposes replacing it with a single city-run homelessness agency; another proposes routing public grants through the existing church network. Drawing on the core commitments in the lesson, which proposal is more conservative in design — and why?"
    choices:
      - id: a
        text: "The city-run agency: conservatives prefer consolidated, efficient administration."
      - id: b
        text: "The grants through the church network: the state's role is to support civil-society institutions, not displace them — even when that means spending public money."
      - id: c
        text: "Neither: conservatism opposes any public spending on social services."
      - id: d
        text: "Both equally: what matters to conservatives is the total amount spent, not the channel it flows through."
    correct_choice_id: b
    explanation: "The family-and-civil-society commitment makes the design, not the spending, the test: government action that reinforces the institutions doing the work (money routed through the church network, decisions kept local) is conservative in design; action that absorbs their functions into the state is not, however well-intentioned. Option (c) is the classic confusion the lesson flags — reflexive opposition to all programs describes a libertarian instinct, not conservatism's support-versus-displace test — and (a) and (d) miss that the channel is precisely what is at stake."
    concepts: [conservatism]

  - id: q5
    kind: free-response
    text: "In 1950 Lionel Trilling dismissed American conservative impulses as 'irritable mental gestures which seek to resemble ideas.' Using the history this lesson covers, evaluate his claim: what would you cite as the strongest evidence that the post-war movement refuted him — and what part of the fusionist synthesis suggests he was partly right that it lacked a single coherent philosophy?"
    socratic_seed: "Evidence against Trilling: within a generation of his remark the movement produced a serious intellectual canon (Kirk's The Conservative Mind, Hayek's Road to Serfdom, Strauss's Natural Right and History, Chambers's Witness), an institutional engine (National Review, 1955), and electoral victories (Goldwater's capture of the 1964 nomination, Reagan in 1980). Evidence he was partly right: the synthesis was a coalition, not a philosophy — Meyer's fusionism papered over real tensions (Hayek himself wrote 'Why I Am Not a Conservative'; Bozell attacked the synthesis from inside), and anti-communism supplied the practical glue. When the Soviet Union dissolved, the philosophical incoherence resurfaced — which is why the post-2016 fracture is evidence on both sides of the Trilling question. Push the learner: is a durable coalition of ideas different in kind from a single intellectual tradition, and does the difference matter?"
    concepts: [conservatism]
