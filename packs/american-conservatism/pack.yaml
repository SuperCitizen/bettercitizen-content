summary: What the American conservative tradition actually believes (steel-manned by adherents), the internal disagreements that have shaped it from Burke through Buckley to today's fusionists, populists, and national conservatives, and how it relates to other American ideological traditions. Conservatism is not a single position but a family of positions with overlapping commitments and genuine disagreements.
