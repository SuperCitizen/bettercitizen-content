schema: bettercitizen.assessment/v1
lesson: how-it-works
questions:
  - id: q1
    kind: multiple-choice
    text: "At an Iowa-style Democratic caucus in a precinct electing four delegates, the first alignment is: Adams 45%, Brown 30%, Castillo 12%, Drake 8%. What happens next?"
    choices:
      - id: a
        text: "Adams wins the precinct outright — the largest group takes all the delegates."
      - id: b
        text: "Castillo's and Drake's groups are non-viable (under 15%); their members get one chance to realign — join a viable group, or combine with each other (12 + 8 = 20%) to form a new viable group."
      - id: c
        text: "Castillo's and Drake's ballots are automatically transferred to their voters' next-ranked choices, as in ranked-choice voting."
      - id: d
        text: "The caucus repeats the count until one candidate clears 50 percent."
    correct_choice_id: b
    explanation: "In most precincts the Democratic viability threshold is 15 percent (25 percent where only two delegates are at stake, one-sixth where there are three). Non-viable groups don't lose automatically — their members realign in person, including by merging two non-viable groups into a viable one. Choice (c) is the classic confusion: a caucus realignment is public and physical, with no secret ballot and no automatic transfer; RCV does something analogous on paper. Final counts convert to delegates by formula — plurality (a) and majority-rerun (d) describe neither system."
    concepts: [caucuses]

  - id: q2
    kind: multiple-choice
    text: "In 2024 the DNC ordered New Hampshire to vote later in the calendar; New Hampshire state law requires its primary to be first in the nation, and the state voted January 23 anyway. What does the episode reveal about who controls the nominating process?"
    choices:
      - id: a
        text: "Federal law ultimately determines primary dates, and New Hampshire invoked it."
      - id: b
        text: "National parties can cancel a state-run primary they have not sanctioned."
      - id: c
        text: "Parties enforce their calendar only through delegate seating, while states control the elections they administer — so a determined state can hold an unsanctioned primary and absorb the penalty."
      - id: d
        text: "The Supreme Court schedules the nominating calendar when party and state disagree."
    correct_choice_id: c
    explanation: "The process is run by two sovereigns at once. No federal law dictates the nominating calendar; the party's only enforcement tool is refusing to seat delegates — which the DNC briefly did to New Hampshire before quietly seating them at the convention. The state, answering to its own first-in-the-nation statute, ran the primary regardless, and Biden won it with more than 63 percent as a write-in. Neither sovereign could simply command the other."
    concepts: [primaries, party-rules]

  - id: q3
    kind: multiple-choice
    text: "A state's law lets each party decide, cycle by cycle, whether unaffiliated voters may vote in its primary. Under the NCSL classification used in this lesson, that state is best described as..."
    choices:
      - id: a
        text: "Open — any voter may privately pick either party's primary."
      - id: b
        text: "Partially open — voters may cross over, but doing so is recorded or rebinds their registration."
      - id: c
        text: "Partially closed — the party, not the voter, holds the option to admit the unaffiliated."
      - id: d
        text: "Top-two — all candidates appear on one ballot and the top two advance."
    correct_choice_id: c
    explanation: "The discriminating question is who holds the choice. Partially closed states (nine as of NCSL's May 2026 update, including Connecticut, Maryland, Oregon, and Utah) let the party decide each cycle whether to admit unaffiliated voters. Open states (like Wisconsin and Michigan) give every voter a private choice; partially open states (like Iowa and Illinois) allow crossover but record or rebind it; top-two abolishes the party primary altogether."
    concepts: [primaries]

  - id: q4
    kind: multiple-choice
    text: "A statewide Democratic primary returns: Ramos 38%, Shah 27%, Tate 14.9%, Ulrich 13%, minor candidates 7.1%. How do the statewide delegates split — and what changes if the same result occurs in a Republican winner-take-all state after March 15?"
    choices:
      - id: a
        text: "All four named candidates receive delegates in proportion to their votes; under Republican rules the same proportional split applies."
      - id: b
        text: "Only Ramos and Shah qualify (15% threshold), splitting delegates roughly 58–42 in proportion to their qualifying vote; under post-March-15 Republican winner-take-all rules, Ramos takes every delegate."
      - id: c
        text: "Ramos takes all the delegates in both parties' systems, having won a plurality."
      - id: d
        text: "Tate qualifies at 14.9% because Democratic thresholds round to the nearest whole number."
    correct_choice_id: b
    explanation: "The Democratic threshold is a cliff, not a slope: 14.9 percent earns exactly zero statewide delegates, while Ramos and Shah divide the pool in proportion to their shares of the qualifying vote (38 and 27 of 65 — about 58 and 42 percent). In a Republican winner-take-all state after March 15 (RNC Rule 16 requires proportionality only for March 1–14 contests), a 38-percent plurality converts to 100 percent of the delegates. That single contrast is why Democratic races grind on while Republican races snap shut."
    concepts: [delegate-allocation, primaries]

  - id: q5
    kind: free-response
    text: "Using the three landmark cases from this lesson — Smith v. Allwright (1944), California Democratic Party v. Jones (2000), and Washington State Grange (2008) — explain why a state may lawfully abolish party primaries altogether, yet may not force a party's own primary open to all voters."
    socratic_seed: "The floor is Smith v. Allwright: when the primary is integral to the state's election system, it is state action, so constitutional guarantees like the Fifteenth Amendment reach inside it — the party cannot hide behind private-club status. The ceiling is Jones: the First Amendment's freedom of association means the state cannot hand a party's nomination — its standard-bearer — to nonmembers, which is what the blanket primary did. The synthesis is Grange: a top-two system survives because it nominates no one; candidates state only a 'preference' and advance as individuals, so the party is never forced to associate with anyone. Strong answers state the rule of thumb: states have wide latitude to design election systems around parties, and much less latitude to reach inside them."
    concepts: [primaries, party-rules]
