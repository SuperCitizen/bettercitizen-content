schema: bettercitizen.assessment/v1
lesson: what-it-is
questions:
  - id: q1
    kind: multiple-choice
    text: "What are the two core mechanical moves of partisan gerrymandering?"
    choices:
      - id: a
        text: "Concentration and dilution"
      - id: b
        text: "Packing and cracking"
      - id: c
        text: "Stacking and splitting"
      - id: d
        text: "Apportioning and reapportioning"
    correct_choice_id: b
    explanation: "Packing concentrates the opposition's voters into a few districts where they win by huge margins (wasting votes above the threshold); cracking splits them across multiple districts so they're a minority in each (wasting votes below the threshold). Both work by making the other side's votes count for less than yours, seat for seat."
    concepts: [gerrymandering]

  - id: q2
    kind: multiple-choice
    text: "Which of the following is NOT, by itself, evidence of gerrymandering?"
    choices:
      - id: a
        text: "An efficiency-gap value above 8%, sustained across several elections"
      - id: b
        text: "A district that hugs a coastline or river"
      - id: c
        text: "Documented partisan intent in the legislative record"
      - id: d
        text: "A map that produces durable partisan advantage outside the entire range of thousands of neutral simulated maps"
    correct_choice_id: b
    explanation: "Geographic constraints often produce non-compact shapes that aren't gerrymandering — and, conversely, a tidy-looking map can be a ruthless gerrymander. Shape is neither necessary nor sufficient; the analysis runs on vote-waste measures, outlier comparisons against neutral ensembles, or documented intent."
    concepts: [gerrymandering]

  - id: q3
    kind: multiple-choice
    text: "A five-district state has 100 voters per district. Party A wins two districts 90–10 and loses three districts 45–55. Counting surplus votes in wins (votes above the 50 needed) and all votes in losses as wasted, what does the map's efficiency gap tell you?"
    choices:
      - id: a
        text: "Nothing — Party A won fewer districts, so no votes were wasted unequally."
      - id: b
        text: "Party A wastes far more votes (80 surplus + 135 losing = 215) than Party B (20 losing + 15 surplus = 35), so the map is heavily tilted toward B even though A has a clear majority of votes statewide."
      - id: c
        text: "The gap is zero because both parties waste some votes."
      - id: d
        text: "Party B wastes more votes because it won more districts."
    correct_choice_id: b
    explanation: "Party A polls 315 of 500 votes — a 63% supermajority — yet wins only two seats, because it is packed into two 90–10 blowouts and cracked just below the line everywhere else. A's wasted votes: 40 surplus in each win (90−50) plus 45 in each of three losses = 215. B's: 10 in each of two losses plus 5 surplus in each of three wins (55−50) = 35. The efficiency gap, (215−35)÷500 = 36%, quantifies exactly the packing-plus-cracking signature the lesson's figure illustrates."
    concepts: [gerrymandering]

  - id: q4
    kind: multiple-choice
    text: "Chen and Rodden's 'unintentional gerrymandering' research showed that thousands of computer-drawn, intent-free maps of Florida mostly favored Republicans anyway. What is the correct lesson to draw?"
    choices:
      - id: a
        text: "Gerrymandering doesn't exist — all partisan bias is geography."
      - id: b
        text: "Democrats' urban clustering can produce seats-votes asymmetry without intent, so a bare mismatch isn't proof of foul play — the test is whether an enacted map is an outlier against neutral simulations that already bake the geography in."
      - id: c
        text: "Simulated maps are unreliable because computers can't follow districting law."
      - id: d
        text: "Urban voters are packed by law under the Voting Rights Act, which explains all observed bias."
    correct_choice_id: b
    explanation: "The Chen–Rodden finding cuts both ways. It defeats the inference 'lopsided outcome, therefore gerrymander' — under winner-take-all districts, a geographically concentrated party wastes its own votes. But it also supplies the cure: ensemble comparison. Because the neutral simulations already incorporate political geography, an enacted map that lands outside virtually the whole ensemble can't blame geography — the lines themselves are doing the work."
    concepts: [gerrymandering, redistricting]

  - id: q5
    kind: free-response
    text: "Distinguish partisan gerrymandering from racial gerrymandering. Why does the legal framework treat them differently — and why is the line between them so hard to police in practice?"
    socratic_seed: "Consider the constitutional source of authority for each kind of claim: the Reconstruction Amendments and the VRA give racial claims a federal hook that partisan claims (post-Rucho) lack. Then consider what happens when race and party correlate strongly in a state — every racial line is also a partisan line, so which body of law applies turns on a question of motive that map-drawers control the evidence for."
    concepts: [gerrymandering, equal-protection]
