schema: bettercitizen.assessment/v1
lesson: how-it-works
questions:
  - id: q1
    kind: multiple-choice
    text: "A state requests a photo ID at the polls, but a voter without one may sign a sworn affidavit and cast a regular ballot that counts with no further action. In NCSL's classification, this state is:"
    choices:
      - id: a
        text: "Strict photo ID"
      - id: b
        text: "Non-strict photo ID"
      - id: c
        text: "Strict non-photo ID"
      - id: d
        text: "Not a voter-ID state at all"
    correct_choice_id: b
    explanation: "The strict/non-strict axis turns on what happens to a voter WITHOUT the document: in strict states (10 as of mid-2026) the voter casts a provisional ballot that counts only if ID is shown later; in non-strict states a fallback like an affidavit lets the ballot count without a return trip. Because this state asks for a photo ID specifically, it joins the 14 non-strict photo states (Texas, Florida, Michigan, and others). It absolutely counts as one of the 36 voter-ID states — option (d) confuses 'has a fallback' with 'has no rule.'"
    concepts: [voter-id]

  - id: q2
    kind: multiple-choice
    text: "A Coloradan receives her ballot in the mail without asking; a Pennsylvanian must request a mail ballot but needs no reason; a Texan under 65 must give a qualifying excuse. Which describes the three regimes, in order?"
    choices:
      - id: a
        text: "All-mail election state; no-excuse absentee state; excuse-required absentee state"
      - id: b
        text: "No-excuse absentee state; all-mail state; excuse-required state"
      - id: c
        text: "All three are versions of no-excuse absentee voting"
      - id: d
        text: "All-mail state; excuse-required state; no-excuse state"
    correct_choice_id: a
    explanation: "Colorado is one of the 8 states (plus D.C.) that automatically mail every active registered voter a ballot. Pennsylvania sits in the no-excuse middle of the spectrum — any voter may request, no justification needed — along with enough states that roughly two-thirds of the country has no-excuse or better. Texas anchors the excuse-required end (about 15 states), limiting mail voting to listed categories like age 65+, disability, or absence. Same ballot, three very different default settings."
    concepts: [mail-ballots]

  - id: q3
    kind: multiple-choice
    text: "Which of these is the ONLY voter-ID requirement imposed by federal law?"
    choices:
      - id: a
        text: "All voters must show photo ID in federal elections."
      - id: b
        text: "First-time voters who registered by mail without verifiable identification must show some form of ID (photo or non-photo) the first time they vote."
      - id: c
        text: "Voters must present proof of citizenship when registering."
      - id: d
        text: "Federal law bans states from requiring any ID at all."
    correct_choice_id: b
    explanation: "HAVA (2002) contains the entire federal ID rule: a narrow first-time-voter check for mail registrants who didn't verify identity at registration. Everything else — photo requirements, strictness, fallbacks — is state law, which is why the map varies so much. Proof of citizenship at registration (c) is what the SAVE Act would add; as of mid-2026 federal registration still runs on sworn attestation. Knowing how thin the federal floor is explains why this entire policy fight is fought state by state."
    concepts: [voter-id, hava]

  - id: q4
    kind: multiple-choice
    text: "An election office flags a returned mail ballot because the envelope signature doesn't match the file. In roughly two-thirds of states, what happens next?"
    choices:
      - id: a
        text: "The ballot is secretly counted anyway."
      - id: b
        text: "The ballot is automatically rejected with no recourse."
      - id: c
        text: "Officials must notify the voter and provide a window to cure the defect — confirm identity so the ballot counts."
      - id: d
        text: "The voter is referred for prosecution."
    correct_choice_id: c
    explanation: "Notice-and-cure is the system's answer to the fact that signature verification produces false positives — and rejection rates run higher for first-time, young, and nonwhite mail voters. In the remaining states a flagged ballot is simply rejected, which is why identical voters' ballots can meet different fates across a state line. Nationally about 1.2% of returned mail ballots were rejected in 2024. A mismatch triggers verification, not prosecution — fraud requires intent, and a shaky signature isn't evidence of it."
    concepts: [mail-ballots]

  - id: q5
    kind: free-response
    text: "The U.S. runs fifty-one election systems on a thin federal floor. Make the best one-paragraph case that this decentralization is a security FEATURE, then the best one-paragraph case that it is an access BUG. Which do you find more convincing, and what fact from the lesson does your answer lean on?"
    socratic_seed: "Feature: no single point of failure — an attacker must compromise thousands of independently run county systems with different equipment and rules; states adapt rules to local geography; HAVA's floor plus state experimentation produced innovations like all-mail voting and risk-limiting audits. Bug: your practical ability to vote by mail or without a driver's license depends on your address; identical voters' flagged ballots get cured in one state and discarded in the next; uniform rights arguably require uniform rules. Strong answers notice these aren't symmetrical claims — one is about attack surface, the other about equal treatment — so both can be true at once."
    concepts: [voter-id, mail-ballots, hava]
