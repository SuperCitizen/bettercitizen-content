schema: bettercitizen.assessment/v1
lesson: how-it-works
questions:
  - id: q1
    kind: multiple-choice
    text: "A consultant is paid $50,000 per quarter by a defense contractor. She makes a dozen calls to Pentagon officials about a procurement rule, and the work takes about a third of her time. Her colleague at the same firm is paid the same amount, advises the same client on exactly whom to call and what to say — but makes no calls himself and spends 10% of his time on the account. Under the Lobbying Disclosure Act, who must register?"
    choices:
      - id: a
        text: "Both — they are paid to influence federal policy for a client."
      - id: b
        text: "Only the consultant: she is paid, makes more than one lobbying contact, and exceeds the 20% time threshold. Her colleague makes no contacts and is under the threshold, so he is a legally invisible 'shadow lobbyist.'"
      - id: c
        text: "Neither — defense procurement advice is exempt from the LDA."
      - id: d
        text: "Only the colleague: strategic advice is the activity the LDA was written to capture."
    correct_choice_id: b
    explanation: "LDA registration requires all three elements: compensation, more than one lobbying contact, and at least 20% of time for that client in the quarter. The consultant meets all three. The colleague fails two — no contacts, under 20% — so his lobbying-shaped work never appears in any disclosure. LaPira and Thomas estimate roughly half the policy-influence workforce sits on his side of the line, which is why disclosed totals (a record $5.08 billion in 2025) are a floor, not a measurement."
    concepts: [lobbying, lobbying-disclosure-act]

  - id: q2
    kind: multiple-choice
    text: "Where does the word 'lobbyist' actually come from?"
    choices:
      - id: a
        text: "President Grant coined it for the favor-seekers who ambushed him in the lobby of the Willard Hotel."
      - id: b
        text: "It derives from the 'lobby' where petitioners waited outside legislative chambers — American papers used 'lobby member' as early as 1817 and 'lobbying' by the 1820s, decades before Grant's presidency."
      - id: c
        text: "It was introduced by the Lobbying Disclosure Act of 1995 as a legal term of art."
      - id: d
        text: "It originated as a slur for foreign agents during the First World War."
    correct_choice_id: b
    explanation: "The Willard Hotel story is Washington's favorite false etymology. The term grew out of the literal lobby outside legislative chambers — usage traces to Westminster centuries earlier, and American newspapers were applying 'lobby member' to influence-peddlers in Albany by 1817. The takeaway is more than trivia: paid petitioning predates and outlasts any one era's scandals, which is why the constitutional anchor is the First Amendment's petition clause rather than any statute."
    concepts: [lobbying]

  - id: q3
    kind: multiple-choice
    text: "HLOGA (2007) doubled the Senate's post-employment 'cooling-off' period. A former senator in month six of that period may legally do which of the following for a paying client?"
    choices:
      - id: a
        text: "Call her former colleagues on the Senate floor, since the ban covers only committee staff."
      - id: b
        text: "Nothing related to policy — the cooling-off period is a total ban on influence work."
      - id: c
        text: "Plan strategy, supervise the firm's other lobbyists, and decide exactly whom they should call — so long as she makes no lobbying contacts herself."
      - id: d
        text: "Lobby the House but not the Senate, since each chamber's ban covers only itself."
    correct_choice_id: c
    explanation: "The 2-year Senate ban (1 year for House members) under 18 U.S.C. §207 prohibits the former senator's own lobbying contacts with anyone in Congress — both chambers, members and staff. But it does not prohibit advising, strategizing, or supervising others' contacts. That gap between 'contact' and 'influence' is why critics call cooling-off periods a speed bump, and why restriction-first reformers propose 5-year or lifetime bans."
    concepts: [lobbying, revolving-door, hloga]

  - id: q4
    kind: multiple-choice
    text: "What did Hall & Wayman (1990) and the broader lobbying-effectiveness literature find about what moneyed interests actually get for their effort?"
    choices:
      - id: a
        text: "Money reliably flips floor votes on major, high-visibility bills."
      - id: b
        text: "Money mobilizes friendly legislators' effort — showing up, offering amendments, working the markup — so influence concentrates in bill content and committee detail rather than roll-call outcomes."
      - id: c
        text: "Lobbying has no detectable effect on any stage of the process."
      - id: d
        text: "Lobbying works only when paired with explicit campaign-contribution promises."
    correct_choice_id: b
    explanation: "Hall & Wayman's 'Buying Time' found that money and lobbying buy legislative effort from allies, not votes from opponents — the action is in markup, technical amendments, and exemptions. This squares with Baumgartner et al.'s later finding that resources explain under 5% of outcome variance: the visible floor fight is the wrong place to look. If you want to find lobbying's fingerprints, read the bill text, not the vote tally."
    concepts: [lobbying]

  - id: q5
    kind: free-response
    text: "Disclosed federal lobbying hit $5.08 billion in 2025, yet business interests outspend labor and public-interest groups roughly 34 to 1, and Baumgartner's team found the better-resourced side barely wins more often. Using Olson and Schattschneider, explain how all three facts fit together."
    socratic_seed: "Olson's Logic of Collective Action explains the 34:1 asymmetry: concentrated interests (firms, trade associations) organize cheaply because each member's stake is large; diffuse interests (consumers, taxpayers) free-ride, so they barely appear in the pressure system regardless of how big their aggregate stake is. Schattschneider's 'heavenly chorus with the upper-class accent' names the resulting bias in who is heard at all. Baumgartner's outcome finding is compatible because outcomes are measured among issues that surfaced — agenda-setting bias and a 60% status-quo rate mean the asymmetry can operate upstream (what gets proposed, what never does, what existing policy already encodes) even while money predicts little among live fights. Strong answers distinguish outcome influence from agenda influence and note that the status quo itself embeds past organized-interest wins."
    concepts: [lobbying]
