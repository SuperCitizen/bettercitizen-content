summary: How U.S. lobbying actually works — registration, spending, the revolving door, foreign agent registration — plus the strongest cases for restriction, transparency-only, and structural reform. Lobbying is an activity protected by the First Amendment's petition clause, but the modern apparatus is far larger and more concentrated than the Founders contemplated.
