title: Commerce and American Capitalism
summary: Trade, money, and markets have shaped the United States from its founding, when Americans debated whether the new nation should be a commercial republic or an agrarian one. This pack traces that arc — the constitutional national market, the Banks of the United States, and the market revolution; the post-Civil-War rise of big business and the first antitrust laws; and the era of panics, the Federal Reserve, the New Deal regulatory state, and the modern mixed economy.
