bio_md: Former U.S. Attorney General (2021-2025) under President Joe Biden. Previously served as a judge on the U.S. Court of Appeals for the D.C. Circuit from 1997 to 2021, including as chief judge. Nominated to the Supreme Court by President Obama in 2016, but the Senate Republican majority declined to hold hearings. As AG, oversaw the appointment of special counsels investigating Donald Trump and Hunter Biden.
