  - slug: nato-and-alliances
    stance: Deepened the U.S.-Japan alliance and championed the 'Free and Open Indo-Pacific' concept and the Quad with the U.S., Australia, and India
  - slug: taiwan-and-china
    stance: Emphasized Taiwan's strategic importance and pushed back against Chinese coercion in the East and South China Seas
  - slug: military-spending
