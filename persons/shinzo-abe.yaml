bio_md: Late Prime Minister of Japan and Japan's longest-serving prime minister, holding the office from 2006 to 2007 and again from 2012 to 2020. A leader of the Liberal Democratic Party (LDP), he championed the economic program known as 'Abenomics' and a more assertive Japanese foreign and security policy. He was assassinated in Nara in July 2022.
