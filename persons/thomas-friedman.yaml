bio_md: Foreign-affairs columnist for The New York Times and a three-time Pulitzer Prize winner. Author of widely read books on globalization and geopolitics, including 'The Lexus and the Olive Tree', 'The World Is Flat', and 'Thank You for Being Late'. He has covered the Middle East and U.S. foreign policy for decades.
