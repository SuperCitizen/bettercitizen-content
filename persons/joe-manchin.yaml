bio_md: Former US Senator from West Virginia, serving from 2010 to 2025. Former Governor of West Virginia from 2005 to 2010. Registered as an independent in May 2024 after a career as a Democrat. Pivotal centrist vote during the 117th Congress who shaped major legislation including the Inflation Reduction Act. Did not seek re-election in 2024.
