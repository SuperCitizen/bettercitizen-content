bio_md: Former US Senator from Arizona, serving from 2019 to 2025. Began her Senate term as a Democrat and registered as an independent in December 2022. Former US Representative and member of the Arizona legislature. Known as a centrist who frequently broke with progressive priorities, particularly on the filibuster and tax policy. Declined to seek re-election in 2024.
