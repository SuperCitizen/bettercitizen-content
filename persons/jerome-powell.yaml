bio_md: Chair of the Federal Reserve since February 2018. Originally nominated by President Donald Trump and renominated by President Joe Biden in 2022. Previously served as a Fed governor since 2012, as an undersecretary at the Treasury Department under President George H. W. Bush, and as a partner at the Carlyle Group. Lawyer by training rather than an academic economist — atypical for a modern Fed chair.
