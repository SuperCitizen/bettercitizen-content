bio_md: Crown Prince and Prime Minister of Saudi Arabia, widely known as MBS. Son of King Salman, he has been the de facto ruler of the kingdom since the mid-2010s. He launched the Vision 2030 economic-diversification program and has overseen sweeping social, economic, and political changes, alongside controversies including the war in Yemen and the killing of journalist Jamal Khashoggi.
