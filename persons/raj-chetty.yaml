bio_md: Indian-American economist and the William A. Ackman Professor of Public Economics at Harvard University. Director of Opportunity Insights, a research and policy institute. Recipient of the John Bates Clark Medal in 2013 and a MacArthur Fellow. His research uses big data to study economic opportunity, intergenerational mobility, education, and inequality.
