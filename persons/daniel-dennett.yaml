bio_md: American philosopher, cognitive scientist, and longtime co-director of the Center for Cognitive Studies at Tufts. Author of *Consciousness Explained*, *Darwin's Dangerous Idea*, *Breaking the Spell*, and *From Bacteria to Bach and Back*. One of the "Four Horsemen" of New Atheism alongside Hitchens, Harris, and Dawkins, and a leading naturalist voice on free will, evolution, and the philosophy of mind. Died April 2024.
