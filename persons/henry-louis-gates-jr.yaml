bio_md: American literary critic, historian, and filmmaker. Alphonse Fletcher University Professor at Harvard University and director of the Hutchins Center for African and African American Research. Host of the PBS series Finding Your Roots, which uses genealogical and DNA research to trace the family histories of public figures. Author and editor of numerous works on African American history and literature.
