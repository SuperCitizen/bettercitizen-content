bio_md: Former U.S. Treasury Secretary (2021-2025) under President Joe Biden. The first woman to hold that position. Previously served as the 15th chair of the Federal Reserve (2014-2018), the first woman to lead the Fed. Earlier roles include chair of the Council of Economic Advisers under President Bill Clinton and president of the San Francisco Fed. Labor economist by training.
