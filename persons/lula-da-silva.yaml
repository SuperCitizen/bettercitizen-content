bio_md: President of Brazil since January 2023, serving his third non-consecutive term. A former metalworker and union leader, he co-founded the Workers' Party (PT) and previously served as president from 2003 to 2010. After a corruption conviction was annulled by Brazil's Supreme Court, he returned to electoral politics and defeated Jair Bolsonaro in 2022.
