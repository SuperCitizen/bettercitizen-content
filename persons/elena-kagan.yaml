bio_md: Associate Justice of the U.S. Supreme Court since 2010. Nominated by President Barack Obama. The fourth woman to serve on the Court. Previously served as U.S. Solicitor General (2009-2010) and as dean of Harvard Law School (2003-2009). Earlier roles include service in the Clinton White House. Known for clear, accessible prose in her opinions and for forceful dissents in voting-rights and administrative-law cases.
