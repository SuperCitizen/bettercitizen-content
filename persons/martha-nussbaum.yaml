bio_md: American philosopher and Ernst Freund Distinguished Service Professor of Law and Ethics at the University of Chicago. Co-developed the capabilities approach with Amartya Sen. Author of more than two dozen books including Frontiers of Justice, Creating Capabilities, and The Monarchy of Fear. Her work spans ancient philosophy, political philosophy, ethics, and animal rights.
