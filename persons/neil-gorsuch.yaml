bio_md: Associate Justice of the U.S. Supreme Court since 2017. Nominated by President Donald Trump to fill the seat left vacant by Justice Antonin Scalia's death. Previously served on the U.S. Court of Appeals for the Tenth Circuit. Known for an originalist and textualist judicial philosophy, with notable opinions including Bostock v. Clayton County (extending Title VII protections to LGBTQ workers) and McGirt v. Oklahoma.
