slug: estate-tax
name: Estate tax
category: economy-and-taxation
summary: The federal tax on transfers of wealth at death, with an exemption above which estates pay 40% — currently exempting estates under ~$13.6M for individuals.
body_md: |-
  The federal estate tax has existed in some form since 1916. The exemption has risen dramatically: $675K (2001) → $5M (2011) → $13.6M (2024, inflation-adjusted from TCJA). The TCJA exemption is set to revert to roughly $7M after 2025 absent legislative action.

  Roughly 0.1% of estates owe any federal estate tax. Twelve states have their own estate or inheritance taxes with lower thresholds.

  Defenders argue the estate tax curbs dynastic wealth concentration and pairs naturally with stepped-up basis reform. Critics argue it punishes saving, hits family farms and businesses, and is largely avoidable through trusts and lifetime gifting.
spectrum:
  left: Progressives favor lowering the exemption (e.g. $3.5M), raising rates, and closing trust loopholes.
  center: Many moderates favor maintaining the current TCJA exemption or letting it sunset back to ~$7M.
  right: Most conservatives favor abolishing the estate tax (the "death tax") or further raising the exemption.
contested:
  perspectives:
    - label: Restore-the-estate-tax advocates
      summary: The estate tax is the most direct tool against dynastic wealth concentration. Lowering the exemption back toward historical levels and closing trust loopholes would touch the wealthiest 1-2%.
      key_concerns:
        - Limiting dynastic wealth
        - Closing GRAT and dynasty-trust loopholes
        - Equality of opportunity
    - label: Abolitionists
      summary: The estate tax is double-taxation on already-taxed savings. It hits family-owned farms and small businesses, distorts saving, and is largely avoided through expensive planning by the truly wealthy.
      key_concerns:
        - Double-taxation of saved income
        - Family farms and small businesses
        - Tax-planning industry capture
