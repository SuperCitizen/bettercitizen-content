slug: small-dollar-matching
name: Small-dollar matching programs
category: money-in-politics
summary: Public-financing programs that multiply small individual donations (e.g. 6-to-1 or 8-to-1) to qualifying candidates who cap large contributions and meet eligibility thresholds.
body_md: |-
  Small-dollar matching programs amplify low-dollar contributions. New York City's 8-to-1 match for its first $250 of in-district donations is widely studied; analyses show it has substantially increased the share of campaign funding from small donors and broadened the demographic and geographic donor base.

  The For the People Act and the Freedom to Vote Act each include a 6-to-1 federal match for House candidates who agree to lower contribution limits. Some cities (Seattle, Denver) experiment with "democracy vouchers" that give every resident a fixed amount of public funds to direct to candidates.

  Critics argue matching subsidizes fringe candidates and creates compelled-subsidy concerns. Supporters argue it shifts incentives away from large donors and makes campaigns reflect the broader public.
spectrum:
  left: Progressives strongly favor small-dollar matching as the most workable response to Citizens United.
  center: Reformers see matching as a constitutionally clean way to amplify small donors.
  right: Most conservatives oppose taxpayer-funded matching, especially when applied to candidates from opposing parties.
contested:
  perspectives:
    - label: Matching-program advocates
      summary: Multiplying small donations reorients candidates toward grassroots constituencies. NYC and Seattle programs broaden the donor base and reduce dependence on bundlers.
      key_concerns:
        - Empowering small donors
        - Diversifying the donor pool
        - Reducing dependence on bundlers
    - label: Taxpayer-cost objectors
      summary: Small-dollar matching uses taxpayer money to subsidize candidates many taxpayers oppose. Voluntary individual contributions are the proper measure of grassroots support.
      key_concerns:
        - Compelled subsidy of disliked speech
        - Cost to taxpayers
        - Incentives for fringe candidacies
