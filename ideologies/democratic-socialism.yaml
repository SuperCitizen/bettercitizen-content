slug: democratic-socialism
name: Democratic socialism
tradition: Western European social-democratic + American labor traditions
core_principles:
  - Universal social goods — healthcare, education, housing — as rights
  - Collective democratic control over key economic decisions
  - Strong labor movement and worker representation
  - Progressive taxation; redistribution to limit extreme inequality
  - Aggressive climate action coupled with worker transition
  - Liberal democracy and electoral politics — not revolutionary overthrow
key_thinkers:
  - name: Eugene V. Debs
    lifespan: 1855–1926
    influence: Five-time presidential candidate; founder of American socialist electoral politics.
  - name: Michael Harrington
    lifespan: 1928–1989
    influence: The Other America; founded Democratic Socialists of America.
  - name: A. Philip Randolph
    lifespan: 1889–1979
    influence: Civil-rights leader connecting labor and racial justice movements.
  - name: Bernie Sanders
    lifespan: 1941–
    influence: Brought democratic-socialist policy ideas into mainstream presidential politics.
key_orgs:
  - dsa
  - jacobin-magazine
  - working-families-party
related_ideologies:
  - american-progressivism
historical_period: Late-19th-century labor movement; American DSA tradition post-1982
