slug: social-democracy
name: Social democracy
tradition: Western European post-war welfare-state liberalism
core_principles:
  - A capitalist economy regulated and tempered by a robust welfare state
  - Universal public services — health, education, child care, pensions
  - Sectoral collective bargaining and strong worker representation
  - Progressive taxation and active labor-market policy
  - Commitment to liberal democracy and pluralism
  - Compatible with market dynamism if paired with strong social insurance
key_thinkers:
  - name: Eduard Bernstein
    lifespan: 1850–1932
    influence: Argued socialism should be reached through democratic reform rather than revolution.
  - name: Olof Palme
    lifespan: 1927–1986
    influence: Architect of the Swedish model; framed social democracy as deepening rather than replacing liberal democracy.
  - name: Tony Judt
    lifespan: 1948–2010
    influence: Ill Fares the Land — moral case for the post-war social-democratic settlement.
  - name: Lane Kenworthy
    lifespan: 1962–
    influence: Comparative empirical case that Nordic-style social democracy improves outcomes without sacrificing growth.
key_orgs:
  - socialist-international
  - progressive-policy-institute
related_ideologies:
  - american-progressivism
  - democratic-socialism
historical_period: Late-19th-century revisionist socialism; post-1945 European welfare states; ongoing globally
