slug: neoconservatism
name: Neoconservatism
tradition: Cold-War liberal anticommunism turned right
core_principles:
  - Active American leadership in the global order
  - Skepticism of détente; emphasis on moral clarity in foreign policy
  - Democracy promotion as a strategic and ethical imperative
  - Strong defense spending and willingness to use force
  - "Domestic policy: pragmatic, anti-utopian, supportive of bourgeois social norms"
  - Belief that ideas — including political ideology — shape the international system
key_thinkers:
  - name: Irving Kristol
    lifespan: 1920–2009
    influence: Self-described "godfather" of neoconservatism; framed it as a tendency, not a movement.
  - name: Norman Podhoretz
    lifespan: 1930–
    influence: Long-time Commentary editor who shaped neoconservative foreign-policy thinking.
  - name: Robert Kagan
    lifespan: 1958–
    influence: Of Paradise and Power — argued for assertive U.S. global leadership.
  - name: William Kristol
    lifespan: 1952–
    influence: Co-founded The Weekly Standard; defined the post-Cold-War neoconservative line.
key_orgs:
  - american-enterprise-institute
  - foreign-policy-initiative
  - commentary-magazine
related_ideologies:
  - american-conservatism
historical_period: Emerged 1960s–70s among Cold-War liberal intellectuals; peaked influence in early-2000s foreign policy
