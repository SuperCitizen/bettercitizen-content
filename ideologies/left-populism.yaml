slug: left-populism
name: Left populism
tradition: Egalitarian anti-corporate populism on the political left
core_principles:
  - A politics that pits working people against billionaires and concentrated capital
  - Strong antitrust enforcement and breakup of large corporate concentrations
  - Aggressive financial regulation and curbs on Wall Street power
  - Universal social programs framed as rights, not means-tested benefits
  - Campaign-finance reform to limit corporate influence in elections
  - Trade skepticism when deals are seen to favor multinational capital over workers
key_thinkers:
  - name: Huey Long
    lifespan: 1893–1935
    influence: Share Our Wealth program — early American left-populist template.
  - name: Bernie Sanders
    lifespan: 1941–
    influence: Brought left-populist economic themes into mainstream U.S. presidential politics.
  - name: Elizabeth Warren
    lifespan: 1949–
    influence: Translated anti-monopoly and consumer-protection populism into legislation.
  - name: Thomas Frank
    lifespan: 1965–
    influence: What's the Matter with Kansas? — diagnosed Democratic Party drift from working-class voters.
key_orgs:
  - working-families-party
  - open-markets-institute
related_ideologies:
  - american-progressivism
  - democratic-socialism
historical_period: American populist tradition from the 1890s People's Party through Occupy Wall Street to the 2016 Sanders campaign
