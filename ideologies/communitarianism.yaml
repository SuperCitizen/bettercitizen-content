slug: communitarianism
name: Communitarianism
tradition: Civic republican; relational liberalism
core_principles:
  - Individuals are constituted by communities; rights come with reciprocal obligations
  - Civic virtue, deliberation, and shared moral language as essential to a healthy republic
  - Strong intermediate institutions — neighborhoods, churches, schools — as the heart of public life
  - Skepticism toward both pure individualism and pure collectivism
  - Local self-government wherever feasible
  - Concern for moral ecology, not only economic outcomes
key_thinkers:
  - name: Alasdair MacIntyre
    lifespan: 1929–2025
    influence: After Virtue — argued modern ethics has lost its grounding in tradition and practice.
  - name: Michael Sandel
    lifespan: 1953–
    influence: Critiques of "the unencumbered self"; argues for a politics of the common good.
  - name: Amitai Etzioni
    lifespan: 1929–2023
    influence: Founded modern communitarian movement; framed responsibility as complement to rights.
  - name: Robert Putnam
    lifespan: 1941–
    influence: Bowling Alone — empirical case that civic and social capital underwrite democracy.
key_orgs:
  - american-academy-of-political-and-social-science
  - institute-for-american-values
related_ideologies:
  - american-conservatism
  - american-progressivism
historical_period: Civic-republican thread runs from Aristotle through Tocqueville; modern American form post-1980s
