slug: right-populism
name: Right populism
tradition: Anti-elite nationalism on the political right
core_principles:
  - Politics framed as the people versus a corrupt cosmopolitan elite
  - "Economic nationalism: tariffs, industrial policy, restrictionist trade and immigration"
  - Cultural traditionalism and defense of national identity
  - Skepticism of media, expert, and bureaucratic institutions
  - Strong, often personalist executive leadership
  - Mixed posture toward markets — favorable when they serve workers, hostile when they serve globalists
key_thinkers:
  - name: Patrick Buchanan
    lifespan: 1938–
    influence: Articulated America-First economic and cultural themes in 1990s primaries.
  - name: Steve Bannon
    lifespan: 1953–
    influence: Strategist who helped fuse economic nationalism, immigration restriction, and culture-war politics.
  - name: Viktor Orbán
    lifespan: 1963–
    influence: European model of "illiberal democracy" admired by parts of the U.S. right.
  - name: J.D. Vance
    lifespan: 1984–
    influence: Hillbilly Elegy author turned U.S. senator and standard-bearer of the new right.
key_orgs:
  - american-compass
  - claremont-institute
  - heritage-foundation
related_ideologies:
  - paleoconservatism
  - american-conservatism
  - nationalism
historical_period: Long history globally; ascendant in U.S. politics since the 2016 Trump campaign
