slug: christian-democracy
name: Christian democracy
tradition: Continental European post-WWII Catholic social teaching applied to politics
core_principles:
  - Centrist political program grounded in Christian social teaching
  - "Subsidiarity: decisions made at the smallest competent level"
  - "Solidarity: mutual obligations across classes and generations"
  - Support for both market economy and a robust social safety net
  - Defense of family, religious liberty, and intermediate institutions
  - European integration and rules-based international order
key_thinkers:
  - name: Jacques Maritain
    lifespan: 1882–1973
    influence: Integral humanism — philosophical foundation of post-war Christian democracy.
  - name: Konrad Adenauer
    lifespan: 1876–1967
    influence: Founding father of the Christian Democratic Union and post-war West Germany.
  - name: Alcide De Gasperi
    lifespan: 1881–1954
    influence: Italian Christian-democratic statesman; helped found European integration.
  - name: Pope Leo XIII
    lifespan: 1810–1903
    influence: Rerum Novarum (1891) — landmark encyclical defining modern Catholic social teaching.
key_orgs:
  - centrist-democrat-international
  - european-peoples-party
related_ideologies:
  - communitarianism
  - social-democracy
historical_period: 1890s Catholic social-teaching roots; dominant European post-war centrist tradition
