slug: green-politics
name: Green politics
tradition: Ecological politics rooted in deep environmentalism and grassroots democracy
core_principles:
  - Ecological sustainability as a precondition for all other policy
  - Social justice linked to environmental justice
  - Grassroots, participatory democracy and consensus decision-making
  - Non-violence and demilitarization
  - Decentralization of economic and political power
  - Precautionary principle in technology and resource use
key_thinkers:
  - name: Rachel Carson
    lifespan: 1907–1964
    influence: Silent Spring (1962) catalyzed modern environmental politics.
  - name: Murray Bookchin
    lifespan: 1921–2006
    influence: Social ecology — linked environmental crisis to hierarchical social structures.
  - name: Wangari Maathai
    lifespan: 1940–2011
    influence: Founder of the Green Belt Movement; Nobel Peace laureate.
  - name: Bill McKibben
    lifespan: 1960–
    influence: The End of Nature; founder of 350.org and key voice of the climate movement.
key_orgs:
  - green-party
  - global-greens
  - sierra-club
  - sunrise-movement
related_ideologies:
  - american-progressivism
  - democratic-socialism
historical_period: Modern movement from the late-1960s environmental awakening through global climate politics today
