slug: paleoconservatism
name: Paleoconservatism
tradition: Old Right; anti-interventionist American traditionalism
core_principles:
  - Strong national sovereignty; skepticism of supranational institutions
  - Restrictionist immigration policy and emphasis on cultural continuity
  - Non-interventionist foreign policy and skepticism of foreign entanglements
  - Protection of domestic industry, often through tariffs
  - Reverence for inherited religious, regional, and family traditions
  - Sharp critique of post-1960s social and economic liberalism
key_thinkers:
  - name: Russell Kirk
    lifespan: 1918–1994
    influence: Provided the philosophical scaffolding for traditionalist American conservatism.
  - name: Patrick Buchanan
    lifespan: 1938–
    influence: Popularized America-First themes that prefigured 21st-century right populism.
  - name: Samuel Francis
    lifespan: 1947–2005
    influence: Theorized the "managerial state" and the politics of the dispossessed middle.
  - name: Paul Gottfried
    lifespan: 1941–
    influence: Named the paleo/neo split and traced the genealogy of the postwar American Right.
key_orgs:
  - rockford-institute
  - american-conservative-magazine
  - chronicles-magazine
related_ideologies:
  - american-conservatism
  - right-populism
historical_period: Roots in pre-WWII Old Right; named in the 1980s in opposition to neoconservatism
