slug: post-liberalism
name: Post-liberalism
tradition: Critique of liberal individualism from religious and communitarian premises
core_principles:
  - Liberalism's emphasis on autonomy has corroded family, faith, and community
  - Markets and bureaucracies have crowded out mediating institutions
  - A common good — substantive, not merely procedural — should orient politics
  - Skepticism of both libertarian economics and progressive cultural politics
  - Industrial policy and labor power are compatible with social conservatism
  - Pluralism within a recognized moral framework, not endless neutrality
key_thinkers:
  - name: Patrick Deneen
    lifespan: 1964–
    influence: Why Liberalism Failed — landmark contemporary post-liberal critique.
  - name: Adrian Vermeule
    lifespan: 1968–
    influence: '"Common-good constitutionalism" — argues for a substantive moral reading of public law.'
  - name: Sohrab Ahmari
    lifespan: 1985–
    influence: Tyranny, Inc. — links labor-friendly economics to traditionalist culture.
  - name: Phillip Blond
    lifespan: 1966–
    influence: British "Red Tory" project; precursor to American post-liberal thought.
key_orgs:
  - american-compass
  - compact-magazine
  - ethics-and-public-policy-center
related_ideologies:
  - communitarianism
  - paleoconservatism
  - christian-democracy
historical_period: Emerged in the 2010s; influential in parts of the post-2016 American right
