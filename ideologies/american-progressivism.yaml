slug: american-progressivism
name: American progressivism
tradition: Progressive Era + New Deal liberalism + post-1960s social liberalism
core_principles:
  - Active government as a counterweight to concentrated economic power
  - Expansion of civil rights and equal protection
  - Workplace and consumer protections; collective bargaining
  - Public investment in education, infrastructure, and a social safety net
  - Environmental stewardship and climate action
  - Pluralism and multicultural inclusion
key_thinkers:
  - name: John Dewey
    lifespan: 1859–1952
    influence: Philosophical foundation for progressive education and democracy as a way of life.
  - name: Jane Addams
    lifespan: 1860–1935
    influence: Settlement-house movement; framed social reform as participatory democracy.
  - name: John Rawls
    lifespan: 1921–2002
    influence: A Theory of Justice — egalitarian liberalism and the difference principle.
  - name: Thurgood Marshall
    lifespan: 1908–1993
    influence: Civil-rights litigator and Supreme Court justice; pivotal in Brown v. Board.
key_orgs:
  - center-for-american-progress
  - aclu
  - sierra-club
related_ideologies:
  - democratic-socialism
  - communitarianism
historical_period: Progressive Era (1890s–1920s); modern form post-New Deal
# Two-axis spectrum placement (editorial approximation; each value in [-1, 1]).
# economic: -1 state-directed <-> +1 market-directed
# social:   -1 individual liberty <-> +1 social order / tradition
spectrum:
  economic: -0.55
  social: -0.4
