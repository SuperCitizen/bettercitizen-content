slug: nationalism
name: Nationalism
tradition: Politics organized around the nation-state as primary unit of loyalty
core_principles:
  - The nation — shared history, culture, language, often territory — as the basic unit of political loyalty
  - Strong sovereignty against supranational bodies and multinational capital
  - Restrictive immigration and citizenship policy oriented to assimilation
  - Preference for domestic industry and economic self-sufficiency
  - Robust defense and willingness to assert national interest abroad
  - Civic and cultural patriotism as the glue of public life
key_thinkers:
  - name: Johann Gottfried Herder
    lifespan: 1744–1803
    influence: Early theorist of cultural nationalism and the Volksgeist.
  - name: Ernest Renan
    lifespan: 1823–1892
    influence: '"What is a Nation?" — defined the nation as a daily plebiscite of shared memory and will.'
  - name: Yoram Hazony
    lifespan: 1964–
    influence: The Virtue of Nationalism — contemporary case for nationalism over imperial liberalism.
  - name: Anthony D. Smith
    lifespan: 1939–2016
    influence: Leading academic theorist of ethno-symbolic nationalism.
key_orgs:
  - national-conservatism-conference
  - edmund-burke-foundation
related_ideologies:
  - american-conservatism
  - paleoconservatism
  - right-populism
historical_period: 18th-century romantic origins; resurgent globally in the early 21st century
