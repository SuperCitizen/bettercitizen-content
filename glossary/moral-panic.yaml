slug: moral-panic
name: Moral Panic
short_definition: A widespread feeling of fear that some threat to the values or safety of society is imminent, often amplified by media.
body_md: ""
category: media-information
difficulty: advanced
status: active
etymology: "English: coined by sociologist Stanley Cohen in Folk Devils and Moral Panics (1972), analyzing the media-driven reaction to the Mods and Rockers youth subcultures in 1960s Britain"
why_it_matters: Moral panics have driven some of the worst policy decisions in history, from the Salem witch trials to the war on drugs — recognizing them prevents knee-jerk responses to exaggerated threats.
context_example: Sociologists identified the national alarm over satanic rituals in daycare centers as a textbook moral panic, noting that sensational media coverage far outpaced actual evidence.
