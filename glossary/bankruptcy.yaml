slug: bankruptcy
name: Bankruptcy
short_definition: A legal process through which individuals or businesses unable to repay debts can seek relief from some or all of their obligations.
body_md: ""
category: economy
difficulty: foundational
status: active
etymology: "Italian: banca rotta (broken bench). Medieval Italian bankers conducted business at benches in public squares; when they failed, their bench was broken to signal insolvency"
why_it_matters: Bankruptcy law reflects society's balance between holding debtors accountable and giving them a fresh start — it affects everything from personal credit to corporate restructuring.
context_example: The airline filed for Chapter 11 bankruptcy protection, allowing it to continue flying while restructuring $12 billion in debt and renegotiating union contracts.
