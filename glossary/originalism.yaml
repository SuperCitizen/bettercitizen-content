slug: originalism
name: Originalism
short_definition: A judicial philosophy that interprets the Constitution based on its original meaning at the time it was adopted.
body_md: ""
category: rights-and-law
difficulty: advanced
status: active
etymology: "English: 'original' from Latin originalis (beginning) + '-ism.' Popularized by Judge Robert Bork and Justice Antonin Scalia in the 1980s"
why_it_matters: Originalism has reshaped the federal judiciary and is the dominant philosophy among conservative justices, affecting rulings on gun rights, abortion, and executive power.
context_example: The justice's originalist analysis examined 18th-century legal commentaries and colonial-era statutes to determine what the Second Amendment's framers intended.
