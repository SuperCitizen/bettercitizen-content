slug: continuing-resolution
name: Continuing Resolution
short_definition: Temporary legislation that funds government agencies at current levels when regular appropriations bills have not been passed.
body_md: ""
category: government
difficulty: advanced
status: active
etymology: "Latin: continuare (to join together) + resolutio (a loosening)"
why_it_matters: Continuing resolutions have become the norm rather than the exception, reflecting Congress's inability to pass budgets on time and creating uncertainty for federal agencies.
context_example: With the fiscal year deadline approaching and no deal in sight, leadership introduced a continuing resolution to keep the government funded through March.
