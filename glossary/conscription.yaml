slug: conscription
name: Conscription
short_definition: Compulsory enlistment of citizens for military service, commonly known as the draft.
body_md: ""
category: military
difficulty: intermediate
status: active
etymology: "Latin: conscribere (to enroll, write together). The US draft was used in the Civil War, both World Wars, and Vietnam before ending in 1973"
why_it_matters: Conscription forces society to share the burden of war equally — its absence means that military service falls disproportionately on lower-income communities.
context_example: The end of conscription in 1973 created an all-volunteer force, but critics argue it disconnected most Americans from the reality of the wars fought in their name.
