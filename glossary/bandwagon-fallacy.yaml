slug: bandwagon-fallacy
name: Bandwagon Fallacy
short_definition: A fallacy that takes the popularity of a belief as evidence for its truth — "everyone thinks so, therefore it must be right."
body_md: ""
category: rhetoric
difficulty: foundational
status: active
etymology: Latin formal name argumentum ad populum ("appeal to the people"). The English nickname comes from 19th-century U.S. campaign parades where supporters literally jumped onto the candidate's bandwagon.
why_it_matters: Popularity is a real-world signal — but it is a signal about beliefs, not about facts. When a question is empirical, the number of people who believe an answer says nothing about whether the answer is correct.
context_example: "The op-ed's central claim was a bandwagon fallacy: 'Polls show 70 percent of voters support this policy, therefore it is sound,' without engaging the policy's actual mechanics or evidence."
