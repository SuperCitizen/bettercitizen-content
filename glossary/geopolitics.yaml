slug: geopolitics
name: Geopolitics
short_definition: The study of how geography, economics, and demographics influence politics and international relations.
body_md: ""
category: foreign-policy
difficulty: intermediate
status: active
etymology: "Swedish: geopolitik. Coined by Swedish political scientist Rudolf Kjellen in 1899 from Greek: ge (earth) + politikos (of citizens)"
why_it_matters: Geopolitics explains why control of the Strait of Hormuz, the South China Sea, and Arctic shipping routes drives conflict — geography shapes destiny.
context_example: The country's geopolitical significance stems from its position along the world's most important shipping route, through which 40% of global trade passes.
