slug: separation-of-powers
name: Separation of powers
short_definition: The constitutional design that divides federal authority among the legislative, executive, and judicial branches so that no one branch holds all of it.
body_md: ""
category: government
difficulty: foundational
status: active
etymology: "French Enlightenment: Montesquieu's De l'esprit des lois (1748) formalized the doctrine of trias politica (three powers)"
why_it_matters: Prevents any single branch from becoming too powerful.
context_example: The court struck down the executive order, citing separation of powers and Congress's exclusive authority over federal spending.
