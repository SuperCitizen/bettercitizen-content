slug: voter-suppression
name: Voter Suppression
short_definition: Efforts to reduce voter turnout, particularly among specific demographic groups, through restrictive laws, intimidation, or misinformation.
body_md: ""
category: elections
difficulty: intermediate
status: active
etymology: "Latin: supprimere (to press down, restrain)"
why_it_matters: Even small reductions in turnout among targeted communities can swing close elections, making voter suppression a persistent threat to democratic equality.
context_example: Voting rights groups sued the state, alleging that closing polling places in minority neighborhoods amounted to voter suppression.
