slug: fourth-estate
name: Fourth Estate
short_definition: The press and news media, regarded as a societal institution with an implicit role in keeping government accountable.
body_md: ""
category: media-information
difficulty: intermediate
status: active
etymology: "English: attributed to Edmund Burke (1787), who reportedly pointed to the press gallery in Parliament and said 'there sits the Fourth Estate, more important than them all' — after the Three Estates: clergy, nobility, commons"
why_it_matters: A free and independent press is essential to democracy — when the Fourth Estate fails, corruption and abuse of power go unchecked.
context_example: The investigative journalists who exposed the Pentagon Papers embodied the Fourth Estate's role as a check on government secrecy and deception.
