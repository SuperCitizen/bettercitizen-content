slug: jim-crow
name: Jim Crow
short_definition: State and local laws enforcing racial segregation in the Southern United States from the late 1870s through the 1960s.
body_md: ""
category: historical
difficulty: foundational
status: historical
etymology: "English: named after a minstrel show character — a caricature of Black Americans performed by white actor Thomas Dartmouth Rice in the 1830s. The laws bearing the name emerged in the 1870s"
why_it_matters: Jim Crow laws created a system of legal racial apartheid whose effects persist in wealth gaps, housing segregation, and criminal justice disparities today.
context_example: Under Jim Crow, Black Americans faced separate and unequal schools, hospitals, and public facilities, with the threat of lynching enforcing compliance with the racial order.
