slug: reconciliation
name: Reconciliation
short_definition: A special Senate procedure that allows budget-related legislation to pass with a simple majority (51 votes) rather than the 60 needed to overcome a filibuster.
body_md: ""
category: government
difficulty: expert
status: active
etymology: "Latin: reconciliare (to bring together again)"
why_it_matters: Major legislation like the ACA and tax reform passed through reconciliation, making it the primary vehicle for enacting the majority party's agenda.
context_example: Democrats used the budget reconciliation process to pass the Inflation Reduction Act without a single Republican vote, bypassing the filibuster entirely.
