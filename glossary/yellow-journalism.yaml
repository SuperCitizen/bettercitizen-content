slug: yellow-journalism
name: Yellow Journalism
short_definition: Sensationalized, exaggerated, or fabricated news reporting designed to attract readers, originated in the late 19th century.
body_md: ""
category: media-information
difficulty: intermediate
status: active
etymology: "English: named after the 'Yellow Kid' comic strip, which appeared in competing New York newspapers owned by Joseph Pulitzer and William Randolph Hearst in the 1890s. Their circulation war drove increasingly sensational reporting"
why_it_matters: Yellow journalism helped start the Spanish-American War and remains relevant — today's clickbait and outrage media are its direct descendants.
context_example: The tabloid's sensational coverage of the crime, complete with fabricated quotes and misleading photos, drew comparisons to the yellow journalism of the Hearst era.
