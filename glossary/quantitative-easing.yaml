slug: quantitative-easing
name: Quantitative Easing
short_definition: A monetary policy where a central bank buys government bonds and other financial assets to inject money into the economy.
body_md: ""
category: economy
difficulty: expert
status: active
etymology: "Modern English: coined by German economist Richard Werner in 1995 to describe the Bank of Japan's unconventional monetary stimulus"
why_it_matters: QE kept the economy afloat after the 2008 crisis and during COVID, but critics argue it inflated asset prices and widened wealth inequality.
context_example: The Fed's quantitative easing program expanded its balance sheet to nearly $9 trillion, raising concerns about the long-term consequences of money creation on this scale.
