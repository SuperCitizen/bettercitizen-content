slug: standing
name: Standing
short_definition: The legal right to bring a lawsuit, requiring the plaintiff to demonstrate sufficient connection to the harm alleged.
body_md: ""
category: rights-and-law
difficulty: advanced
status: active
etymology: "Old English: standan (to occupy a place). Legal usage evolved from the idea of having a 'place to stand' in court"
why_it_matters: Standing determines who gets to challenge government actions in court — without it, many constitutional questions would go unanswered.
context_example: The Supreme Court dismissed the case, ruling the plaintiffs lacked standing because they could not show they had suffered a concrete injury.
