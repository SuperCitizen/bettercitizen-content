slug: redistricting
name: Redistricting
short_definition: The process of redrawing electoral district boundaries, typically after each decennial census.
body_md: ""
category: elections
difficulty: intermediate
status: active
etymology: "Latin: re- (again) + districtus (restrained, separated)"
why_it_matters: Redistricting determines how political power is distributed, and whoever controls the process can entrench partisan advantages for a decade.
context_example: After the 2020 census, the state legislature's redistricting plan was challenged in court for diluting minority voting power.
