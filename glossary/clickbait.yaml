slug: clickbait
name: Clickbait
short_definition: Online content with a sensationalized headline designed to attract clicks, often misleading about the actual content.
body_md: ""
category: media-information
difficulty: foundational
status: active
etymology: "English: 'click' (a computer mouse action) + 'bait' (a lure). Coined in the early 2010s as digital advertising increasingly rewarded page views over content quality"
why_it_matters: Clickbait degrades the information environment by rewarding sensationalism over substance, training audiences to expect provocation rather than accuracy.
context_example: The headline 'Doctors HATE This One Weird Trick' is a classic example of clickbait that promises shocking information but delivers an advertisement.
