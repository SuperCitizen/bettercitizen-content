slug: marshall-plan
name: Marshall Plan
short_definition: The American initiative (1948-1952) to provide economic aid to rebuild Western European economies after World War II, named after Secretary of State George C. Marshall.
body_md: ""
category: historical
difficulty: intermediate
status: historical
etymology: Named after Secretary of State George C. Marshall, who outlined the plan in a commencement speech at Harvard University on June 5, 1947
why_it_matters: The Marshall Plan is history's most successful foreign aid program — it rebuilt Europe, contained Soviet expansion, and created the economic foundation for the transatlantic alliance.
context_example: The Marshall Plan provided $13 billion (about $170 billion today) in economic assistance, helping Western Europe's GDP surpass pre-war levels by 1952.
