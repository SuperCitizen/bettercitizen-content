slug: probable-cause
name: Probable Cause
short_definition: A reasonable basis for believing that a crime may have been committed, required for arrests and search warrants.
body_md: ""
category: rights-and-law
difficulty: intermediate
status: active
etymology: "Latin: probabilis (worthy of approval) + causa (reason). Enshrined in the Fourth Amendment (1791)"
why_it_matters: Probable cause is the Fourth Amendment standard that prevents police from searching or arresting people on a whim — it requires actual evidence.
context_example: The judge refused to issue a search warrant, finding that the officer's suspicion alone did not rise to the level of probable cause.
