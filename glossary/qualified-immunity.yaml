slug: qualified-immunity
name: Qualified Immunity
short_definition: A legal doctrine that shields government officials, including police officers, from civil lawsuits unless they violated 'clearly established' constitutional rights.
body_md: ""
category: rights-and-law
difficulty: advanced
status: active
etymology: "Latin: qualis (of what kind) + immunitas (exemption). Created by the Supreme Court in Harlow v. Fitzgerald (1982), expanding on earlier common-law protections for government officials"
why_it_matters: Qualified immunity is the central legal obstacle to holding police officers accountable for misconduct — reform advocates call it a license to violate rights without consequence.
context_example: The court granted the officer qualified immunity because no prior case had established that tasing a suspect who was already handcuffed violated the Fourth Amendment.
