slug: coattail-effect
name: Coattail Effect
short_definition: The tendency for a popular candidate at the top of the ticket to draw votes for other candidates of the same party.
body_md: ""
category: elections
difficulty: advanced
status: active
etymology: "English: from the image of riding on someone's coattails — being carried along by their momentum. Applied to politics in the 19th century"
why_it_matters: The coattail effect can determine control of Congress and state legislatures, making presidential popularity a decisive factor in down-ballot races.
context_example: The president's overwhelming victory had a massive coattail effect, sweeping 12 freshman members of his party into Congress in districts that had been considered safe for the opposition.
