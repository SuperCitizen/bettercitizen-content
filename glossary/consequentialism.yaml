slug: consequentialism
name: Consequentialism
short_definition: An ethical theory that judges actions by their outcomes — the right action is the one that produces the best overall consequences.
body_md: ""
category: social-cultural
difficulty: advanced
status: active
etymology: "Latin: consequentia (consequence, result) + '-ism.' Formalized by philosopher G.E.M. Anscombe in 1958, though the tradition traces to Jeremy Bentham's utilitarianism"
why_it_matters: Consequentialist thinking shapes policy debates from healthcare rationing to drone strikes — whenever we ask whether the ends justify the means, we are engaging in consequentialist reasoning.
context_example: The administration's consequentialist justification for the surveillance program — that it prevented terror attacks — was challenged by those who argued rights cannot be sacrificed for outcomes.
