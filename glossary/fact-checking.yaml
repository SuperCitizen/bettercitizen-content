slug: fact-checking
name: Fact-Checking
short_definition: The process of verifying claims and statements made in public discourse to determine their accuracy.
body_md: ""
category: media-information
difficulty: foundational
status: active
etymology: "English: 'fact' from Latin factum (a thing done, a deed) + 'checking' from Old French eschequier (to check, verify). Modern political fact-checking began with FactCheck.org in 2003"
why_it_matters: Fact-checking has become essential in an era of misinformation, though it faces challenges of scale, speed, and accusations of political bias.
context_example: The fact-checking organization rated the claim 'Pants on Fire,' noting that the statistic cited had been debunked by the agency that supposedly produced it.
