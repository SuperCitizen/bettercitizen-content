slug: oligarchy
name: Oligarchy
short_definition: A form of government in which power rests with a small number of people, often distinguished by wealth, family, or military power.
body_md: ""
category: social-cultural
difficulty: intermediate
status: active
etymology: "Greek: oligarkhia — from oligos (few) + arkhein (to rule)"
why_it_matters: The concentration of power in a small elite undermines democratic governance, and some scholars argue that many nominal democracies function as oligarchies in practice.
context_example: The political scientist's study concluded that the US functioned more as an oligarchy than a democracy, with policy outcomes driven by economic elites and organized interest groups.
