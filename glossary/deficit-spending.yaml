slug: deficit-spending
name: Deficit Spending
short_definition: Government spending that exceeds revenue, requiring borrowing to cover the gap.
body_md: ""
category: economy
difficulty: intermediate
status: active
etymology: "Latin: deficere (to fail, fall short) + Old French: despendre (to spend)"
why_it_matters: Deficit spending can stimulate the economy during downturns but adds to the national debt, creating tension between short-term needs and long-term fiscal health.
context_example: The government ran a $1.7 trillion deficit in fiscal year 2023, as both parties proved unwilling to cut spending or raise taxes.
