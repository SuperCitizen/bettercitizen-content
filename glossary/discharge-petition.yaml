slug: discharge-petition
name: Discharge petition
short_definition: In the U.S. House, a motion that forces a bill or resolution out of a committee that has not acted on it, once a majority of the whole House (218 members) has signed it.
body_md: ""
category: government
difficulty: intermediate
status: active
why_it_matters: It is the House majority's way around a committee chair or Speaker who won't schedule a bill. For members of the majority, signing one is public defiance of their own leaders, so most petitions stall short of 218, though several succeeded in the 119th Congress, including the one that forced a vote on the Epstein Files Transparency Act in 2025.
context_example: Five members of the majority party signed the minority's discharge petition, putting it over 218 and forcing a floor vote the Speaker had refused to schedule.
