slug: super-pac
name: Super PAC
short_definition: An "independent expenditure-only committee" that can raise unlimited sums from individuals, corporations, and unions, and spend on independent advocacy. Cannot directly coordinate with candidates.
body_md: ""
category: elections
difficulty: intermediate
status: active
etymology: "English acronym: PAC = Political Action Committee. 'Super' prefix added after the 2010 SpeechNow.org v. FEC ruling removed contribution limits"
why_it_matters: Super PACs have transformed campaign finance since Citizens United, allowing billionaires and corporations to pour unlimited money into elections while maintaining nominal independence from candidates.
context_example: The Super PAC supporting the frontrunner raised $150 million in a single quarter, outspending the candidate's own campaign by a three-to-one margin.
