slug: libertarianism
name: Libertarianism
short_definition: A political philosophy that prioritizes individual freedom and minimal government intervention in both personal and economic matters.
body_md: ""
category: social-cultural
difficulty: intermediate
status: active
etymology: "French: libertaire (libertarian). Latin: libertas (freedom). First used politically by French anarchist Joseph Déjacque in 1857"
why_it_matters: Libertarianism challenges both left and right by opposing government overreach in all domains — from drug laws to economic regulation to surveillance.
context_example: The libertarian senator filibustered the surveillance bill for 13 hours, arguing that the government had no right to collect citizens' phone records without a warrant.
