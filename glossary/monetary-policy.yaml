slug: monetary-policy
name: Monetary Policy
short_definition: Actions by a central bank to control the money supply and interest rates to promote economic stability.
body_md: ""
category: economy
difficulty: intermediate
status: active
etymology: "Latin: monetarius (of a mint, of money). From Moneta, an epithet of the Roman goddess Juno, in whose temple coins were minted"
why_it_matters: Monetary policy decisions by the Federal Reserve directly affect mortgage rates, employment levels, and the cost of borrowing for every American.
context_example: The Fed's decision to keep interest rates near zero for over a decade represented the most accommodative monetary policy in American history.
