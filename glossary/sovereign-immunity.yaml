slug: sovereign-immunity
name: Sovereign Immunity
short_definition: The legal doctrine that the government cannot be sued without its consent, rooted in the principle that 'the king can do no wrong.'
body_md: ""
category: rights-and-law
difficulty: advanced
status: active
etymology: "English: 'sovereign' from Old French soverain (supreme ruler) + 'immunity' from Latin immunitas (exemption). Derives from the English common law maxim rex non potest peccare (the king can do no wrong)"
why_it_matters: Sovereign immunity shields government from many lawsuits, and its extension to individual officials through 'qualified immunity' is at the center of police accountability debates.
context_example: The lawsuit against the federal agency was dismissed on sovereign immunity grounds, leaving the plaintiffs with no legal recourse for the contamination of their water supply.
