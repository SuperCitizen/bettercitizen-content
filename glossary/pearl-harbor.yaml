slug: pearl-harbor
name: Pearl Harbor
short_definition: The surprise Japanese military attack on the US naval base at Pearl Harbor, Hawaii, on December 7, 1941, which brought the United States into World War II.
body_md: ""
category: historical
difficulty: foundational
status: historical
etymology: Named after the harbor on the island of Oahu, Hawaii. The Hawaiian name Wai Momi means 'pearl waters,' referring to the pearl-producing oysters once found there
why_it_matters: Pearl Harbor ended American isolationism overnight and established the principle that surprise attacks demand immediate, total response — a framework applied to 9/11 sixty years later.
context_example: The attack on Pearl Harbor killed 2,403 Americans, sank four battleships, and prompted Congress to declare war on Japan with only one dissenting vote.
