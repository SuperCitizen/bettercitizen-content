slug: campaign-finance
name: Campaign finance
short_definition: The body of law governing how political campaigns raise and spend money. Federal contributions are subject to limits and disclosure under FECA, as modified by McCain-Feingold and Citizens United.
body_md: ""
category: elections
difficulty: intermediate
status: active
etymology: "English: 'campaign' from French campagne (open country, military expedition) + 'finance' from Old French finer (to end, settle a debt). Campaign finance regulation in the US began with the Tillman Act of 1907"
why_it_matters: Money in politics determines who can run for office and who has influence once they get there — campaign finance rules shape the balance of power between citizens, corporations, and the wealthy.
context_example: The candidate raised $250 million in small-dollar online donations, proving that campaign finance doesn't have to depend on wealthy donors or corporate PACs.
