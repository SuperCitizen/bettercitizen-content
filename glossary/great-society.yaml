slug: great-society
name: Great Society
short_definition: President Lyndon B. Johnson's set of domestic programs in the 1960s aimed at eliminating poverty and racial injustice, including Medicare, Medicaid, and the Civil Rights Act.
body_md: ""
category: historical
difficulty: intermediate
status: historical
etymology: "English: coined by speechwriter Richard Goodwin for LBJ's 1964 University of Michigan commencement address, envisioning a society that 'demands an end to poverty and racial injustice'"
why_it_matters: The Great Society produced Medicare, Medicaid, Head Start, and the Civil Rights Act — programs that remain pillars of American social policy and constant subjects of political debate.
context_example: Johnson's Great Society legislation passed with overwhelming bipartisan support, but the escalation of the Vietnam War drained the political capital needed to sustain its ambitions.
