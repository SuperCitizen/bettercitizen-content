slug: human-shields
name: Human Shields
short_definition: The use of civilians or prisoners to deter attacks on military targets, a violation of international humanitarian law.
body_md: ""
category: military
difficulty: advanced
status: active
etymology: "English: metaphorical usage of 'shield' (Old English scield, protection) applied to the illegal practice of using civilians as physical barriers"
why_it_matters: Human shields create an impossible moral dilemma for opposing forces — attack and kill civilians, or hold fire and allow the enemy to operate with impunity.
context_example: Investigators documented that fighters had deliberately positioned rocket launchers in school buildings, using the student population as human shields.
