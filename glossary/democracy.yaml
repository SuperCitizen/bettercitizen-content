slug: democracy
name: Democracy
short_definition: A system of government in which power is vested in the people, who rule either directly or through elected representatives.
body_md: ""
category: government
difficulty: foundational
status: active
etymology: "Greek: demos (people) + kratos (rule)"
why_it_matters: Understanding democracy is essential to civic participation — it is the foundation upon which all other political concepts rest.
context_example: The town hall meeting embodied direct democracy as residents voted on the proposed zoning changes themselves rather than leaving the decision to elected officials.
