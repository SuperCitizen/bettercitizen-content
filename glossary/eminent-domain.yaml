slug: eminent-domain
name: Eminent Domain
short_definition: The government's power to take private property for public use, with compensation to the owner.
body_md: ""
category: rights-and-law
difficulty: intermediate
status: active
etymology: "Latin: eminens (outstanding, prominent) + dominium (ownership, dominion). The concept derives from the sovereign's inherent authority over all land within the realm"
why_it_matters: Eminent domain is one of the most direct confrontations between individual property rights and the public interest, and its boundaries are constantly litigated.
context_example: The city invoked eminent domain to seize 62 homes in the path of the proposed highway, offering market-value compensation that homeowners argued was far below replacement cost.
