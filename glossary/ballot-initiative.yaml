slug: ballot-initiative
name: Ballot Initiative
short_definition: A process that allows citizens to propose legislation or constitutional amendments through petition, bypassing the legislature.
body_md: ""
category: elections
difficulty: intermediate
status: active
etymology: "Italian: ballotta (small ball used in secret voting) + Latin: initium (beginning)"
why_it_matters: Ballot initiatives give citizens a direct voice on policy when legislatures fail to act, and have been used to legalize marijuana, raise minimum wages, and reform redistricting.
context_example: Organizers collected over 800,000 signatures to place a Medicaid expansion initiative on the November ballot.
