slug: cloture
name: Cloture
short_definition: A procedure used to end a filibuster in the Senate, requiring a three-fifths vote (60 senators) to close debate.
body_md: ""
category: government
difficulty: advanced
status: active
etymology: "French: cloture (closure)"
why_it_matters: Cloture is the only way to end a filibuster, making it the procedural key to passing most legislation in the Senate.
context_example: The majority leader filed a cloture motion on the defense bill, setting up a vote to end debate within two days.
