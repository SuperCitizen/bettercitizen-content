slug: new-deal
name: New Deal
short_definition: A series of programs and reforms enacted by President Franklin D. Roosevelt in the 1930s to provide relief, recovery, and reform during the Great Depression.
body_md: ""
category: historical
difficulty: foundational
status: historical
etymology: "English: coined by FDR in his 1932 acceptance speech at the Democratic National Convention, promising 'a new deal for the American people' — evoking a fresh hand of cards"
why_it_matters: The New Deal created the modern American safety net — Social Security, unemployment insurance, financial regulation — and fundamentally redefined the relationship between government and citizens.
context_example: The New Deal's alphabet agencies — the WPA, CCC, TVA, and SEC — put millions to work and established regulatory frameworks that endure nearly a century later.
