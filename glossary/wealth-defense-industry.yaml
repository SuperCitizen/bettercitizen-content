slug: wealth-defense-industry
name: Wealth Defense Industry
short_definition: "The network of tax attorneys, accountants, wealth managers, and lobbyists that the very rich employ to protect their fortunes from taxation and redistribution."
body_md: ""
category: economy
difficulty: advanced
status: active
etymology: "English: the apparatus that conducts 'wealth defense'; political scientist Jeffrey Winters named the 'Income Defense Industry' in his book 'Oligarchy' (2011), and Chuck Collins popularized the broader 'Wealth Defense Industry' in 'The Wealth Hoarders' (2021)"
why_it_matters: "The concept reframes oligarchy as a market rather than a conspiracy: no coordination is needed, because a demand to keep taxes low meets a supply of paid professionals inside a body of law that rewards the transaction."
context_example: "Winters argues the United States is a 'civil oligarchy' in which the rich no longer need private armies and instead deploy a wealth defense industry to fend off progressive taxation."
