etymology: "English: coined by President Franklin D. Roosevelt in the 1942 Declaration by United Nations, referring to the Allied powers fighting the Axis"
why_it_matters: The UN provides the primary forum for international diplomacy and sets norms on human rights, but its Security Council veto system often paralyzes action on the most urgent crises.
context_example: Russia vetoed the UN Security Council resolution condemning its invasion, demonstrating the structural limitations of the veto system.
