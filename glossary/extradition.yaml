slug: extradition
name: Extradition
short_definition: The legal process by which one jurisdiction delivers a person accused or convicted of a crime to the jurisdiction where the crime was committed.
body_md: ""
category: rights-and-law
difficulty: intermediate
status: active
etymology: "Latin: ex (out of) + traditio (a handing over, delivery). From tradere (to hand over). The concept was formalized in bilateral treaties beginning in the 18th century"
why_it_matters: Extradition determines whether criminals can escape justice by crossing borders — and political asylum cases often hinge on whether extradition would result in persecution.
context_example: The UK approved the extradition of the WikiLeaks founder to face espionage charges in the United States, overruling concerns about press freedom and prison conditions.
