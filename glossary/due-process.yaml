slug: due-process
name: Due process
short_definition: The constitutional guarantee (5th & 14th Amendments) that government cannot deprive a person of life, liberty, or property without fair procedures and substantively justified rules.
body_md: ""
category: rights-and-law
difficulty: foundational
status: active
etymology: "Latin: debitus (owed) + processus (advance, course). Rooted in the Magna Carta (1215): 'by the law of the land'"
why_it_matters: Due process is the legal bedrock preventing arbitrary government action — without it, authorities could imprison, fine, or seize property from anyone without justification.
context_example: The court ruled the city violated due process when it demolished the building without giving the owner notice or an opportunity to be heard.
