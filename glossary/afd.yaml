slug: afd
name: AfD
short_definition: Alternative for Germany (Alternative für Deutschland) — a right-wing populist political party in Germany, the largest opposition party, controversial for its anti-immigration stance and accusations of extremism.
body_md: ""
category: foreign-policy
difficulty: advanced
status: active
etymology: "German: Alternative für Deutschland (Alternative for Germany). Founded in 2013 originally as an anti-Euro party, it shifted to anti-immigration populism during the 2015 refugee crisis"
why_it_matters: The AfD's rise mirrors populist movements worldwide and tests Germany's post-war constraints on right-wing politics.
context_example: The AfD won 23% of the vote in the federal election, making it the second-largest party and forcing mainstream parties into an awkward grand coalition to keep it out of power.
