slug: anti-zionism
name: Anti-Zionism
short_definition: Opposition to Zionism — the political movement supporting a Jewish homeland in Israel — which critics argue sometimes overlaps with antisemitism.
body_md: ""
category: social-cultural
difficulty: advanced
status: active
etymology: "Greek: anti (against) + Zion (the biblical name for Jerusalem/the Jewish homeland). Anti-Zionism as a political term emerged alongside Zionism in the late 19th century"
why_it_matters: The line between anti-Zionism and antisemitism is one of the most contested boundaries in political discourse, affecting campus debates, foreign policy, and domestic politics.
context_example: The university's student government passed a BDS resolution, sparking fierce debate over whether anti-Zionism constituted legitimate political critique or antisemitism.
