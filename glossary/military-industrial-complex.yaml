slug: military-industrial-complex
name: Military-Industrial Complex
short_definition: The relationship between a nation's military establishment, the defense industry, and the political system that supports them.
body_md: ""
category: military
difficulty: intermediate
status: active
etymology: "English: coined by President Dwight D. Eisenhower in his 1961 farewell address. An early draft used 'military-industrial-congressional complex' before the word 'congressional' was dropped"
why_it_matters: President Eisenhower warned in 1961 that the military-industrial complex could wield 'unwarranted influence' — critics argue that warning has been realized in runaway defense spending.
context_example: The defense contractor spent $15 million lobbying Congress to fund a weapons system the Pentagon said it didn't need, illustrating the dynamics of the military-industrial complex.
