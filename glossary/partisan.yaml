slug: partisan
name: Partisan
short_definition: A strong supporter of a party, cause, or person; in politics, it describes loyalty to one's party over compromise.
body_md: ""
category: government
difficulty: foundational
status: active
etymology: "Italian: partigiano (member of a faction). From parte (part, side). Originally a military term for an irregular fighter loyal to a cause"
why_it_matters: Partisanship has intensified to the point where party affiliation predicts views on everything from climate change to vaccines, making governance increasingly difficult.
context_example: The vote fell along strictly partisan lines, with every Democrat voting yes and every Republican voting no — a pattern that has become the norm rather than the exception.
