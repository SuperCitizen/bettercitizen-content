slug: rare-earths
name: Rare Earths
short_definition: A group of 17 metallic elements critical to modern technology (electronics, batteries, military equipment). China controls most global production, making them a strategic trade weapon.
body_md: ""
category: economy
difficulty: advanced
status: active
etymology: "English: 'rare' (scarce) + 'earths' (an old chemistry term for metal oxides). Despite the name, most rare earth elements are not actually rare — they are simply difficult to extract and process economically"
why_it_matters: Control of rare earth supply chains is a major geopolitical leverage point — China's dominance means it could disrupt Western technology production in a conflict.
context_example: When China temporarily halted rare earth exports to Japan in 2010, it sent a warning to the world about the strategic vulnerability of depending on a single source for critical minerals.
