slug: manhattan-project
name: Manhattan Project
short_definition: The US government research project (1942-1946) that produced the first nuclear weapons, leading to the atomic bombings of Hiroshima and Nagasaki.
body_md: ""
category: historical
difficulty: intermediate
status: historical
etymology: Named after the Manhattan Engineer District, the Army Corps of Engineers division headquartered in New York City that initially managed the project in 1942
why_it_matters: The Manhattan Project ushered in the nuclear age, raising existential questions about weapons of mass destruction, government secrecy, and scientific responsibility that remain urgent today.
context_example: The Manhattan Project employed 125,000 people across 30 sites, yet its existence remained secret from most of Congress and even Vice President Truman until days before the first test.
