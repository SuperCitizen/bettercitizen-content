slug: counterinsurgency
name: Counterinsurgency
short_definition: Military and political actions taken to defeat an insurgency and address its root causes.
body_md: ""
category: military
difficulty: advanced
status: active
etymology: "Latin: contra (against) + insurgere (to rise up). Modern COIN doctrine developed by the French in Algeria and the British in Malaya"
why_it_matters: Counterinsurgency doctrine shaped the US approach to Iraq and Afghanistan, emphasizing winning 'hearts and minds' over purely military solutions — with mixed results.
context_example: The new commanding general implemented a counterinsurgency strategy that moved troops off large bases and into small outposts within local communities.
