slug: sovereign-debt
name: Sovereign Debt
short_definition: Money borrowed by a national government, typically through the issuance of bonds, to fund operations and public services.
body_md: ""
category: economy
difficulty: intermediate
status: active
etymology: "Old French: soverain (supreme) + Latin: debitum (something owed). Sovereign borrowing dates to medieval Italian city-states, but modern sovereign debt markets emerged in the 17th-18th centuries"
why_it_matters: Sovereign debt crises can topple governments, trigger recessions, and force painful austerity — the ability of a nation to borrow depends on global confidence in its economy and institutions.
context_example: Greece's sovereign debt crisis forced the country to accept harsh bailout terms from the EU and IMF, imposing years of austerity that devastated the economy and provoked mass protests.
