slug: trail-of-tears
name: Trail of Tears
short_definition: The forced relocation of approximately 60,000 Native Americans from their ancestral homelands in the southeastern US to designated territory west of the Mississippi, resulting in thousands of deaths.
body_md: ""
category: historical
difficulty: foundational
status: historical
etymology: "English: named by the Cherokee themselves — in Cherokee, Nunna daul Tsuny (the Trail Where They Cried). Refers to the forced marches of the 1830s under the Indian Removal Act"
why_it_matters: The Trail of Tears represents one of the most shameful episodes in American history — a reminder that democratic governments can commit atrocities against their own people.
context_example: The Cherokee Nation was forced to march over 1,000 miles in winter, losing an estimated 4,000 people to disease, starvation, and exposure on the Trail of Tears.
