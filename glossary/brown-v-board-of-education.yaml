slug: brown-v-board-of-education
name: Brown v. Board of Education
short_definition: The landmark 1954 Supreme Court decision declaring racial segregation in public schools unconstitutional.
body_md: ""
category: historical
difficulty: intermediate
status: historical
etymology: Named after Oliver Brown, a parent in Topeka, Kansas, who sued the Board of Education after his daughter was denied enrollment at a white elementary school
why_it_matters: Brown overturned the 'separate but equal' doctrine of Plessy v. Ferguson, becoming the legal catalyst for the civil rights movement and the desegregation of American society.
context_example: Chief Justice Warren's unanimous opinion in Brown v. Board declared that separate educational facilities are inherently unequal, overturning 58 years of precedent.
