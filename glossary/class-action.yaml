slug: class-action
name: Class Action
short_definition: A lawsuit in which a group of people with similar claims sue a defendant as a collective.
body_md: ""
category: rights-and-law
difficulty: intermediate
status: active
etymology: "English legal terminology: 'class' from Latin classis (division, group) + 'action' from Latin actio (a doing, legal proceeding). Formalized in US federal rules in 1938"
why_it_matters: Class actions allow ordinary people to hold powerful corporations accountable when individual damages are too small to justify separate lawsuits.
context_example: The class action lawsuit on behalf of 1.5 million women alleged systematic gender discrimination in pay and promotions at the nation's largest retailer.
