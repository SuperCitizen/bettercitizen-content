slug: zionism
name: Zionism
short_definition: A political movement that emerged in the 19th century supporting the establishment and preservation of a Jewish state in the historical Land of Israel.
body_md: ""
category: social-cultural
difficulty: intermediate
status: active
etymology: "German: Zionismus. From Zion — the biblical name for Jerusalem and the Jewish homeland. Coined by Austrian journalist Nathan Birnbaum in 1890"
why_it_matters: Zionism is central to understanding the Israeli-Palestinian conflict, Jewish identity, and one of the most enduring geopolitical disputes in the modern world.
context_example: Theodor Herzl's 1896 pamphlet 'Der Judenstaat' gave political Zionism its founding document, arguing that a Jewish homeland was the only solution to antisemitism.
