slug: veto
name: Veto
short_definition: The constitutional power of the president to reject a bill passed by Congress, which can be overridden by a two-thirds vote in both chambers.
body_md: ""
category: government
difficulty: foundational
status: active
etymology: "Latin: veto (I forbid)"
why_it_matters: The veto gives the president significant leverage over legislation, since overrides require a supermajority that is rarely achievable.
context_example: The president vetoed the bipartisan spending bill, and Senate leaders conceded they lacked the two-thirds majority needed to override.
