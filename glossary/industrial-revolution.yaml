slug: industrial-revolution
name: Industrial Revolution
short_definition: The period of rapid technological and economic transformation (roughly 1760-1840 in Britain, later spreading globally) in which hand production was replaced by machine manufacturing.
body_md: ""
category: historical
difficulty: foundational
status: historical
etymology: "French: révolution industrielle. The term was popularized by Arnold Toynbee's 1884 Lectures on the Industrial Revolution in England, though earlier usage exists"
why_it_matters: The Industrial Revolution created the modern world — urbanization, factory labor, capitalism, the middle class, and environmental degradation all trace to this transformation.
context_example: The Industrial Revolution moved millions from farms to factories, creating unprecedented wealth alongside brutal working conditions that eventually gave rise to the labor movement.
