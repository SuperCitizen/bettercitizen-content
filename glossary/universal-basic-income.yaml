slug: universal-basic-income
name: Universal Basic Income
short_definition: A program in which every citizen receives a regular, unconditional sum of money from the government, regardless of employment status.
body_md: ""
category: economy
difficulty: advanced
status: active
etymology: "English: 'universal' from Latin universalis (of or belonging to all) + 'basic income.' The concept traces to Thomas More's Utopia (1516) and Thomas Paine's Agrarian Justice (1797)"
why_it_matters: As automation threatens to displace millions of jobs, UBI has moved from fringe idea to serious policy proposal, with pilot programs running in multiple countries.
context_example: The Finnish UBI experiment gave 2,000 unemployed citizens $635 per month with no conditions, finding that recipients reported less stress and similar employment rates.
