slug: impeachment
name: Impeachment
short_definition: House charges a federal officer with "Treason, Bribery, or other high Crimes and Misdemeanors"; Senate tries the case with two-thirds required to convict and remove.
body_md: ""
category: government
difficulty: intermediate
status: active
etymology: "Old French: empeechier (to hinder, impede). Latin root: impedicare (to catch, entangle)"
why_it_matters: Impeachment is the ultimate check on executive power, though it has never resulted in a president's removal from office.
context_example: The House voted to impeach the president on two articles, but the Senate acquitted along largely partisan lines.
