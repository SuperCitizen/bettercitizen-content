slug: caucus-legislative
name: Caucus (Legislative)
short_definition: A group of members of a legislative body who share a common interest or identity, such as the Congressional Black Caucus.
body_md: ""
category: government
difficulty: intermediate
status: active
etymology: "Algonquian (possibly): caucauasu (counselor). Distinct from the electoral caucus — this refers to organized groups within a legislature"
why_it_matters: Legislative caucuses organize members around shared priorities, amplifying the influence of specific groups and shaping party strategy on key issues.
context_example: The Freedom Caucus threatened to block the spending bill unless their demands for deeper cuts were met, wielding influence far beyond their numbers.
