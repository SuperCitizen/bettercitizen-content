slug: creative-destruction
name: Creative Destruction
short_definition: "The process by which new innovations continually displace established firms, technologies, and fortunes."
body_md: ""
category: economy
difficulty: advanced
status: active
etymology: "English: popularized by economist Joseph Schumpeter in 'Capitalism, Socialism and Democracy' (1942), describing how capitalism incessantly revolutionizes the economic structure from within"
why_it_matters: "Creative destruction is the central argument that market dominance and great fortunes are temporary — used to dispute the claim that the wealthy form a durable, self-perpetuating ruling class."
context_example: "Defenders of market churn point to the high turnover of the Forbes 400 and the fall of once-dominant firms as evidence of creative destruction at work."
