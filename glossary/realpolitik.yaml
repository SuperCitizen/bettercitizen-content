slug: realpolitik
name: Realpolitik
short_definition: Politics based on practical realities and national interest rather than moral or ideological considerations.
body_md: ""
category: foreign-policy
difficulty: advanced
status: active
etymology: "German: 'realistic politics.' Coined by Ludwig von Rochau in 1853 to describe Otto von Bismarck's pragmatic approach to unifying Germany"
why_it_matters: Realpolitik explains decisions like Nixon opening China and the US supporting authoritarian allies — pragmatism over principles, for better or worse.
context_example: The alliance with the authoritarian regime was pure realpolitik — morally indefensible but strategically necessary to contain a shared adversary.
