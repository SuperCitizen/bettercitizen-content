slug: gilded-age
name: Gilded Age
short_definition: The period in American history (roughly 1870-1900) characterized by rapid industrialization, extreme wealth inequality, political corruption, and the rise of monopolies.
body_md: ""
category: historical
difficulty: intermediate
status: historical
etymology: "English: coined by Mark Twain and Charles Dudley Warner in their 1873 satirical novel The Gilded Age: A Tale of Today. 'Gilded' means covered with gold on the surface but base metal underneath — beautiful on the outside, corrupt within"
why_it_matters: The Gilded Age's parallels to today — extreme inequality, corporate power, political corruption, and technological disruption — make it essential context for understanding modern debates.
context_example: The Gilded Age saw the rise of robber barons like Rockefeller, Carnegie, and Vanderbilt, who amassed fortunes rivaling modern tech billionaires while workers toiled in dangerous conditions.
