slug: veterans-affairs
name: Veterans Affairs
short_definition: The federal department responsible for providing benefits and services to military veterans, including healthcare, education, and disability compensation.
body_md: ""
category: military
difficulty: foundational
status: active
etymology: "English: 'veteran' from Latin veteranus (old, experienced, of long service) + 'affairs' from French affaires (business, concerns). The Department of Veterans Affairs was elevated to cabinet-level status in 1989"
why_it_matters: The VA serves over 9 million veterans and operates the nation's largest healthcare system, yet wait times, bureaucratic failures, and underfunding have been persistent scandals.
context_example: The investigation revealed that VA hospitals had falsified wait-time records to conceal delays that left veterans waiting months for medical appointments.
