slug: habeas-corpus
name: Habeas Corpus
short_definition: A legal principle requiring that a person under arrest be brought before a judge, preventing unlawful detention.
body_md: ""
category: rights-and-law
difficulty: intermediate
status: active
etymology: "Latin: 'you shall have the body'"
why_it_matters: Habeas corpus is the most fundamental safeguard against tyranny — it prevents the government from locking people up and throwing away the key.
context_example: Guantanamo detainees filed habeas corpus petitions arguing they had the right to challenge their indefinite detention before a federal judge.
