slug: nationalism
name: Nationalism
short_definition: A political ideology that emphasizes loyalty to and pride in one's nation, often advocating for national sovereignty and self-governance.
body_md: ""
category: social-cultural
difficulty: intermediate
status: active
etymology: "French: nationalisme. Latin: natio (birth, people, nation). Emerged as a political concept during the French Revolution"
why_it_matters: Nationalism can unite people around shared identity and self-determination, but it can also fuel xenophobia, ethnic conflict, and aggression toward outsiders.
context_example: The rising tide of nationalism across Europe led to the election of leaders who campaigned on closing borders, restricting immigration, and reclaiming sovereignty from the EU.
