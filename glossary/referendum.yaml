slug: referendum
name: Referendum
short_definition: A direct vote by the electorate on a specific proposal or law, rather than a vote for a representative.
body_md: ""
category: elections
difficulty: intermediate
status: active
etymology: "Latin: referendum (thing to be referred)"
why_it_matters: Referendums allow citizens to directly approve or reject specific policies, serving as a check on legislative power.
context_example: The Brexit referendum in 2016 showed how a simple yes-or-no vote can have sweeping and unforeseen consequences.
