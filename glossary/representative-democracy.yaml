slug: representative-democracy
name: Representative Democracy
short_definition: A system where citizens elect officials to make decisions and pass laws on their behalf, rather than voting on every issue directly.
body_md: ""
category: government
difficulty: foundational
status: active
etymology: "Latin: repraesentare (to make present) + Greek: demokratia (rule of the people)"
why_it_matters: Nearly all modern democracies are representative, making the quality of representation and accountability of elected officials the central question of governance.
context_example: Proponents of direct ballot measures argue that representative democracy has failed to reflect the will of the people on issues like term limits.
