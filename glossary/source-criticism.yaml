slug: source-criticism
name: Source Criticism
short_definition: The practice of evaluating the reliability, credibility, and bias of information sources before accepting their claims as accurate.
body_md: ""
category: media-information
difficulty: foundational
status: active
etymology: "German: Quellenkritik (source criticism). Developed as a formal methodology by 19th-century German historians Leopold von Ranke and Barthold Georg Niebuhr"
why_it_matters: In an era of information overload and deliberate deception, source criticism is the single most important skill for any citizen trying to understand the world.
context_example: The teacher asked students to evaluate the viral claim by checking who published it, what evidence supported it, and whether other credible sources confirmed it — basic source criticism.
