slug: watergate
name: Watergate
short_definition: The 1972 political scandal involving President Nixon's administration's break-in at the DNC headquarters and subsequent cover-up, leading to Nixon's resignation.
body_md: ""
category: historical
difficulty: intermediate
status: historical
etymology: Named after the Watergate Hotel and office complex in Washington, D.C., where the break-in occurred on June 17, 1972. The '-gate' suffix has since been applied to hundreds of scandals
why_it_matters: Watergate established the modern template for political scandal, strengthened the press's watchdog role, and created lasting public distrust of government.
context_example: The Watergate investigation revealed that the president had ordered the CIA to obstruct the FBI's inquiry, making the cover-up far worse than the original crime.
