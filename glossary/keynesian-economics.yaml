slug: keynesian-economics
name: Keynesian Economics
short_definition: The theory that government spending and tax policy can be used to stimulate demand and pull an economy out of recession.
body_md: ""
category: economy
difficulty: advanced
status: active
etymology: Named after British economist John Maynard Keynes (1883-1946), whose General Theory of Employment, Interest and Money (1936) transformed macroeconomics
why_it_matters: Keynesian economics provided the intellectual foundation for stimulus spending, unemployment insurance, and counter-cyclical fiscal policy.
context_example: The $2 trillion COVID relief package was the largest Keynesian stimulus in American history, sending direct payments to most households.
