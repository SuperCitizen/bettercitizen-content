slug: collateral-damage
name: Collateral Damage
short_definition: Unintended civilian casualties or destruction of civilian property during military operations.
body_md: ""
category: military
difficulty: intermediate
status: active
etymology: "Latin: collateralis (side by side) + damnum (loss, harm). Military euphemism adopted during the Vietnam War"
why_it_matters: Collateral damage is the human cost of warfare that militaries must weigh against tactical objectives — the moral and legal implications shape public support for conflicts.
context_example: The airstrike destroyed the intended target but also killed 47 civilians in the adjacent apartment building, drawing international condemnation for the collateral damage.
