slug: false-equivalence
name: False Equivalence
short_definition: A logical fallacy that presents two very different things as if they are equally valid or comparable.
body_md: ""
category: media-information
difficulty: intermediate
status: active
etymology: "Latin: falsus (false) + aequivalens (equal in value). The rhetorical concept has ancient roots, but the specific term became prominent in media criticism in the 2000s"
why_it_matters: False equivalence in journalism can give fringe views equal weight to scientific consensus, distorting public understanding of issues like climate change and vaccines.
context_example: The network was criticized for false equivalence when it gave equal airtime to a climate scientist and a climate denier, implying the scientific debate was evenly split.
