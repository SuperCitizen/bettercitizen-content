slug: urban-warfare
name: Urban Warfare
short_definition: Military combat conducted in urban areas, characterized by close-quarters fighting, civilian presence, and complex terrain.
body_md: ""
category: military
difficulty: advanced
status: active
etymology: "Latin: urbanus (of the city) + Old English werre (conflict). Urban warfare doctrine formalized during and after World War II, particularly after Stalingrad"
why_it_matters: Urban warfare is the deadliest form of modern combat, with civilian casualties often exceeding military ones, and cities can take decades to rebuild.
context_example: The battle to retake the city lasted nine months and left 80% of the buildings destroyed, demonstrating the devastating nature of urban warfare.
