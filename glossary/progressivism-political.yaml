slug: progressivism-political
name: Progressivism (Political)
short_definition: The early 20th century political movement that sought to make government more efficient and just through expert-driven regulation, professional civil service, and expanded judiciary — creating the foundations of the modern administrative state.
body_md: ""
category: social-cultural
difficulty: advanced
status: active
etymology: "Latin: progressus (an advance, going forward). The Progressive Era (1890s-1920s) was led by reformers like Theodore Roosevelt, Woodrow Wilson, and Robert La Follette"
why_it_matters: Progressivism created the institutional framework that populists now argue has become undemocratic — understanding its goals helps evaluate whether reform or dismantlement is appropriate.
context_example: The Progressive Era gave America the FDA, the Federal Reserve, the income tax, and direct election of senators — transforming government from a patronage-driven machine into a bureaucratic state.
