slug: doge
name: DOGE
short_definition: Department of Government Efficiency — an initiative under the Trump administration led by Elon Musk aimed at reducing federal spending and restructuring or eliminating parts of the bureaucracy.
body_md: ""
category: government
difficulty: intermediate
status: active
etymology: "English acronym: Department of Government Efficiency. The name also references the Doge internet meme and Dogecoin cryptocurrency associated with Elon Musk"
why_it_matters: DOGE represents the most aggressive attempt to dismantle parts of the administrative state in modern American history, testing the limits of executive power over the bureaucracy.
context_example: DOGE teams gained access to agency databases and recommended eliminating thousands of federal positions, sparking lawsuits from employee unions and concerns about government capacity.
