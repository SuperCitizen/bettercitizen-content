slug: isolationism
name: Isolationism
short_definition: A foreign policy stance that advocates avoiding involvement in international affairs, alliances, and conflicts.
body_md: ""
category: foreign-policy
difficulty: intermediate
status: active
etymology: "English: 'isolate' from Latin insulatus (made into an island) + '-ism.' Coined in the 19th century for American non-interventionist sentiment"
why_it_matters: Isolationism resurfaces whenever Americans question the cost of global engagement — from the interwar period to the post-Iraq era to current debates about NATO commitments.
context_example: The senator's speech calling for withdrawal from NATO and an end to foreign aid was denounced as isolationism by both parties' foreign policy establishments.
