slug: electoral-realignment
name: Electoral Realignment
short_definition: A dramatic shift in the political landscape where voter coalitions fundamentally change, often associated with critical elections.
body_md: ""
category: elections
difficulty: advanced
status: active
etymology: "English: 're-' (again) + 'alignment' from French aligner (to arrange in a line). Applied to American politics by political scientist V.O. Key in his 1955 theory of critical elections"
why_it_matters: Understanding realignments explains why the parties of Lincoln and FDR look nothing like their modern counterparts — coalitions are not permanent, and we may be in a realignment now.
context_example: Political scientists debated whether 2016 represented a true electoral realignment, as college-educated suburbanites shifted to Democrats while working-class whites moved decisively to Republicans.
