slug: antisemitism
name: Antisemitism
short_definition: Hostility, prejudice, or discrimination against Jewish people, one of the oldest forms of hatred.
body_md: ""
category: social-cultural
difficulty: foundational
status: active
etymology: "German: Antisemitismus. Coined by German journalist Wilhelm Marr in 1879 to give a pseudo-scientific gloss to Jew-hatred. 'Semitic' refers to a language family, not a race"
why_it_matters: Antisemitism persists in both old and new forms, from conspiracy theories about Jewish control to violence against synagogues, making it a persistent threat to democratic pluralism.
context_example: The FBI reported that anti-Jewish hate crimes accounted for more than half of all religiously motivated incidents, despite Jews comprising only 2% of the population.
