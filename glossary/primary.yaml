slug: primary
name: Primary
short_definition: An election in which voters in a party choose their candidate for the general election.
body_md: ""
category: elections
difficulty: foundational
status: active
etymology: "Latin: primarius (of the first rank)"
why_it_matters: Primary elections determine which candidates appear on the general election ballot, yet turnout is typically very low, giving outsized influence to the most partisan voters.
context_example: The incumbent senator lost in the primary to a challenger backed by grassroots activists, shocking the party establishment.
