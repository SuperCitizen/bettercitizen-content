slug: astroturfing
name: Astroturfing
short_definition: The practice of masking the sponsors of a message to make it appear as though it originates from grassroots participants.
body_md: ""
category: media-information
difficulty: advanced
status: active
etymology: "English: from AstroTurf, the brand name for artificial grass — a play on 'grassroots.' Coined by US Senator Lloyd Bentsen in 1985 to describe manufactured public support"
why_it_matters: Astroturfing undermines democratic debate by creating the illusion of popular support for positions that are actually funded by corporate or political interests.
context_example: The investigation revealed that the seemingly grassroots opposition to the climate bill was an astroturfing campaign funded by fossil fuel companies, with paid participants at town halls.
