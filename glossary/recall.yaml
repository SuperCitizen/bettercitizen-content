slug: recall
name: Recall
short_definition: A procedure allowing voters to remove an elected official from office before their term ends through a special election.
body_md: ""
category: elections
difficulty: intermediate
status: active
etymology: "Latin: re- (back) + Old French: caler (to call). Originally a military term for summoning troops back"
why_it_matters: Recalls give voters a way to hold officials accountable between regular elections, though they are rare and often controversial.
context_example: California Governor Gavin Newsom survived a recall election in 2021, defeating the effort with over 60% of voters choosing to keep him in office.
