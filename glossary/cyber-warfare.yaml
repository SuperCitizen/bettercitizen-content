slug: cyber-warfare
name: Cyber Warfare
short_definition: The use of digital attacks by one nation to disrupt the computer systems, infrastructure, or information networks of another.
body_md: ""
category: military
difficulty: intermediate
status: active
etymology: "English: 'cyber' from Greek kybernetes (steersman, governor) — popularized by 'cybernetics' in the 1940s + 'warfare.' First used in military doctrine in the 1990s"
why_it_matters: Cyber warfare can disable power grids, financial systems, and military communications without firing a shot — it is the new frontier of international conflict.
context_example: The cyberattack on the colonial pipeline shut down fuel supply to the entire East Coast for six days, demonstrating how cyber warfare can inflict real-world damage.
