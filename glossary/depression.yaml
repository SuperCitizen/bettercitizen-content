slug: depression
name: Depression
short_definition: A severe and prolonged economic downturn, more extreme than a recession, with high unemployment and falling output.
body_md: ""
category: economy
difficulty: intermediate
status: active
etymology: "Latin: deprimere (to press down). The term 'Great Depression' replaced the earlier 'Great Crash' to describe the prolonged downturn of the 1930s"
why_it_matters: The Great Depression reshaped the role of government in the economy and led to programs like Social Security, the SEC, and FDIC insurance that persist today.
context_example: Economists debated whether the 2008 financial crisis would have become a full depression without the massive government intervention that followed.
