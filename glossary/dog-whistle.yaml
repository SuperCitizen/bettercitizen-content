slug: dog-whistle
name: Dog Whistle
short_definition: Political messaging that appears innocuous to the general public but conveys a specific meaning to a targeted subgroup.
body_md: ""
category: media-information
difficulty: advanced
status: active
etymology: "English: from the literal dog whistle, which emits a high-frequency sound inaudible to humans but heard by dogs. Political usage emerged in the 1990s in Australia"
why_it_matters: Dog whistles allow politicians to appeal to prejudice while maintaining plausible deniability, making them a powerful and insidious tool in political communication.
context_example: Critics argued the candidate's repeated references to 'law and order' and 'urban crime' were dog whistles designed to activate racial anxieties without explicitly mentioning race.
