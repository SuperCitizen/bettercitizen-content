slug: tammany-hall
name: Tammany Hall
short_definition: The Democratic Party political machine that dominated New York City politics from the 1790s to the 1960s, known for both corrupt patronage and providing services to immigrant communities.
body_md: ""
category: historical
difficulty: advanced
status: historical
etymology: Named after the Society of St. Tammany, founded in 1786 as a patriotic club. Tammany was a Lenape chief; the society's name was later appropriated by the Democratic political machine headquartered at Tammany Hall in New York
why_it_matters: Tammany Hall represents both the promise and peril of mass democratic politics — responsive to voters but riddled with corruption, it defined urban political machines.
context_example: Boss Tweed's Tammany Hall ring stole an estimated $200 million from New York City, but also provided jobs, housing assistance, and naturalization help to waves of immigrants.
