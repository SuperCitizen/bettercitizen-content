slug: sanctions
name: Sanctions
short_definition: Punitive economic or trade measures imposed by one or more countries against a target country, group, or individual to compel a change in behavior.
body_md: ""
category: foreign-policy
difficulty: intermediate
status: active
etymology: "Latin: sanctio (a decree, ordinance). From sancire (to make sacred, ratify)"
why_it_matters: Sanctions are the most common tool of coercive diplomacy short of military force, but their effectiveness in changing behavior is debated.
context_example: The US and EU imposed sweeping sanctions on Russia's banking system and energy sector, freezing hundreds of billions in central bank reserves.
