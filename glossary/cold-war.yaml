slug: cold-war
name: Cold War
short_definition: The geopolitical tension between the US and the Soviet Union (1947-1991), characterized by nuclear arms race, proxy wars, and ideological competition.
body_md: ""
category: historical
difficulty: foundational
status: historical
etymology: "English: coined by journalist Walter Lippmann in 1947 (and earlier by George Orwell in 1945) to describe the state of hostility short of actual combat between the US and USSR"
why_it_matters: The Cold War shaped the modern world — from NATO and the UN to the CIA and the military-industrial complex — and its echoes resound in current tensions with Russia and China.
context_example: The Cold War never produced direct combat between the superpowers, but it fueled devastating proxy wars in Korea, Vietnam, Afghanistan, and dozens of smaller conflicts worldwide.
