slug: national-debt
name: National Debt
short_definition: The total amount of money owed by a national government, accumulated through years of deficit spending.
body_md: ""
category: economy
difficulty: foundational
status: active
etymology: "Latin: debitum (something owed). National debt as a concept formalized by Alexander Hamilton in the 1790 Report on Public Credit"
why_it_matters: The US national debt surpassed $34 trillion in 2024, with interest payments now exceeding the defense budget, constraining future policy options.
context_example: The Congressional Budget Office warned that interest on the national debt will consume 20% of federal revenue within a decade.
