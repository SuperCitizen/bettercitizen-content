slug: habeas-corpus-suspension
name: Habeas Corpus Suspension
short_definition: The rare act of suspending the right to challenge unlawful detention, permitted by the Constitution only during rebellion or invasion.
body_md: ""
category: rights-and-law
difficulty: expert
status: active
etymology: "Latin: habeas corpus (you shall have the body) + English: suspension. The Constitution's Suspension Clause (Article I, Section 9) limits this power to cases of 'rebellion or invasion'"
why_it_matters: Habeas corpus suspension is the most extreme power the government can exercise over individual liberty — its use during the Civil War and after 9/11 tested the very limits of constitutional governance.
context_example: Lincoln's suspension of habeas corpus during the Civil War allowed the military to detain thousands without trial, a decision that remains one of the most controversial exercises of executive power.
