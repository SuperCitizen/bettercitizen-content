slug: overton-window
name: Overton Window
short_definition: The range of policies and ideas considered acceptable or mainstream in public discourse at a given time.
body_md: ""
category: media-information
difficulty: advanced
status: active
etymology: Named after Joseph P. Overton (1960-2003), a policy analyst at the Mackinac Center for Public Policy in Michigan, who developed the concept in the mid-1990s
why_it_matters: Understanding the Overton Window explains how ideas once considered extreme become mainstream — and how political actors deliberately work to shift it.
context_example: Proposals for universal basic income moved from the political fringe to serious policy discussion within a decade, illustrating a dramatic shift in the Overton Window.
