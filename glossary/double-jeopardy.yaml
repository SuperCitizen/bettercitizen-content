slug: double-jeopardy
name: Double Jeopardy
short_definition: The constitutional protection against being tried twice for the same offense after acquittal or conviction.
body_md: ""
category: rights-and-law
difficulty: intermediate
status: active
etymology: "English: 'double' from Latin duplus (twofold) + 'jeopardy' from Old French jeu parti (divided game, an even chance). The concept originates in Roman law and English common law"
why_it_matters: Double jeopardy prevents the government from using its vast resources to prosecute someone repeatedly until it gets the verdict it wants — a fundamental check on state power.
context_example: The prosecution could not retry the defendant after the acquittal, as the Fifth Amendment's double jeopardy clause barred a second trial on the same charges.
