slug: abolition
name: Abolition
short_definition: The movement to end slavery, which gained momentum in the early 19th century and culminated in the 13th Amendment (1865).
body_md: ""
category: historical
difficulty: foundational
status: historical
etymology: "Latin: abolitio (an abolishing). From abolere (to destroy, efface). Applied to anti-slavery activism beginning in the late 18th century"
why_it_matters: The abolitionist movement was America's first great civil rights campaign — its moral arguments, organizational tactics, and political strategies influenced every social movement that followed.
context_example: Frederick Douglass, the most prominent abolitionist of his era, used his autobiography and oratory to expose the brutality of slavery and demand immediate emancipation.
