slug: filibuster
name: Filibuster
short_definition: A political procedure where one or more members of a legislative body prolong debate on proposed legislation so as to delay or entirely prevent a decision.
body_md: ""
category: government
difficulty: advanced
status: active
etymology: "Dutch: Vrijbuiter — meaning 'freebooter' or 'pirate.' Spanish evolution: Filibustero — initially used to describe 19th-century adventurers who incited insurrections. The term migrated to politics in the mid-1800s to describe members 'hijacking' the legislative floor."
why_it_matters: The filibuster effectively requires a supermajority to pass most legislation in the Senate, often leading to gridlock where even broadly popular bills fail to reach a vote.
context_example: The senator's twenty-four-hour filibuster finally ended when a successful cloture motion was passed by the required three-fifths majority.
