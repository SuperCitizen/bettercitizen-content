slug: joint-chiefs-of-staff
name: Joint Chiefs of Staff
short_definition: The body of the most senior military officers from each branch of the US armed forces who advise the president and Secretary of Defense on military matters.
body_md: ""
category: military
difficulty: intermediate
status: active
etymology: "English: 'Joint' (combined across branches) + 'Chiefs of Staff.' Established by the Joint Chiefs of Staff Reorganization Act of 1986 (Goldwater-Nichols Act)"
why_it_matters: The Joint Chiefs represent the highest level of military leadership, and tensions between civilian political leadership and military advice have shaped critical decisions from Vietnam to Iraq.
context_example: The chairman of the Joint Chiefs of Staff reportedly warned the president that the proposed troop withdrawal would create a security vacuum, but was overruled.
