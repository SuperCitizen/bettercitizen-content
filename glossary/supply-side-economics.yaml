slug: supply-side-economics
name: Supply-Side Economics
short_definition: The theory that tax cuts and deregulation stimulate economic growth by encouraging production and investment.
body_md: ""
category: economy
difficulty: advanced
status: active
etymology: "Modern English: coined in the 1970s by economist Herbert Stein to describe the focus on production (supply) rather than consumption (demand)"
why_it_matters: Supply-side economics remains one of the most politically divisive economic theories, with proponents claiming it drives growth and critics calling it a justification for tax cuts that primarily benefit the wealthy.
context_example: Supply-side economics was the intellectual foundation of Reaganomics in the 1980s, promising that tax cuts would pay for themselves through increased growth.
