slug: manifest-destiny
name: Manifest Destiny
short_definition: The 19th-century belief that American settlers were destined to expand across the continent, used to justify westward expansion and displacement of Indigenous peoples.
body_md: ""
category: historical
difficulty: intermediate
status: historical
etymology: "English: coined by newspaper editor John L. O'Sullivan in 1845, who wrote that it was America's 'manifest destiny to overspread the continent allotted by Providence'"
why_it_matters: Manifest Destiny provided the ideological justification for territorial expansion, Indian removal, and the Mexican-American War — its legacy shapes debates about American exceptionalism and Indigenous rights.
context_example: The doctrine of Manifest Destiny drove the annexation of Texas, the Oregon Trail migration, and the California Gold Rush, while devastating Native American nations through forced relocation and violence.
