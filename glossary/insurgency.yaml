slug: insurgency
name: Insurgency
short_definition: An organized rebellion against an established authority, typically using guerrilla tactics and seeking political change.
body_md: ""
category: military
difficulty: intermediate
status: active
etymology: "Latin: insurgere (to rise up). From in- (upon) + surgere (to rise). The modern military usage emerged during colonial-era conflicts"
why_it_matters: Insurgencies have defined most post-Cold War conflicts — understanding them explains why conventional military superiority alone cannot guarantee victory.
context_example: The insurgency grew from scattered attacks to a coordinated campaign controlling entire provinces, forcing the government to negotiate with groups it had previously refused to recognize.
