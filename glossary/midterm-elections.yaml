slug: midterm-elections
name: Midterm Elections
short_definition: Federal elections held two years after a presidential election, typically for all House seats and one-third of Senate seats.
body_md: ""
category: elections
difficulty: foundational
status: active
etymology: "English: 'midterm' (occurring in the middle of a term of office) + 'election' from Latin electio (a choosing)"
why_it_matters: Midterms typically see lower turnout and favor the party not in the White House, often serving as a referendum on the president's performance and reshaping the balance of power.
context_example: The president's party lost 40 House seats in the midterm elections, a wave that handed control of the chamber to the opposition and stalled the legislative agenda.
