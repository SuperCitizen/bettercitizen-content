slug: conference-committee
name: Conference Committee
short_definition: A temporary joint committee formed to resolve differences between House and Senate versions of a bill.
body_md: ""
category: government
difficulty: advanced
status: active
etymology: "Latin: conferre (to bring together)"
why_it_matters: Conference committees shape the final version of legislation, often making significant changes behind closed doors before sending a bill to the president.
context_example: The conference committee stripped the House's gun provision from the defense bill, angering members who had fought to include it.
