slug: secularism
name: Secularism
short_definition: The principle of separating religious institutions from political governance, ensuring the state remains neutral on matters of belief.
body_md: ""
category: social-cultural
difficulty: intermediate
status: active
etymology: "Latin: saecularis (worldly, temporal). From saeculum (an age, the world). Coined in 1851 by British writer George Jacob Holyoake"
why_it_matters: Secularism protects both religious freedom and government neutrality, but the boundary between church and state is constantly contested in debates over school prayer, public monuments, and social policy.
context_example: France's strict secularism, known as laicite, led to a ban on religious symbols in public schools, sparking debate over whether the policy protected freedom or suppressed it.
