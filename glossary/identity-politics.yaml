slug: identity-politics
name: Identity Politics
short_definition: Political positions based on the interests and perspectives of specific social groups identified by race, gender, religion, sexual orientation, or other characteristics.
body_md: ""
category: social-cultural
difficulty: intermediate
status: active
etymology: "English: coined by the Combahee River Collective, a Black feminist group, in their 1977 statement arguing that their politics grew directly from their identity and experience"
why_it_matters: Identity politics is both praised for giving voice to marginalized groups and criticized for fragmenting society and replacing universal ideals with group grievance.
context_example: Critics argued that identity politics had turned the coalition into a collection of competing interest groups, while supporters countered that ignoring identity means ignoring injustice.
