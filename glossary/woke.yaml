slug: woke
name: Woke
short_definition: Originally meaning awareness of social injustice, particularly racism; now also used pejoratively to criticize progressive social activism.
body_md: ""
category: social-cultural
difficulty: intermediate
status: active
etymology: "African American Vernacular English: 'stay woke' — meaning stay aware of racial injustice. The term dates to the 1930s (used by Lead Belly) and was revived by the Black Lives Matter movement in 2014"
why_it_matters: The evolution of 'woke' from a term of empowerment to a political insult illustrates how language becomes a weapon in the culture war.
context_example: The governor built his national profile by campaigning against what he called 'the woke agenda' in schools, corporations, and the military.
