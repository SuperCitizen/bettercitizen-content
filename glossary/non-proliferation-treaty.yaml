slug: non-proliferation-treaty
name: Non-Proliferation Treaty
short_definition: The Treaty on the Non-Proliferation of Nuclear Weapons (NPT), a 1968 international agreement aimed at preventing the spread of nuclear weapons, promoting disarmament, and facilitating peaceful use of nuclear energy.
body_md: ""
category: foreign-policy
difficulty: advanced
status: active
etymology: "Latin: non (not) + proliferare (to grow rapidly) + tractatus (a treatise, agreement). Opened for signature in 1968, entered into force in 1970, and has 191 states parties"
why_it_matters: The NPT is the foundation of the global nuclear order, but it faces challenges from nations that never signed (India, Pakistan, Israel) and those that withdrew (North Korea).
context_example: Iran's nuclear program has tested the limits of the Non-Proliferation Treaty, as inspectors struggled to verify whether the country's enrichment activities were purely peaceful.
