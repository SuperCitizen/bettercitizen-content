slug: maga
name: MAGA
short_definition: Make America Great Again — both a campaign slogan and a political movement centered on Donald Trump, characterized by populist nationalism and opposition to establishment politics.
body_md: ""
category: social-cultural
difficulty: foundational
status: active
etymology: "English: 'Make America Great Again' was first used by Ronald Reagan in his 1980 campaign. Donald Trump trademarked the phrase in 2012 and made it the centerpiece of his 2016 presidential campaign"
why_it_matters: MAGA has become shorthand for a political identity that transcends traditional party lines, reshaping the Republican Party and influencing politics globally.
context_example: The red MAGA cap became the most recognizable symbol in American politics, representing both a movement and a cultural identity that divided families and communities.
