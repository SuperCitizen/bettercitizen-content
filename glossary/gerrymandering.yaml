slug: gerrymandering
name: Gerrymandering
short_definition: Drawing legislative district boundaries to favor a particular party or to dilute the voting power of a particular group. May be partisan or racial.
body_md: ""
category: elections
difficulty: intermediate
status: active
etymology: Named after Governor Elbridge Gerry, whose 1812 redistricting plan in Massachusetts created a salamander-shaped district — a portmanteau of 'Gerry' + 'salamander'
why_it_matters: Gerrymandering allows politicians to choose their voters rather than voters choosing their politicians.
context_example: The state's gerrymandered map packed Democratic voters into three oddly shaped districts, ensuring Republican majorities in the remaining nine.
