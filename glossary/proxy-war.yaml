slug: proxy-war
name: Proxy War
short_definition: A conflict in which major powers support opposing sides without directly fighting each other, using local forces as surrogates.
body_md: ""
category: foreign-policy
difficulty: intermediate
status: active
etymology: "Latin: procurare (to take care of on behalf of another). 'Proxy' originally meant an agent authorized to act for someone else; applied to warfare in the Cold War era"
why_it_matters: Proxy wars allow great powers to compete for influence without the catastrophic risk of direct confrontation, but they devastate the countries where they are fought.
context_example: The Cold War was fought through proxy wars in Korea, Vietnam, Angola, and Afghanistan, where the US and Soviet Union armed opposing sides rather than fighting each other directly.
