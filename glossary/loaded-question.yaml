slug: loaded-question
name: Loaded Question
short_definition: A question phrased so that any direct answer concedes a controversial assumption — "have you stopped beating your wife?" being the canonical example.
body_md: ""
category: rhetoric
difficulty: foundational
status: active
etymology: English usage from at least the 19th century — borrowing the metaphor of a 'loaded' weapon or die. The trap is that the question's framing precommits the respondent before they speak.
why_it_matters: "Loaded questions are the press-conference equivalent of a perjury trap. The right move is not to answer but to refuse the frame: \"That question contains a premise I don't accept — let me address what I think you actually mean to ask.\""
context_example: The interviewer's loaded question — 'Why do you support letting violent offenders out early?' — assumed a position the candidate did not hold and forced him to spend the next thirty seconds on a frame he never agreed to.
