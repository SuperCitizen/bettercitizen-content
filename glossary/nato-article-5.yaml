slug: nato-article-5
name: NATO Article 5
short_definition: The collective defense clause of the NATO treaty stating that an armed attack against one member shall be considered an attack against all.
body_md: ""
category: military
difficulty: advanced
status: active
etymology: Named for its position in the North Atlantic Treaty signed in Washington, D.C. on April 4, 1949
why_it_matters: Article 5 is the most consequential mutual defense commitment in history — its credibility deters aggression, but its invocation could draw the US into a major war.
context_example: After 9/11, NATO invoked Article 5 for the first and only time, with all member nations declaring the attack on America an attack on themselves.
