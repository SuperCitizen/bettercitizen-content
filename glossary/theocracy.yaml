slug: theocracy
name: Theocracy
short_definition: A system of government in which religious leaders rule in the name of God or a deity.
body_md: ""
category: social-cultural
difficulty: intermediate
status: active
etymology: "Greek: theokratia — from theos (god) + kratos (rule). Coined by the historian Josephus in the 1st century AD to describe ancient Israel"
why_it_matters: Theocracies merge religious and political authority, typically restricting individual freedoms in the name of divine law — understanding them is key to grasping Middle Eastern politics.
context_example: Since the 1979 Islamic Revolution, Iran has operated as a theocracy where the Supreme Leader, a religious cleric, holds ultimate authority over elected officials.
