slug: affirmative-action
name: Affirmative Action
short_definition: Policies that take factors like race, gender, or socioeconomic background into account to benefit underrepresented groups, particularly in employment and education.
body_md: ""
category: rights-and-law
difficulty: intermediate
status: active
etymology: "English: coined by President Kennedy in Executive Order 10925 (1961), which required federal contractors to 'take affirmative action' to ensure non-discrimination"
why_it_matters: The Supreme Court struck down race-based college admissions in 2023, fundamentally reshaping the debate about how to address systemic inequality.
context_example: After the Supreme Court ended affirmative action in college admissions, universities scrambled to find race-neutral ways to maintain diverse student bodies.
