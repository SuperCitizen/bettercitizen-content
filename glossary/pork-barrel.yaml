slug: pork-barrel
name: Pork Barrel
short_definition: Government spending for localized projects secured primarily to bring money to a representative's district.
body_md: ""
category: government
difficulty: intermediate
status: active
etymology: "English: from the practice of distributing salt pork from barrels to enslaved people on Southern plantations. Applied to government spending by 1870s political cartoonists"
why_it_matters: Pork barrel spending is both a tool for building legislative coalitions and a symbol of government waste — the debate reveals the tension between local interests and national priorities.
context_example: Critics called the $398 million bridge to an island with 50 residents the ultimate pork barrel project, while the congressman defended it as critical infrastructure for his constituents.
