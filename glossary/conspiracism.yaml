slug: conspiracism
name: Conspiracism
short_definition: A worldview that explains major events as the result of secret plots by powerful, malevolent groups.
body_md: ""
category: media-information
difficulty: advanced
status: active
etymology: "Latin: conspirare (to agree, unite, plot) + '-ism.' While conspiracy theories are ancient, 'conspiracism' as a worldview was formalized by political scientist Michael Barkun in the early 2000s"
why_it_matters: Conspiracism erodes trust in democratic institutions and can radicalize individuals — understanding its psychological appeal is essential to countering it.
context_example: The researcher found that conspiracism correlated strongly with feelings of powerlessness, suggesting that conspiracy theories offer a sense of agency to people who feel the system has failed them.
