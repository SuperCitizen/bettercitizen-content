slug: nuclear-proliferation
name: Nuclear Proliferation
short_definition: The spread of nuclear weapons, fissile material, and weapons technology to nations that do not already possess them.
body_md: ""
category: foreign-policy
difficulty: advanced
status: active
etymology: "Latin: nucleus (kernel) + proliferare (to grow rapidly). Nuclear proliferation became a term of art during the Cold War arms race"
why_it_matters: Nuclear proliferation remains the greatest existential threat to civilization — each new nuclear state increases the risk of intentional or accidental nuclear war.
context_example: Intelligence assessments concluded that the country's uranium enrichment program had reached the threshold for nuclear proliferation, triggering an emergency UN Security Council session.
