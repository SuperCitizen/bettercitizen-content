slug: subsidy
name: Subsidy
short_definition: A financial benefit provided by the government to individuals, businesses, or industries to promote economic or social objectives.
body_md: ""
category: economy
difficulty: foundational
status: active
etymology: "Latin: subsidium (help, assistance, reserve troops). From sub (under, behind) + sedere (to sit) — originally military reserves sitting in readiness behind the front lines"
why_it_matters: Subsidies shape entire industries — from agriculture to energy to technology — and the debate over which sectors deserve government support is a perennial political battle.
context_example: Farm subsidies totaling $20 billion annually have been criticized for disproportionately benefiting large agribusinesses while small family farms receive little support.
