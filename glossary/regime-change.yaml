slug: regime-change
name: Regime Change
short_definition: The replacement of one government or political system with another, often through external intervention.
body_md: ""
category: foreign-policy
difficulty: intermediate
status: active
etymology: "French: régime (system of government) + English: change. Régime from Latin: regimen (rule, guidance)"
why_it_matters: Regime change operations — from Iran in 1953 to Iraq in 2003 — have defined and often haunted American foreign policy, raising fundamental questions about sovereignty and consequences.
context_example: The 2003 invasion of Iraq accomplished regime change within weeks, but the occupation that followed devolved into years of sectarian violence and insurgency.
