slug: tariff
name: Tariff
short_definition: A tax imposed on imported goods, used to protect domestic industries or as a tool of trade policy.
body_md: ""
category: economy
difficulty: foundational
status: active
etymology: "Arabic via Italian: tarifa (notification of fees)"
why_it_matters: Tariffs raise prices for consumers and can trigger trade wars, but proponents argue they protect domestic jobs and national security interests.
context_example: The administration imposed a 25% tariff on steel imports, prompting retaliatory tariffs from the European Union and China.
