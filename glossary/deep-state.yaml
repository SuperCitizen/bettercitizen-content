slug: deep-state
name: Deep State
short_definition: A term for the alleged network of career government officials, intelligence officers, and bureaucrats who supposedly work to undermine or resist elected leaders. Used by populists to describe unaccountable institutional power.
body_md: ""
category: government
difficulty: intermediate
status: active
etymology: "Turkish: derin devlet (deep state) — originally describing the military-intelligence apparatus that operated behind Turkey's elected government. Entered American political discourse in the 2010s"
why_it_matters: Whether viewed as conspiracy theory or legitimate concern, the concept reflects deep distrust of unelected institutional power and the tension between expertise and democracy.
context_example: The president accused the deep state of leaking classified information to undermine his foreign policy, while critics argued the leaks exposed genuine wrongdoing.
