slug: amendment
name: Amendment
short_definition: A formal change or addition to the Constitution, requiring approval by two-thirds of Congress and three-fourths of state legislatures.
body_md: ""
category: government
difficulty: foundational
status: active
etymology: "Latin: emendare (to correct, improve). Old French: amendement (correction)"
why_it_matters: Amendments have abolished slavery, granted women the right to vote, and established fundamental rights — they are how the Constitution evolves.
context_example: Advocates for an Equal Rights Amendment argued that only a constitutional amendment could guarantee permanent protection against sex discrimination.
