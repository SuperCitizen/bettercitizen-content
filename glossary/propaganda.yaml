slug: propaganda
name: Propaganda
short_definition: Information, especially biased or misleading, used to promote a political cause or point of view.
body_md: ""
category: media-information
difficulty: foundational
status: active
etymology: "Latin: propaganda fide (propagation of the faith). Originally the name of a Catholic Church committee (1622) for spreading Christianity; political usage emerged in the 20th century"
why_it_matters: Propaganda has shaped every major conflict and political movement of the modern era — recognizing it is the first defense against manipulation.
context_example: The government's propaganda campaign flooded social media with patriotic imagery and misleading statistics to build public support for the military operation.
