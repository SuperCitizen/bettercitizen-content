slug: bureaucracy
name: Bureaucracy
short_definition: A system of government administration managed by departments staffed by non-elected officials, following fixed rules and procedures.
body_md: ""
category: government
difficulty: intermediate
status: active
etymology: "French: bureau (desk, office) + Greek: kratos (rule). Coined by French economist Vincent de Gournay in 1745 to describe 'rule by desks'"
why_it_matters: Bureaucracy is both the machinery that makes government function and, for critics, the source of inefficiency, red tape, and unaccountable power.
context_example: The application required approval from three separate bureaus and took 14 months to process, exemplifying the bureaucracy's reputation for inefficiency.
