slug: quorum
name: Quorum
short_definition: The minimum number of members required to be present for a legislative body to conduct business.
body_md: ""
category: government
difficulty: intermediate
status: active
etymology: "Latin: quorum (of whom)"
why_it_matters: Without a quorum, Congress cannot vote on legislation, which minority parties have occasionally exploited by walking out to block proceedings.
context_example: Democrats fled the state capitol to deny Republicans a quorum and prevent a vote on the redistricting bill.
