slug: lobbyist
name: Lobbyist
short_definition: A person who seeks to influence legislators on behalf of a special interest group, industry, or organization.
body_md: ""
category: government
difficulty: intermediate
status: active
etymology: "English: from 'lobby' (a hall or corridor) — referring to the practice of approaching legislators in the lobby of the Capitol building. Usage dates to the 1830s"
why_it_matters: There are over 12,000 registered federal lobbyists in Washington, spending $4 billion annually — their influence raises persistent questions about whose interests government actually serves.
context_example: The pharmaceutical lobby spent $374 million in a single year, more than any other industry, to shape drug pricing legislation.
