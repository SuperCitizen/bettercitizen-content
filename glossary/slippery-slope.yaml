slug: slippery-slope
name: Slippery Slope
short_definition: A fallacy that asserts a relatively small first step will inevitably lead to a chain of related events ending in some extreme outcome, without showing the chain is causal.
body_md: ""
category: rhetoric
difficulty: foundational
status: active
etymology: English metaphor in legal and political writing since at least the 1930s. The mountaineering image — once you slip, you can't stop sliding — encodes the fallacy's claim of uncontrollable momentum.
why_it_matters: Slippery-slope arguments are not always fallacious — sometimes the chain really is causal — but they often substitute fear of an extreme endpoint for analysis of the actual policy. Asking 'what specifically would force the next step?' separates argument from alarm.
context_example: "Critics of the modest gun-storage law leaned on slippery-slope reasoning: today it's safe-storage, tomorrow it's confiscation, eventually total disarmament — without explaining the mechanism that would carry the chain forward."
