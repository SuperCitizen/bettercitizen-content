slug: civil-war-amendments
name: Civil War Amendments
short_definition: The 13th, 14th, and 15th Amendments, abolishing slavery, granting citizenship and equal protection, and prohibiting racial discrimination in voting.
body_md: ""
category: historical
difficulty: intermediate
status: historical
etymology: "English: named for the American Civil War (1861-1865) during and after which the 13th (1865), 14th (1868), and 15th (1870) Amendments were ratified"
why_it_matters: The Civil War Amendments fundamentally transformed the Constitution, creating the legal basis for equality that was not fulfilled for another century — and remains contested today.
context_example: The 14th Amendment's Equal Protection Clause, originally written to protect formerly enslaved people, has become the most litigated provision in constitutional law.
