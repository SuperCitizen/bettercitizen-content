slug: inflation-target
name: Inflation Target
short_definition: A publicly announced goal for the rate of inflation that a central bank aims to achieve, typically around 2% annually in developed economies.
body_md: ""
category: economy
difficulty: advanced
status: active
etymology: "Latin: inflare (to blow into) + Old French: targette (small shield, mark to aim at). Inflation targeting as formal central bank policy was pioneered by New Zealand in 1990"
why_it_matters: The 2% inflation target guides trillions of dollars in central bank policy — when inflation exceeds it, interest rates rise, affecting mortgages, jobs, and economic growth worldwide.
context_example: The Fed chair reiterated the commitment to the 2% inflation target, signaling that interest rates would remain elevated until price growth returned to that level.
