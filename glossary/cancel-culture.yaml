slug: cancel-culture
name: Cancel Culture
short_definition: The practice of withdrawing support for public figures or companies after they have done or said something considered objectionable.
body_md: ""
category: social-cultural
difficulty: intermediate
status: active
etymology: "English: 'cancel' from Latin cancellare (to cross out, delete) + 'culture.' Originated in Black Twitter slang in the mid-2010s, entered mainstream political discourse by 2019"
why_it_matters: The debate over cancel culture reflects deeper tensions about free speech, accountability, and who gets to set the boundaries of acceptable discourse.
context_example: The professor was fired after students launched a social media campaign calling for her removal over a controversial lecture, reigniting the debate over cancel culture on campus.
