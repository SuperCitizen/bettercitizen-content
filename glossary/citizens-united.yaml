slug: citizens-united
name: Citizens United v. FEC
short_definition: 2010 Supreme Court case holding that the First Amendment prohibits limits on independent political expenditures by corporations and unions. Created the legal foundation for Super PACs.
body_md: ""
category: elections
difficulty: advanced
status: active
etymology: Named after the plaintiff, Citizens United, a conservative nonprofit that sought to air a film critical of Hillary Clinton within 30 days of a primary
why_it_matters: Fundamentally changed campaign finance, enabling unlimited independent spending and opening the floodgates for corporate and union money in elections.
context_example: In the decade since Citizens United, outside spending in federal elections has exceeded $10 billion, with critics calling it the worst Supreme Court decision since Dred Scott.
