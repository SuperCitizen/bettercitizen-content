slug: administrative-state
name: Administrative State
short_definition: The network of federal agencies, regulatory bodies, and career civil servants that manage government programs and enforce regulations, operating with significant independence from elected officials.
body_md: ""
category: government
difficulty: advanced
status: active
etymology: "English: 'administrative' from Latin administrare (to manage, direct) + 'state.' The concept was named by political scientist Dwight Waldo in The Administrative State (1948)"
why_it_matters: The tension between elected officials and the administrative state is at the heart of debates about democratic accountability — do experts or voters have the final say?
context_example: Critics argue the administrative state makes decisions that should be made by elected representatives; defenders say it provides expertise and continuity that politicians cannot.
