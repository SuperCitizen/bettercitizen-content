slug: war-powers-act
name: War Powers Act
short_definition: A 1973 federal law intended to check the president's power to commit the US to armed conflict without Congressional consent.
body_md: ""
category: government
difficulty: advanced
status: active
etymology: Named after the constitutional war powers divided between Congress (to declare war) and the president (as commander-in-chief). Enacted in 1973 over President Nixon's veto
why_it_matters: The War Powers Act has been invoked but never fully enforced — every president since Nixon has questioned its constitutionality, and Congress has rarely forced the issue.
context_example: The senator argued the administration had violated the War Powers Act by continuing military operations for over 60 days without seeking congressional authorization.
