slug: state-of-the-union
name: State of the Union
short_definition: An annual address by the president to Congress reporting on the condition of the nation and proposing legislative priorities.
body_md: ""
category: government
difficulty: foundational
status: active
etymology: "English: from Article II, Section 3 of the Constitution, which requires the president to 'from time to time give to the Congress information of the state of the union.' The phrase became the formal name of the address"
why_it_matters: The State of the Union has evolved from a written report into the most-watched political address of the year, a platform for presidents to set the national agenda.
context_example: The president used the State of the Union address to announce a new manufacturing initiative, drawing applause from members of both parties seated in the chamber.
