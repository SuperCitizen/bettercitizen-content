slug: pizzagate
name: Pizzagate
short_definition: A debunked conspiracy theory that falsely claimed a Washington, D.C. pizza restaurant was a front for a child trafficking ring run by political elites.
body_md: ""
category: historical
difficulty: intermediate
status: historical
etymology: "English portmanteau: 'pizza' (from the restaurant Comet Ping Pong) + '-gate' (the suffix applied to political scandals since Watergate). Originated on 4chan and Reddit in 2016"
why_it_matters: Pizzagate demonstrated how online conspiracy theories can lead to real-world violence and was a precursor to the QAnon movement that followed.
context_example: A man drove from North Carolina to Washington, D.C. and fired an assault rifle inside the pizzeria, acting on the Pizzagate conspiracy he had absorbed from social media.
