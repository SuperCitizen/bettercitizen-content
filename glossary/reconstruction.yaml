slug: reconstruction
name: Reconstruction
short_definition: The period (1865-1877) after the Civil War during which the Southern states were rebuilt and readmitted to the Union, with attempts to secure rights for formerly enslaved people.
body_md: ""
category: historical
difficulty: intermediate
status: historical
etymology: "Latin: re- (again) + construere (to build). Applied to the post-Civil War era by congressional leaders who saw it as 'reconstructing' the Union on the basis of equality"
why_it_matters: Reconstruction's failure to fully integrate formerly enslaved people into civic life set the stage for Jim Crow, racial inequality, and unfinished debates that persist today.
context_example: The brief promise of Reconstruction — Black men voting, holding office, and owning land — was violently reversed by white supremacist groups and the withdrawal of federal troops in 1877.
