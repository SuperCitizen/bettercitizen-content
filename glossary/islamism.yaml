slug: islamism
name: Islamism
short_definition: A range of political ideologies that hold Islam should guide social, political, and personal life, varying from moderate reform to militant extremism.
body_md: ""
category: social-cultural
difficulty: advanced
status: active
etymology: "English: 'Islam' (Arabic: submission to God) + '-ism.' The term gained widespread use in Western discourse after the 1979 Iranian Revolution"
why_it_matters: Distinguishing Islamism from Islam is essential — Islamism is a political ideology, not a religion, and the vast majority of Muslims do not support its militant forms.
context_example: The election brought an Islamist party to power through democratic means, challenging the assumption that Islamism and democracy are inherently incompatible.
