slug: disenfranchisement
name: Disenfranchisement
short_definition: The deprivation of the right to vote, whether through legal barriers, felony convictions, or systemic obstacles.
body_md: ""
category: elections
difficulty: intermediate
status: active
etymology: "Old French: desfranchir (to deprive of rights). Franchise originally meant 'freedom' or 'privilege'"
why_it_matters: Over five million Americans cannot vote due to felony disenfranchisement laws, with stark racial disparities in who is affected.
context_example: Florida voters approved a constitutional amendment restoring voting rights to 1.4 million people with felony convictions who had completed their sentences.
