slug: kleptocracy
name: Kleptocracy
short_definition: A government in which leaders use their political power to steal from the people and the state, enriching themselves and their associates.
body_md: ""
category: government
difficulty: advanced
status: active
etymology: "Greek: klepto (thief) + kratos (rule)"
why_it_matters: Kleptocracy is not just a domestic problem — stolen wealth flows through global financial systems, and fighting it requires international cooperation on transparency and enforcement.
context_example: The investigation revealed that the former president had siphoned $5 billion from state oil revenues into offshore accounts, a textbook case of kleptocracy.
