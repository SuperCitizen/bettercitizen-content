slug: whistleblower
name: Whistleblower
short_definition: A person who exposes wrongdoing, fraud, or corruption within an organization, often protected by specific laws.
body_md: ""
category: rights-and-law
difficulty: intermediate
status: active
etymology: "English: from the literal act of blowing a whistle to alert others to danger or foul play. Applied to exposing organizational wrongdoing since the 1970s, popularized by Ralph Nader"
why_it_matters: Whistleblowers have exposed some of the biggest scandals in American history — from Enron to NSA surveillance — but face enormous personal and professional risk.
context_example: The whistleblower's disclosure of the company's fraudulent emissions testing led to billions in fines and criminal charges against senior executives.
