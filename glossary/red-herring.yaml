slug: red-herring
name: Red Herring
short_definition: A logical fallacy that distracts from the topic at hand by introducing an unrelated point that pulls the conversation off course.
body_md: ""
category: rhetoric
difficulty: foundational
status: active
etymology: From the practice (real or apocryphal) of dragging strong-smelling smoked herring across a hunting trail to throw dogs off the scent. The metaphor entered political and literary criticism in the 19th century.
why_it_matters: Red herrings work because they're often genuinely interesting — the audience follows the new thread and forgets the original question was never answered. Spotting them keeps debate honest.
context_example: When pressed on the agency's budget overrun, the witness offered a red herring about the heroic field work the agency does, redirecting questioning away from the financial mismanagement.
related_term_slugs:
  - whataboutism
