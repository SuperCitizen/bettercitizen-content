slug: mercenary
name: Mercenary
short_definition: A private soldier hired to fight for a foreign army or armed force, motivated primarily by financial gain rather than national allegiance.
body_md: ""
category: military
difficulty: intermediate
status: active
etymology: "Latin: mercenarius (hired, paid). From merces (wages, pay). The term has carried negative connotations since antiquity — Machiavelli argued mercenaries were unreliable and dangerous"
why_it_matters: The rise of private military contractors like Wagner Group and Blackwater has blurred the line between state and private warfare, raising accountability concerns.
context_example: Russia's Wagner Group deployed mercenaries across Africa and the Middle East, extending Russian influence while giving the Kremlin plausible deniability.
