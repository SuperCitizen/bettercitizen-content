slug: capitalism
name: Capitalism
short_definition: An economic system based on private ownership of the means of production and their operation for profit in competitive markets.
body_md: ""
category: social-cultural
difficulty: foundational
status: active
etymology: "Latin: capitalis (of the head, principal). From caput (head). 'Capital' originally referred to a principal sum of money; '-ism' added in the mid-19th century"
why_it_matters: Capitalism has produced unprecedented wealth and innovation but also inequality and environmental damage — the debate over how much to regulate it defines modern politics.
context_example: The tech billionaire argued that capitalism was the greatest anti-poverty program in history, while protesters outside demanded the system be fundamentally restructured.
