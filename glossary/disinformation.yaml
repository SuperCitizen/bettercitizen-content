slug: disinformation
name: Disinformation
short_definition: False information deliberately created and spread to deceive and mislead.
body_md: ""
category: media-information
difficulty: foundational
status: active
etymology: "Russian: dezinformatsiya. Coined by Soviet intelligence in the 1920s to describe deliberate deception operations. Adopted into English during the Cold War"
why_it_matters: State-sponsored disinformation campaigns can undermine elections, erode trust in institutions, and even incite violence — distinguishing it from misinformation is critical.
context_example: Intelligence agencies identified a coordinated disinformation campaign that used fake social media accounts to amplify divisive content in the months before the election.
