slug: editorial
name: Editorial
short_definition: An opinion piece in a newspaper or media outlet that expresses the publication's official position on an issue.
body_md: ""
category: media-information
difficulty: foundational
status: active
etymology: "Latin: editor (one who puts forth) + '-ial.' From edere (to put out, publish)"
why_it_matters: Understanding the distinction between news reporting and editorials is fundamental to media literacy — confusing the two leads to distrust of journalism as a whole.
context_example: The newspaper's editorial board endorsed the challenger, breaking with decades of tradition and sparking a heated debate among its own reporters.
