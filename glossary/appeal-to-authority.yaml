slug: appeal-to-authority
name: Appeal to Authority
short_definition: A fallacy that treats an expert's say-so as proof of a claim, especially when the expert is outside their field or the claim is contested within the field.
body_md: ""
category: rhetoric
difficulty: intermediate
status: active
etymology: "Latin: argumentum ad verecundiam — literally 'argument to modesty,' coined by John Locke in 1690 to describe deference to authority that bypasses reason."
why_it_matters: Expertise matters, but evidence matters more. The fallacy is not citing experts; it's letting the citation substitute for the underlying reasoning. Understanding the distinction is the difference between deference and informed trust.
context_example: The op-ed leaned on appeal to authority — quoting a Nobel laureate's offhand remark on Twitter — rather than engaging with the actual peer-reviewed literature on the policy.
