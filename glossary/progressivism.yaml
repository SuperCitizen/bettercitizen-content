slug: progressivism
name: Progressivism
short_definition: A political philosophy supporting social reform, government intervention to address inequality, and the expansion of rights.
body_md: ""
category: social-cultural
difficulty: intermediate
status: active
etymology: "Latin: progressus (an advance). Political usage began with the Progressive Era (1890s-1920s) reform movement"
why_it_matters: Progressivism has driven some of America's most transformative changes, from women's suffrage to labor rights to environmental protection, but debates persist over how far reform should go.
context_example: The progressive wing of the party pushed for universal healthcare, a Green New Deal, and student debt cancellation, challenging the leadership's more cautious approach.
