slug: federal-reserve
name: Federal Reserve
short_definition: The central banking system of the United States, responsible for monetary policy, bank regulation, and financial stability.
body_md: ""
category: economy
difficulty: foundational
status: active
etymology: "English: 'Federal' from Latin foedus (treaty) + 'Reserve' from Latin reservare (to keep back). Created by the Federal Reserve Act of 1913"
why_it_matters: The Fed's interest rate decisions affect mortgages, employment, and the entire economy, yet it operates with significant independence from elected officials.
context_example: The Federal Reserve chair testified before Congress that the central bank would continue raising rates until inflation returned to its 2% target, regardless of the political consequences.
