slug: geneva-convention
name: Geneva Convention
short_definition: A series of international treaties establishing humanitarian standards for the treatment of wounded soldiers, prisoners of war, and civilians during armed conflict.
body_md: ""
category: foreign-policy
difficulty: intermediate
status: active
etymology: Named after Geneva, Switzerland, where the first convention was adopted in 1864 at the urging of Henry Dunant, founder of the Red Cross
why_it_matters: The Geneva Conventions set the baseline for civilized conduct in war — violations constitute war crimes and can be prosecuted by international tribunals.
context_example: Human rights organizations accused both sides of violating the Geneva Convention by targeting hospitals and restricting humanitarian aid.
