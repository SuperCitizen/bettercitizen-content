slug: section-230
name: Section 230
short_definition: A provision of the Communications Decency Act that shields internet platforms from liability for user-generated content.
body_md: ""
category: media-information
difficulty: advanced
status: active
etymology: Named for its position in the Communications Decency Act of 1996 (Title V of the Telecommunications Act). Written by Senators Ron Wyden and Chris Cox
why_it_matters: Called 'the 26 words that created the internet,' Section 230 enabled the growth of social media and online platforms, but both parties want to reform it for very different reasons.
context_example: Without Section 230, platforms like YouTube and Facebook would be legally liable for every post, comment, and video uploaded by their billions of users.
