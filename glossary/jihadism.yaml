slug: jihadism
name: Jihadism
short_definition: An ideology advocating violent struggle to establish Islamic governance, used by extremist groups to justify terrorism.
body_md: ""
category: social-cultural
difficulty: advanced
status: active
etymology: "Arabic: jihad (struggle, effort). In Islamic theology, jihad primarily means personal spiritual struggle; the violent political interpretation is rejected by mainstream Islamic scholars"
why_it_matters: Jihadism has shaped global security policy since 9/11, driving wars in Afghanistan and Iraq, surveillance programs, and immigration debates worldwide.
context_example: Intelligence agencies tracked the spread of jihadist ideology online, where encrypted platforms allowed recruiters to radicalize individuals across borders.
