slug: authoritarianism
name: Authoritarianism
short_definition: A system of government characterized by strong central power, limited political freedoms, and the concentration of authority in a single leader or small group.
body_md: ""
category: social-cultural
difficulty: intermediate
status: active
etymology: "Latin: auctoritas (authority, influence) + English: '-arian.' From auctor (originator, promoter)"
why_it_matters: Authoritarianism is on the rise globally, with Freedom House reporting that democracy has declined in more countries than it has advanced for over 15 consecutive years.
context_example: The government's crackdown on the press, jailing of opposition leaders, and manipulation of election rules followed a textbook pattern of authoritarian consolidation.
