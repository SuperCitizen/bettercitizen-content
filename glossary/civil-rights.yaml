slug: civil-rights
name: Civil Rights
short_definition: Rights that protect individuals from discrimination by governments and private entities, ensuring equal treatment regardless of race, gender, religion, or other characteristics.
body_md: ""
category: rights-and-law
difficulty: foundational
status: active
etymology: "Latin: civilis (relating to citizens) + jus (right, law)"
why_it_matters: Civil rights ensure that the promise of equality under law extends to all Americans, not just those in the majority.
context_example: The Civil Rights Act of 1964 prohibited discrimination in employment, education, and public accommodations, transforming American society.
