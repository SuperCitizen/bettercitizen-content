slug: entitlement-program
name: Entitlement Program
short_definition: A government program that provides benefits to individuals meeting certain eligibility criteria, such as Social Security and Medicare.
body_md: ""
category: government
difficulty: intermediate
status: active
etymology: "English: 'entitlement' from Old French entitler (to give a title or right to). Applied to government programs in the 1970s, the term implies a legal right to benefits rather than a discretionary grant"
why_it_matters: Entitlement programs consume over 60% of the federal budget and are growing as the population ages — reforming them is politically toxic but fiscally unavoidable.
context_example: Both parties acknowledged that entitlement programs were driving the deficit, but neither was willing to propose cuts to Social Security or Medicare in an election year.
