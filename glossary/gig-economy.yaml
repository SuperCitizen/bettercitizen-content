slug: gig-economy
name: Gig Economy
short_definition: A labor market characterized by short-term, freelance, or contract work rather than traditional full-time employment.
body_md: ""
category: economy
difficulty: intermediate
status: active
etymology: "English: 'gig' from jazz slang for a single engagement or performance (early 20th century) + 'economy.' Applied to the broader labor market in the 2010s"
why_it_matters: The gig economy offers flexibility but often lacks health insurance, retirement benefits, and labor protections, creating a growing class of workers in economic precarity.
context_example: Uber drivers, DoorDash couriers, and TaskRabbit workers form the backbone of the gig economy, earning by the job without the safety net of traditional employment.
