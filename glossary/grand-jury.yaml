slug: grand-jury
name: Grand Jury
short_definition: A body of citizens empowered to investigate potential criminal conduct and determine whether charges should be brought, meeting in secret and requiring a lower standard of proof than a trial jury.
body_md: ""
category: rights-and-law
difficulty: intermediate
status: active
etymology: "Anglo-French: grand (large) + jury from Old French jurée (oath, sworn body). 'Grand' distinguishes it from the smaller 'petit jury' that decides guilt at trial. The institution dates to 12th-century England"
why_it_matters: Grand juries are supposed to protect citizens from unfounded prosecution, but critics argue they rubber-stamp prosecutorial requests — the saying goes that a prosecutor could 'indict a ham sandwich.'
context_example: The grand jury declined to indict the officer, sparking protests from those who argued the secret proceeding shielded police from accountability.
