slug: whataboutism
name: Whataboutism
short_definition: A deflection tactic that responds to a criticism not by addressing it but by accusing the critic of an unrelated wrong ("What about X?").
body_md: ""
category: rhetoric
difficulty: foundational
status: active
etymology: Originated in Cold War-era Western coverage of Soviet rhetoric, where Moscow routinely answered criticism of human-rights abuses by pointing at American racism or imperialism. Re-popularized in U.S. political commentary after 2016.
why_it_matters: Whataboutism short-circuits accountability. Even when the counter-charge is true, it doesn't refute the original criticism — it just changes the subject. Naming the move makes the deflection visible.
context_example: Asked about the corruption indictment against the senator, the spokesperson pivoted to whataboutism, listing scandals from the opposing party going back twenty years.
