slug: no-true-scotsman
name: No True Scotsman
short_definition: A fallacy in which a counterexample to a generalization is dismissed by redefining the category to exclude it — "no true Scotsman would do that."
body_md: ""
category: rhetoric
difficulty: intermediate
status: active
etymology: Coined by philosopher Antony Flew in his 1975 book *Thinking About Thinking* using the example of a Scotsman who, on hearing of an Englishman's crime, insists no true Scot would do such a thing — and then, when shown a Scotsman who did, redefines 'true Scot' to exclude him.
why_it_matters: "The no-true-Scotsman move makes any group definition unfalsifiable. Recognizing it lets you push back: 'You said all members of this group believe X. I showed you one who doesn't. Either revise the claim or admit it has counterexamples.'"
context_example: "Asked about extremist members of his own movement, the activist deployed a no-true-Scotsman: 'Those people aren't real conservatives' — refusing to count any inconvenient case as part of the category he was defending."
