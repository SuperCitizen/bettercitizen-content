slug: plea-bargain
name: Plea Bargain
short_definition: An agreement in a criminal case where the defendant pleads guilty to a lesser charge in exchange for a more lenient sentence, avoiding trial.
body_md: ""
category: rights-and-law
difficulty: intermediate
status: active
etymology: "English: 'plea' from Anglo-French plai (lawsuit) + 'bargain' from Old French bargaignier (to haggle). Plea bargaining became widespread in the US court system in the 19th century"
why_it_matters: Over 95% of federal criminal cases are resolved through plea bargains — they keep the system running but raise concerns about coerced confessions and unequal justice.
context_example: The defendant accepted a plea bargain for five years rather than risk a potential 30-year sentence at trial, even though he maintained his innocence.
