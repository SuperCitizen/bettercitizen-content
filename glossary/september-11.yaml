slug: september-11
name: September 11
short_definition: The terrorist attacks of September 11, 2001, in which al-Qaeda operatives hijacked four commercial airplanes, killing nearly 3,000 people and fundamentally reshaping American foreign and domestic policy.
body_md: ""
category: historical
difficulty: foundational
status: historical
etymology: Named for the date — September 11, 2001. Also written as 9/11, following the American date format (month/day). The attacks targeted the World Trade Center in New York and the Pentagon in Virginia
why_it_matters: 9/11 launched the War on Terror, created the Department of Homeland Security, expanded surveillance powers, and reshaped immigration policy — its effects define the 21st-century American experience.
context_example: In the weeks after September 11, Congress passed the Authorization for the Use of Military Force with only one dissenting vote, granting the president sweeping war powers that remain in effect two decades later.
