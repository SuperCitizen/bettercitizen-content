slug: stagflation
name: Stagflation
short_definition: An economic condition of slow growth, high unemployment, and rising prices occurring simultaneously.
body_md: ""
category: economy
difficulty: advanced
status: active
etymology: "English portmanteau: stagnation + inflation. Coined by British politician Iain Macleod in 1965"
why_it_matters: Stagflation is especially difficult to address because the standard remedy for inflation (raising rates) worsens unemployment, and vice versa.
context_example: The combination of rising energy prices and slowing growth revived fears of 1970s-style stagflation among Wall Street analysts.
