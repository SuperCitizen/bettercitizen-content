slug: equal-protection
name: Equal protection
short_definition: 14th Amendment guarantee that states must apply the law equally to all persons within their jurisdiction.
body_md: ""
category: rights-and-law
difficulty: intermediate
status: active
etymology: "Constitutional English: from the Fourteenth Amendment (1868), drafted during Reconstruction to protect formerly enslaved people"
why_it_matters: The Equal Protection Clause has been the legal basis for striking down segregation, securing marriage equality, and challenging discriminatory laws at every level.
context_example: The Supreme Court held that the state's ban on same-sex marriage violated the Equal Protection Clause of the Fourteenth Amendment.
