slug: precedent
name: Precedent
short_definition: A legal decision or principle established in a previous case that guides future similar cases.
body_md: ""
category: rights-and-law
difficulty: intermediate
status: active
etymology: "Latin: praecedens (going before)"
why_it_matters: Precedent makes the law predictable — people and businesses can plan their affairs knowing how courts have ruled before, and like cases will be treated alike.
context_example: The appeals court ruled that the lower court was bound by the precedent set in last year's ruling on qualified immunity.
