slug: amicus-brief
name: Amicus Brief
short_definition: A legal document filed by a non-party to a case who has a strong interest in the outcome, offering information or perspective.
body_md: ""
category: rights-and-law
difficulty: advanced
status: active
etymology: "Latin: amicus curiae ('friend of the court')"
why_it_matters: Amicus briefs allow advocacy groups, experts, and other stakeholders to influence landmark cases, often shaping the arguments justices consider.
context_example: Over 80 amicus briefs were filed in the affirmative action case, making it one of the most heavily briefed in Supreme Court history.
