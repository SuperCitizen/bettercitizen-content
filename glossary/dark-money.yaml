slug: dark-money
name: Dark money
short_definition: Political spending by 501(c)(4) social-welfare nonprofits and similar entities that do not have to disclose their donors.
body_md: ""
category: elections
difficulty: advanced
status: active
etymology: "Modern English: 'dark' (hidden, secret) + 'money' — coined in the 2010s to describe untraceable political spending"
why_it_matters: Dark money allows wealthy individuals and organizations to influence elections anonymously, undermining transparency in democratic politics.
context_example: A dark money group spent $12 million on attack ads in the Senate race, and voters had no way to know who was funding them.
