slug: geneva-protocol
name: Geneva Protocol
short_definition: A 1925 international treaty prohibiting the use of chemical and biological weapons in warfare.
body_md: ""
category: military
difficulty: advanced
status: active
etymology: Named after Geneva, Switzerland, where the protocol was signed on June 17, 1925. It built on the 1899 and 1907 Hague Conventions
why_it_matters: The Geneva Protocol established the norm against chemical and biological weapons, though enforcement remains a challenge when nations violate it.
context_example: Syria's use of sarin gas against civilians in 2013 violated the Geneva Protocol, crossing the 'red line' that triggered international outrage but only limited consequences.
