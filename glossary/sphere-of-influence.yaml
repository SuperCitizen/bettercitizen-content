slug: sphere-of-influence
name: Sphere of Influence
short_definition: A region where a major power exerts dominant economic, military, or political control, though the region is not formally under its sovereignty.
body_md: ""
category: foreign-policy
difficulty: intermediate
status: active
etymology: "English: 'sphere' from Greek sphaira (ball, globe) + 'influence' from Latin influere (to flow in). The term entered diplomacy in the late 19th century during the European partition of Africa and Asia"
why_it_matters: Spheres of influence explain why Russia views NATO expansion as an existential threat and why the US opposes Chinese military bases in the Pacific — great powers fiercely guard their backyards.
context_example: Russia's invasion of Ukraine was driven in part by the conviction that the former Soviet republic lay within Russia's sphere of influence and must not be allowed to join Western alliances.
