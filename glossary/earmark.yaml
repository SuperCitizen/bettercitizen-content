slug: earmark
name: Earmark
short_definition: A legislative provision that directs approved funds to be spent on specific projects, typically in a congressperson's district.
body_md: ""
category: government
difficulty: advanced
status: active
etymology: "English: from the practice of marking a notch in an animal's ear to indicate ownership. Applied to legislative spending provisions in the mid-20th century"
why_it_matters: Earmarks were banned in 2011 as symbols of corruption but quietly restored in 2021 — their abolition may have actually made Congress less functional by removing incentives for compromise.
context_example: The senator agreed to vote for the infrastructure bill after securing a $50 million earmark for a bridge replacement in her state, illustrating how earmarks grease the legislative process.
