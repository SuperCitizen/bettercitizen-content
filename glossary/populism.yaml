slug: populism
name: Populism
short_definition: A political approach that seeks to appeal to ordinary people who feel their concerns are disregarded by established elites.
body_md: ""
category: social-cultural
difficulty: intermediate
status: active
etymology: "Latin: populus (the people). First used politically by the American People's Party (Populists) in the 1890s"
why_it_matters: Populism is reshaping politics worldwide, from Trump to Brexit to Bolsonaro, as voters express frustration with institutions they see as serving the few over the many.
context_example: The candidate's populist message — attacking Wall Street, Washington insiders, and media elites — resonated with working-class voters who felt left behind by globalization.
