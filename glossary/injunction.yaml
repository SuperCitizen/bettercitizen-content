slug: injunction
name: Injunction
short_definition: A court order requiring a party to do or refrain from doing a specific act.
body_md: ""
category: rights-and-law
difficulty: advanced
status: active
etymology: "Latin: injungere (to join, attach, impose)"
why_it_matters: Injunctions are the judiciary's most powerful tool for stopping government overreach in real time, often blocking policies before they take effect.
context_example: A federal judge issued a nationwide injunction blocking the executive order on immigration, preventing enforcement while the case proceeded.
