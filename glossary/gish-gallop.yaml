slug: gish-gallop
name: Gish Gallop
short_definition: A debate tactic of overwhelming the opponent with so many short, weak arguments that none of them can be addressed in the time available — making the speaker appear to win by sheer volume.
body_md: ""
category: rhetoric
difficulty: intermediate
status: active
etymology: Coined in the 1990s by anthropologist Eugenie Scott to describe creationist debater Duane Gish's practice of firing off dozens of brief claims, each of which would take far longer to refute than to assert.
why_it_matters: "Refutation is asymmetric: a one-line claim can require a paragraph or a paper to debunk. The gish gallop weaponizes that asymmetry. Recognizing the pattern is the first step toward refusing to play in its terms."
context_example: The candidate's debate performance was a gish gallop — sixteen distinct claims in ninety seconds, none developed enough to fact-check live, every one taking the next round of questioning further off topic.
