slug: lame-duck
name: Lame Duck
short_definition: An elected official or group continuing to hold office during the period between the election of a successor and the successor's inauguration.
body_md: ""
category: government
difficulty: intermediate
status: active
etymology: "English: originally 18th-century London Stock Exchange slang for a broker who could not pay their debts. Applied to politics in the 19th century for officials serving out their final days"
why_it_matters: Lame duck periods can be politically volatile — outgoing officials may rush through last-minute appointments, pardons, and policy changes before leaving office.
context_example: During the lame duck session, the outgoing president issued 143 pardons and signed a flurry of executive orders, knowing they might be reversed within weeks.
