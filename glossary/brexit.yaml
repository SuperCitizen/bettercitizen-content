slug: brexit
name: Brexit
short_definition: The United Kingdom's withdrawal from the European Union, approved by referendum in 2016 and completed in 2020. A watershed moment for European populism and sovereignty debates.
body_md: ""
category: historical
difficulty: intermediate
status: historical
etymology: "English portmanteau: 'Britain' + 'exit.' Modeled on 'Grexit' (potential Greek exit from the Eurozone). Coined by Peter Wilding in a 2012 blog post"
why_it_matters: Brexit demonstrated that populist sentiment could actually override institutional consensus — and revealed the complexity of unwinding deep integration.
context_example: The Brexit vote stunned financial markets and political establishments across Europe, as the UK became the first nation to leave the European Union.
