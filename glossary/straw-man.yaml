slug: straw-man
name: Straw Man
short_definition: A logical fallacy that misrepresents someone's argument to make it easier to attack.
body_md: ""
category: media-information
difficulty: intermediate
status: active
etymology: "English: from the practice of using a straw-stuffed dummy as an easy opponent in military training. First used as a rhetorical term in the mid-20th century"
why_it_matters: Straw man arguments are pervasive in political rhetoric and media — recognizing them is essential to evaluating whether a criticism actually addresses the point being made.
context_example: When the senator argued for background checks, his opponent attacked him for 'wanting to take away everyone's guns' — a classic straw man that distorted the actual proposal.
