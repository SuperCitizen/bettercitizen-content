slug: tort
name: Tort
short_definition: A civil wrong that causes harm to another person, for which the injured party can seek compensation through a lawsuit.
body_md: ""
category: rights-and-law
difficulty: intermediate
status: active
etymology: "Old French: tort (wrong, injustice). Latin: tortum (twisted, wrung). The legal meaning of 'a wrongful act' entered English law in the medieval period"
why_it_matters: Tort law governs everything from car accidents to medical malpractice to product liability — it is how individuals hold each other and corporations accountable for harm.
context_example: The family filed a tort claim against the manufacturer after the defective airbag caused additional injuries in the crash.
