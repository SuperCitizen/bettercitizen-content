slug: sovereignty
name: Sovereignty
short_definition: The supreme authority of a state to govern itself without external interference.
body_md: ""
category: foreign-policy
difficulty: intermediate
status: active
etymology: "Old French: souveraineté (supreme power). Latin root: superanus (above, chief)"
why_it_matters: Sovereignty is the foundation of the international order, but tensions arise when internal human rights abuses prompt external calls for intervention.
context_example: China invoked sovereignty to reject international criticism of its policies in Xinjiang, arguing that no foreign power has the right to interfere in its domestic affairs.
