slug: bipartisan
name: Bipartisan
short_definition: Involving cooperation and agreement between two major political parties.
body_md: ""
category: government
difficulty: foundational
status: active
etymology: "Latin: bi (two) + pars (part, side). Applied to American two-party politics in the early 20th century"
why_it_matters: In an era of intense polarization, bipartisan agreement is increasingly rare — when it happens, it signals that an issue transcends normal partisan divides.
context_example: The bipartisan infrastructure bill passed with votes from both parties, a rare moment of cooperation in a Congress defined by gridlock and partisan warfare.
