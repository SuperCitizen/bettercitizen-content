slug: martial-law
name: Martial Law
short_definition: The imposition of direct military control over civilian functions of government, typically in response to war, insurrection, or natural disaster.
body_md: ""
category: military
difficulty: intermediate
status: active
etymology: "English: 'martial' from Latin martialis (of Mars, the god of war) + 'law.' The concept predates the term, but 'martial law' has been used in English since at least the 14th century"
why_it_matters: Martial law represents the most extreme suspension of civil liberties, replacing civilian governance with military authority — its invocation always tests constitutional limits.
context_example: The governor declared martial law after the riots overwhelmed local police, deploying National Guard troops to enforce a curfew and patrol city streets.
