slug: asymmetric-warfare
name: Asymmetric Warfare
short_definition: Conflict between forces of significantly different military capabilities, where the weaker side uses unconventional tactics.
body_md: ""
category: military
difficulty: advanced
status: active
etymology: "Greek: asymmetria (lack of proportion). Military usage emerged in the 1990s to describe post-Cold War conflicts"
why_it_matters: Most modern conflicts are asymmetric — understanding this concept explains why the world's most powerful militaries can struggle against insurgents, guerrillas, and non-state actors.
context_example: The decade-long war in Afghanistan illustrated asymmetric warfare as Taliban fighters used IEDs and ambushes to counter the technological superiority of coalition forces.
