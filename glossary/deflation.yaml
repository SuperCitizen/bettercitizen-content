slug: deflation
name: Deflation
short_definition: A sustained decrease in the general price level of goods and services, often associated with reduced economic activity.
body_md: ""
category: economy
difficulty: intermediate
status: active
etymology: "Latin: de- (down) + flare (to blow). Opposite of inflation, first used in economic context in the 1920s"
why_it_matters: Deflation can be more dangerous than inflation because falling prices discourage spending, increase the real burden of debt, and can trigger economic spirals.
context_example: Japan's 'lost decade' of deflation showed how falling prices can become self-reinforcing as consumers delay purchases in expectation of even lower prices.
