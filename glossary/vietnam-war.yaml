slug: vietnam-war
name: Vietnam War
short_definition: The prolonged military conflict (1955-1975) in which the United States supported South Vietnam against communist North Vietnam, ultimately ending in American withdrawal and North Vietnamese victory.
body_md: ""
category: historical
difficulty: foundational
status: historical
etymology: Named after Vietnam (Viet Nam in Vietnamese, meaning 'southern Viet people'). Americans often call it the Vietnam War; Vietnamese call it the American War (Chien tranh chong My)
why_it_matters: Vietnam shattered American confidence in military intervention, created the 'Vietnam syndrome' that shaped foreign policy for decades, and demonstrated the limits of superpower military force.
context_example: The Vietnam War killed over 58,000 Americans and an estimated 2 million Vietnamese, sparked the largest antiwar movement in US history, and ultimately proved unwinnable.
