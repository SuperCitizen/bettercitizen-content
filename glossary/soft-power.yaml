slug: soft-power
name: Soft Power
short_definition: The ability to influence others through attraction and persuasion — culture, values, and policies — rather than coercion or payment.
body_md: ""
category: foreign-policy
difficulty: advanced
status: active
etymology: "English: coined by political scientist Joseph Nye in his 1990 book Bound to Lead, contrasting it with the coercive 'hard power' of military force"
why_it_matters: American soft power — Hollywood, Silicon Valley, universities, and democratic ideals — has been one of the country's greatest strategic assets, but its decline worries strategists.
context_example: South Korea's investment in K-pop, film, and technology has made it a soft power superpower, wielding cultural influence far beyond what its military strength would suggest.
