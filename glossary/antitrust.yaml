slug: antitrust
name: Antitrust
short_definition: Laws and regulations that promote fair competition and prevent monopolies from dominating markets.
body_md: ""
category: economy
difficulty: intermediate
status: active
etymology: "English: 'anti-' (against) + 'trust' (a combination of firms to reduce competition). Named after the business 'trusts' of the late 19th century that monopolized industries like oil and steel"
why_it_matters: Antitrust enforcement determines whether markets remain competitive or are dominated by a few giants — the debate over Big Tech regulation is fundamentally an antitrust question.
context_example: The Justice Department filed an antitrust suit against Google, alleging the company used exclusive deals to maintain an illegal monopoly over internet search.
