slug: emancipation-proclamation
name: Emancipation Proclamation
short_definition: President Lincoln's 1863 executive order declaring enslaved people in Confederate states to be free, transforming the Civil War into a fight against slavery.
body_md: ""
category: historical
difficulty: foundational
status: historical
etymology: "Latin: emancipare (to set free, release from control) + proclamare (to cry out, declare publicly)"
why_it_matters: The Emancipation Proclamation didn't immediately free anyone — it applied only to states in rebellion — but it transformed the moral purpose of the war and paved the way for the 13th Amendment.
context_example: The Emancipation Proclamation allowed Black men to enlist in the Union Army, and nearly 200,000 served by war's end, fundamentally changing the course of the conflict.
