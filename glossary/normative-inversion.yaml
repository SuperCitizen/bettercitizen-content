slug: normative-inversion
name: Normative Inversion
short_definition: A civilizational shift in which a society's core values flip — what was once prized becomes condemned, and what was condemned becomes prized.
body_md: ""
category: social-cultural
difficulty: expert
status: active
etymology: "Latin: norma (rule, pattern) + inversio (a turning about). The concept was developed by French philosopher Chantal Delsol in her 2022 book La Fin de la Chrétienté"
why_it_matters: The concept helps explain the intensity of culture war debates — if a normative inversion is underway, both sides experience the other as a fundamental threat to their worldview.
context_example: Chantal Delsol argues we are experiencing a normative inversion as the Christian moral framework that shaped Western civilization is being replaced by a secular universalism.
