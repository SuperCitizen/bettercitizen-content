slug: socialism
name: Socialism
short_definition: An economic and political system in which the means of production are owned or regulated by the community or state, aimed at reducing inequality.
body_md: ""
category: social-cultural
difficulty: foundational
status: active
etymology: "French: socialisme. Latin: socialis (allied, united). Coined in the 1830s to describe cooperative alternatives to industrial capitalism"
why_it_matters: Socialism remains one of the most debated concepts in politics — from Nordic social democracies to Cuban communism, it encompasses a vast range of systems and outcomes.
context_example: The senator's self-identification as a democratic socialist sparked renewed national debate about what socialism means in an American context.
