slug: war-crimes
name: War Crimes
short_definition: Violations of the laws of war, including intentional targeting of civilians, torture of prisoners, and use of prohibited weapons.
body_md: ""
category: military
difficulty: intermediate
status: active
etymology: "English: 'war' from Old North French werre + 'crime' from Latin crimen (charge, accusation). Codified at the Nuremberg Trials (1945-1946)"
why_it_matters: The prosecution of war crimes is essential to maintaining humanitarian norms in conflict, though enforcement remains inconsistent and often politicized.
context_example: The International Criminal Court issued arrest warrants for both sides' commanders, charging them with war crimes including the deliberate targeting of hospitals.
