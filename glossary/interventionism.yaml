slug: interventionism
name: Interventionism
short_definition: A foreign policy that supports active engagement in international affairs, including military intervention when deemed necessary.
body_md: ""
category: foreign-policy
difficulty: intermediate
status: active
etymology: "Latin: intervenire (to come between) + '-ism.' Became a major American foreign policy concept after World War II"
why_it_matters: The debate between interventionism and restraint defines American foreign policy, from Iraq to Libya to Ukraine — when and where should America use its power?
context_example: The administration's interventionist stance led to military action in three countries simultaneously, stretching resources and public patience.
