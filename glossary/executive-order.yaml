slug: executive-order
name: Executive Order
short_definition: A directive issued by the president that manages operations of the federal government, having the force of law.
body_md: ""
category: government
difficulty: intermediate
status: active
etymology: "Latin: executivus (carrying out) + ordo (arrangement, command)"
why_it_matters: Presidents increasingly use executive orders to bypass Congressional gridlock, raising concerns about the expansion of unilateral executive power.
context_example: The new administration signed 42 executive orders in its first week, reversing the previous president's policies on immigration, climate, and trade.
