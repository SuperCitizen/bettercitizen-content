slug: caucus
name: Caucus
short_definition: A neighborhood-level meeting in which party members publicly support a candidate. Used by a small and shrinking number of states for presidential nominations.
body_md: ""
category: elections
difficulty: intermediate
status: active
etymology: "Algonquian (possibly): caucauasu (counselor). Some scholars trace it to Latin: caucus (drinking vessel) via colonial political clubs"
why_it_matters: Caucuses require hours of in-person participation, resulting in much lower turnout than primaries and favoring highly motivated activists.
context_example: The Iowa caucuses have long served as the first test of presidential viability, though their outsized influence has been increasingly questioned.
