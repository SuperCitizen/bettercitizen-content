slug: foreign-aid
name: Foreign Aid
short_definition: Economic, military, or technical assistance provided by one country to another, often with conditions attached regarding governance, human rights, or policy reforms.
body_md: ""
category: foreign-policy
difficulty: foundational
status: active
etymology: "English: 'foreign' from Old French forain (outside, exterior) + 'aid' from Old French aide (help, assistance). Modern foreign aid programs began with the Marshall Plan in 1948"
why_it_matters: Foreign aid is both a humanitarian tool and a strategic instrument — it can save lives, build alliances, and promote stability, but critics argue it often props up corrupt governments.
context_example: The US provides approximately $50 billion in foreign aid annually, less than 1% of the federal budget, but polls consistently show Americans believe the figure is 20-30 times higher.
