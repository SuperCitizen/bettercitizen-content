slug: ratification
name: Ratification
short_definition: The formal approval of a proposed law, amendment, or treaty by the required number of legislative bodies.
body_md: ""
category: government
difficulty: intermediate
status: active
etymology: "Latin: ratificare (to confirm)"
why_it_matters: Ratification is the final step that gives constitutional amendments and treaties their legal force.
context_example: The treaty was signed by the president but never ratified by the Senate, leaving it without binding legal effect.
