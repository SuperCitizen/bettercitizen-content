slug: first-amendment
name: First Amendment
short_definition: The constitutional amendment protecting freedom of religion, speech, press, assembly, and the right to petition the government.
body_md: ""
category: rights-and-law
difficulty: foundational
status: active
etymology: "English: the first of ten amendments in the Bill of Rights, ratified December 15, 1791"
why_it_matters: The First Amendment is the foundation of American democracy — without it, the government could silence dissent, control the press, and impose state religion.
context_example: The court struck down the campus speech code, ruling that even offensive expression is protected by the First Amendment.
