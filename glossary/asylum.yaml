slug: asylum
name: Asylum
short_definition: Protection granted by a state to a foreign national who has fled their home country due to persecution or danger.
body_md: ""
category: foreign-policy
difficulty: intermediate
status: active
etymology: "Latin: asylum. Greek: asylon (sanctuary, inviolable place). From a- (without) + syle (right of seizure)"
why_it_matters: The right to seek asylum is enshrined in international law, but the tension between humanitarian obligations and immigration enforcement makes it one of the most politically charged issues.
context_example: The asylum seeker waited 18 months for a hearing, joining a backlog of over two million cases in the US immigration court system.
