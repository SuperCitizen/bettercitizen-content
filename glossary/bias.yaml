slug: bias
name: Bias
short_definition: A systematic tendency to favor one perspective over another, whether conscious or unconscious, in reporting or analysis.
body_md: ""
category: media-information
difficulty: foundational
status: active
etymology: "French: biais (a slant, oblique). Possibly from Old Provencal or Greek: epikarsios (oblique)"
why_it_matters: All media has some bias — the question is whether consumers can recognize it. Understanding bias is the foundation of critical thinking about news and information.
context_example: The media watchdog documented how the network's coverage of the same event used dramatically different framing depending on which party's candidate was involved.
