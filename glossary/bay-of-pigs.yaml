slug: bay-of-pigs
name: Bay of Pigs
short_definition: A failed CIA-backed invasion of Cuba in 1961 by Cuban exiles attempting to overthrow Fidel Castro's government, a major embarrassment for the Kennedy administration.
body_md: ""
category: historical
difficulty: intermediate
status: historical
etymology: Named after the Bahia de Cochinos (Bay of Pigs) on Cuba's southern coast where the exiles landed. The Spanish name refers to a species of triggerfish, not actual pigs
why_it_matters: The Bay of Pigs taught hard lessons about covert regime change, intelligence failures, and groupthink — lessons that were not always heeded in subsequent interventions.
context_example: The Bay of Pigs invasion collapsed within three days as the expected popular uprising against Castro never materialized, and Kennedy refused to provide air support.
