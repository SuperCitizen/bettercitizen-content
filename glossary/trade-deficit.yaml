slug: trade-deficit
name: Trade Deficit
short_definition: The amount by which a country's imports exceed its exports.
body_md: ""
category: economy
difficulty: intermediate
status: active
etymology: "Old French: deficit from Latin deficere (to fail, be lacking). Trade from Middle Low German trade (track, course)"
why_it_matters: The US trade deficit exceeds $800 billion annually, fueling debates about manufacturing decline, currency manipulation, and economic dependence on foreign nations.
context_example: The trade deficit with China widened to $382 billion, intensifying calls for tariffs and reshoring of critical supply chains.
