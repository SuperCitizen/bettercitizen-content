slug: deterrence
name: Deterrence
short_definition: A strategy of maintaining military strength or nuclear capability to discourage an enemy from attacking.
body_md: ""
category: foreign-policy
difficulty: intermediate
status: active
etymology: "Latin: deterrere (to frighten away). De- (away) + terrere (to frighten)"
why_it_matters: Nuclear deterrence — the idea that mutual assured destruction prevents war — has kept the peace between great powers since 1945, but its logic depends on rational actors.
context_example: The Pentagon's nuclear deterrence strategy relies on maintaining a triad of land-based missiles, submarine-launched missiles, and strategic bombers.
