slug: republic
name: Republic
short_definition: A form of government in which the country is considered a 'public matter' and is not the private concern of rulers, with elected representatives making decisions.
body_md: ""
category: government
difficulty: foundational
status: active
etymology: "Latin: res publica (public affair)"
why_it_matters: The United States is a republic, not a direct democracy, meaning citizens govern through elected representatives rather than voting on every law.
context_example: Sen. Lee reminded his colleagues that the Founders designed a republic precisely to prevent the tyranny of the majority.
