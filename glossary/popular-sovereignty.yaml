slug: popular-sovereignty
name: Popular Sovereignty
short_definition: The principle that the authority of a government is created and sustained by the consent of its people, who are the ultimate source of political power.
body_md: ""
category: government
difficulty: intermediate
status: active
etymology: "Latin: popularis (of the people) + French: souveraineté (supreme authority). The concept was central to Enlightenment thinkers like Rousseau and was invoked by both sides in the debate over slavery's expansion"
why_it_matters: The tension between popular sovereignty and institutional expertise is one of the defining conflicts of modern politics — who should have the final say, voters or experts?
context_example: The referendum was framed as an exercise in popular sovereignty, giving citizens a direct voice on a question that elected officials had refused to address.
