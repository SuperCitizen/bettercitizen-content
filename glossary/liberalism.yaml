slug: liberalism
name: Liberalism
short_definition: A political philosophy founded on ideas of liberty, equality, and consent of the governed, emphasizing individual rights and democratic governance.
body_md: ""
category: social-cultural
difficulty: intermediate
status: active
etymology: "Latin: liberalis (of or pertaining to a free person). The political philosophy emerged from Enlightenment thinkers like John Locke and Montesquieu"
why_it_matters: Liberalism is the philosophical foundation of most Western democracies, though its meaning differs significantly between American usage (progressive) and international usage (classical freedom).
context_example: The political theorist argued that both American conservatives and progressives are, in the broadest sense, liberals — heirs to the Enlightenment tradition of individual rights and limited government.
