slug: framing
name: Framing
short_definition: The way information is presented to influence how it is perceived — what is included, excluded, or emphasized shapes public opinion.
body_md: ""
category: media-information
difficulty: intermediate
status: active
etymology: "English: from 'frame' (to construct, shape). Old English: framian (to profit, avail). The concept of media framing was formalized by sociologist Erving Goffman in 1974"
why_it_matters: Framing is one of the most powerful tools of persuasion — the same facts presented with different framing can lead to opposite conclusions.
context_example: Describing the legislation as a 'tax relief package' versus a 'giveaway to the wealthy' illustrates how framing shapes the public's perception of identical policy.
