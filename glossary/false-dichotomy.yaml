slug: false-dichotomy
name: False Dichotomy
short_definition: A fallacy that presents only two options as if they were exhaustive, when in fact a third (or fourth, or many) is available.
body_md: ""
category: rhetoric
difficulty: foundational
status: active
etymology: "Greek: dicha (in two) + temnein (to cut). The 'false' modifier in modern usage marks the case where the two-way cut is artificial rather than real."
why_it_matters: False dichotomies collapse a continuum of real options into a forced choice. They are the rhetorical engine of 'you're either with us or against us' framings. Naming the missing third position is often the most useful intervention in a polarized debate.
context_example: The town hall was framed as a false dichotomy — abolish the police or accept the status quo — when reform proposals on the table actually ranged across a dozen distinct interventions.
