slug: swing-state
name: Swing State
short_definition: A state where no single party has overwhelming support and the outcome could go either way in an election.
body_md: ""
category: elections
difficulty: foundational
status: active
etymology: "English: 'swing' (to move back and forth) — reflecting the state's tendency to alternate between parties"
why_it_matters: Presidential campaigns concentrate nearly all their time and resources in swing states, meaning a handful of states effectively decide the election for the entire country.
context_example: Both candidates made multiple visits to Pennsylvania in the final week, recognizing the swing state as the most likely tipping point in the Electoral College.
