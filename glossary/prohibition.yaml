slug: prohibition
name: Prohibition
short_definition: The period (1920-1933) during which the manufacture, sale, and transportation of alcohol was banned in the United States by the 18th Amendment.
body_md: ""
category: historical
difficulty: foundational
status: historical
etymology: "Latin: prohibere (to hold back, prevent). The 18th Amendment was ratified in 1919 and took effect January 17, 1920. The 21st Amendment repealed it on December 5, 1933"
why_it_matters: Prohibition demonstrated how morality legislation can backfire spectacularly — it fueled organized crime, created a massive black market, and was ultimately repealed by the 21st Amendment.
context_example: Prohibition made criminals of millions of Americans, empowered gangsters like Al Capone, and proved that banning a widely desired substance creates more problems than it solves.
