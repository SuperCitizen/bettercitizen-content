slug: patronage-system
name: Patronage System
short_definition: A system where elected officials appoint supporters and allies to government positions, replaced in the US by the merit-based civil service after the Pendleton Act of 1883.
body_md: ""
category: government
difficulty: advanced
status: active
etymology: "Latin: patronus (protector, defender) — originally the relationship between a Roman patron and client. Applied to government appointments since the 18th century"
why_it_matters: The tension between patronage (democratic responsiveness) and merit-based civil service (expertise and independence) remains at the heart of debates about government reform.
context_example: The 19th-century spoils system meant that when you voted for a president, he replaced the entire executive branch with loyalists — maximum democratic responsiveness at the cost of expertise.
