slug: meritocracy
name: Meritocracy
short_definition: A system in which advancement is based on individual ability and achievement rather than wealth, class, or social background.
body_md: ""
category: social-cultural
difficulty: intermediate
status: active
etymology: "Latin: meritum (that which is deserved) + Greek: kratos (rule). Coined satirically by British sociologist Michael Young in The Rise of the Meritocracy (1958)"
why_it_matters: The ideal of meritocracy is central to the American Dream, but critics argue that systemic inequalities make true meritocracy impossible without addressing unequal starting points.
context_example: The admissions scandal exposed the gap between America's meritocratic ideals and the reality that wealthy families could buy their children's way into elite universities.
