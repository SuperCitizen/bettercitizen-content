slug: citizen-journalism
name: Citizen Journalism
short_definition: The collection, dissemination, and analysis of news by ordinary citizens rather than professional journalists, enabled by smartphones and social media.
body_md: ""
category: media-information
difficulty: foundational
status: active
etymology: "English: 'citizen' from Anglo-French citezein (inhabitant of a city) + 'journalism' from French journal (daily record). The concept gained prominence with the rise of camera phones and social media in the 2000s"
why_it_matters: Citizen journalism has exposed police brutality, government corruption, and human rights abuses that would otherwise go unreported, but also raises concerns about accuracy and manipulation.
context_example: The bystander's cellphone video of the police killing went viral within hours, sparking nationwide protests and illustrating the power of citizen journalism to shape public discourse.
