slug: conservatism
name: Conservatism
short_definition: A political philosophy favoring traditional institutions, limited government, individual liberty, and gradual rather than radical change.
body_md: ""
category: social-cultural
difficulty: foundational
status: active
etymology: "Latin: conservare (to keep, preserve). Edmund Burke's Reflections on the Revolution in France (1790) is often considered the founding text of modern conservatism"
why_it_matters: Conservatism provides the intellectual counterweight to progressivism, arguing that institutions and traditions evolved for good reasons and should not be lightly discarded.
context_example: The conservative coalition that had held together for decades — linking free-market economics, social traditionalism, and hawkish foreign policy — began to fracture under the populist wave.
