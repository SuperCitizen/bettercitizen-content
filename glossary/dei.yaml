slug: dei
name: DEI
short_definition: Diversity, Equity, and Inclusion — organizational policies and programs aimed at promoting representation and fair treatment of people of all backgrounds. Became a major political flashpoint in the 2020s.
body_md: ""
category: social-cultural
difficulty: foundational
status: active
etymology: "English acronym: Diversity, Equity, and Inclusion. The framework evolved from earlier 'diversity training' initiatives, with 'equity' and 'inclusion' added to distinguish outcomes-based approaches from representation-only efforts"
why_it_matters: DEI programs are at the center of the culture war, with supporters seeing them as essential justice and critics seeing them as discriminatory.
context_example: Several states passed laws banning DEI programs at public universities, while corporations quietly disbanded their DEI departments amid political backlash.
