slug: multilateral
name: Multilateral
short_definition: Involving three or more nations working together on shared objectives, as opposed to bilateral (two nations) or unilateral (one nation acting alone).
body_md: ""
category: foreign-policy
difficulty: intermediate
status: active
etymology: "Latin: multus (many) + lateralis (of the side)"
why_it_matters: Multilateral cooperation is essential for addressing global challenges like climate change, trade, and pandemics, but requires compromise that critics say dilutes national sovereignty.
context_example: The multilateral trade agreement took seven years to negotiate as 15 nations struggled to reconcile competing economic interests.
