slug: rules-of-engagement
name: Rules of Engagement
short_definition: Military directives that define the circumstances and limitations under which forces may engage the enemy.
body_md: ""
category: military
difficulty: intermediate
status: active
etymology: "English military terminology: formalized in the post-World War II era as laws of armed conflict evolved"
why_it_matters: Rules of engagement balance the safety of troops against the protection of civilians — too restrictive and soldiers die, too permissive and civilians die.
context_example: Soldiers testified that the rules of engagement prohibited them from returning fire unless they could positively identify the source, even as they came under attack from populated areas.
