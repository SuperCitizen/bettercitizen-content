slug: judicial-review
name: Judicial review
short_definition: The power of federal courts to declare a statute or executive action unconstitutional. Established in Marbury v. Madison (1803).
body_md: ""
category: government
difficulty: intermediate
status: active
etymology: "Latin: judicialis (of the courts) + revidere (to look at again)"
why_it_matters: Established in Marbury v. Madison (1803), it's the judiciary's primary check on the other branches.
context_example: The Supreme Court exercised judicial review to strike down key provisions of the Voting Rights Act, fundamentally altering federal oversight of state election laws.
