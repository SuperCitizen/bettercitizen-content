slug: d-tente
name: Détente
short_definition: A period of relaxed tensions between rival nations, particularly used to describe US-Soviet relations in the 1970s.
body_md: ""
category: foreign-policy
difficulty: advanced
status: active
etymology: "French: détente (relaxation, easing). From détendre (to relax, slacken)"
why_it_matters: Détente produced landmark arms control agreements like SALT I and the Anti-Ballistic Missile Treaty, demonstrating that even bitter rivals can negotiate mutual survival.
context_example: Nixon's visit to Beijing in 1972 marked a dramatic shift toward détente, opening diplomatic relations with China after two decades of hostility.
