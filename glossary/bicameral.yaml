slug: bicameral
name: Bicameral
short_definition: A legislature consisting of two chambers or houses, such as the US Senate and House of Representatives.
body_md: ""
category: government
difficulty: intermediate
status: active
etymology: "Latin: bi (two) + camera (chamber)"
why_it_matters: The bicameral structure forces legislation through two different bodies with different incentives, slowing the process but encouraging compromise.
context_example: The bill passed the House easily but stalled in the Senate, illustrating how the bicameral system can block even popular legislation.
