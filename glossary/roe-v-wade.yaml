slug: roe-v-wade
name: Roe v. Wade
short_definition: The 1973 Supreme Court decision recognizing a constitutional right to abortion, overturned by Dobbs v. Jackson in 2022.
body_md: ""
category: historical
difficulty: intermediate
status: historical
etymology: Named after 'Jane Roe,' the pseudonym of Norma McCorvey, the plaintiff. Henry Wade was the Dallas County District Attorney who defended the Texas abortion ban
why_it_matters: Roe v. Wade defined the abortion debate for 50 years, and its overturning in Dobbs has returned abortion policy to the states, creating a patchwork of vastly different laws.
context_example: When the Supreme Court overturned Roe v. Wade in 2022, trigger laws in 13 states immediately banned or severely restricted abortion access.
