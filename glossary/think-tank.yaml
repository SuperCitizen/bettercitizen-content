slug: think-tank
name: Think Tank
short_definition: A policy research organization that provides analysis and advice on domestic and international issues to influence government decision-making.
body_md: ""
category: government
difficulty: intermediate
status: active
etymology: "English: originally World War II slang for a secure room where strategists planned military operations. Applied to policy research organizations in the 1960s"
why_it_matters: Think tanks shape public policy by providing the research and intellectual frameworks that legislators rely on, though their funding sources can introduce bias.
context_example: The think tank's report on healthcare reform was cited by both parties, though critics noted its primary funder was the insurance industry.
