slug: strict-constructionism
name: Strict Constructionism
short_definition: The judicial philosophy of interpreting the Constitution and laws narrowly, limiting government power to what is explicitly stated.
body_md: ""
category: rights-and-law
difficulty: advanced
status: active
etymology: "Latin: strictus (drawn tight) + construere (to build, interpret). Gained political prominence when President Nixon promised to appoint strict constructionist judges"
why_it_matters: Strict constructionism limits the courts' ability to expand rights or powers beyond what the text explicitly provides, shaping debates about everything from privacy to federal regulation.
context_example: The strict constructionist judge ruled that Congress had exceeded its enumerated powers, as the Constitution nowhere authorizes federal regulation of local agriculture.
