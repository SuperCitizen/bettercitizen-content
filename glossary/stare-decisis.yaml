slug: stare-decisis
name: Stare Decisis
short_definition: The legal principle of deciding cases based on precedent — 'to stand by things decided.'
body_md: ""
category: rights-and-law
difficulty: advanced
status: active
etymology: "Latin: 'to stand by things decided'"
why_it_matters: Stare decisis provides stability in law, but its limits were dramatically tested when the Supreme Court overturned Roe v. Wade after nearly 50 years.
context_example: During her confirmation hearing, the nominee repeatedly affirmed stare decisis while declining to say whether specific precedents were correctly decided.
