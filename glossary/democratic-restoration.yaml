slug: democratic-restoration
name: Democratic Restoration
short_definition: The idea that populist movements aim to restore genuine popular sovereignty by dismantling the administrative state and institutional barriers between the electorate and policy outcomes.
body_md: ""
category: social-cultural
difficulty: advanced
status: active
etymology: "Latin: democratia (rule of the people) + restaurare (to restore, rebuild). The concept was articulated by conservative thinkers in the 2010s to describe populist movements as reclaiming democratic self-governance"
why_it_matters: Democratic restoration frames populism as a democratic project rather than an authoritarian one, reframing the debate about institutional power.
context_example: Christopher Caldwell describes Trumpism as a project of democratic restoration — returning decision-making power from unelected experts to voters.
