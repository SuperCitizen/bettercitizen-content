slug: suffrage
name: Suffrage
short_definition: The right to vote in political elections, historically expanded through movements like women's suffrage (19th Amendment, 1920).
body_md: ""
category: historical
difficulty: foundational
status: historical
etymology: "Latin: suffragium (vote, right to vote). Possibly related to sub (under) + frangere (to break) — originally referring to a broken piece of pottery used as a ballot"
why_it_matters: The expansion of suffrage — from propertied white men to all citizens regardless of race, sex, or age — is the central story of American democratization.
context_example: The women's suffrage movement fought for 72 years before the 19th Amendment was ratified in 1920, granting women the right to vote nationwide.
