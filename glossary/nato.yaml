slug: nato
name: NATO
short_definition: The North Atlantic Treaty Organization — a military alliance of 32 member nations committed to mutual defense, founded in 1949.
body_md: ""
category: foreign-policy
difficulty: foundational
status: active
etymology: "English acronym: North Atlantic Treaty Organization. Founded April 4, 1949, in Washington, D.C."
why_it_matters: NATO's Article 5 — an attack on one is an attack on all — has been the cornerstone of Western security for 75 years, though its relevance and burden-sharing are increasingly debated.
context_example: The only time NATO invoked Article 5 was after the September 11 attacks, when alliance members deployed forces to support the US in Afghanistan.
