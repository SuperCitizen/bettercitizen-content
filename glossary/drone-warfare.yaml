slug: drone-warfare
name: Drone Warfare
short_definition: The use of unmanned aerial vehicles (UAVs) for surveillance and targeted strikes, raising ethical questions about remote killing and civilian casualties.
body_md: ""
category: military
difficulty: intermediate
status: active
etymology: "English: 'drone' (a male honeybee, by extension something that hums and operates on its own) + 'warfare.' Military drones date to the 1990s; widespread armed use began after 2001"
why_it_matters: Drone warfare allows nations to project lethal force without risking their own troops, lowering the political cost of military action and raising questions about accountability.
context_example: The CIA's drone warfare program conducted over 400 strikes in Pakistan, killing an estimated 2,500 to 4,000 people, including hundreds of civilians.
