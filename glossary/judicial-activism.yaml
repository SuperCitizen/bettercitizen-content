slug: judicial-activism
name: Judicial Activism
short_definition: A philosophy that courts should use their power to advance social justice and correct perceived injustices, sometimes going beyond the text of the law.
body_md: ""
category: rights-and-law
difficulty: advanced
status: active
etymology: "Latin: judicialis (of the courts) + activus (active). The term became prominent in the mid-20th century during the Warren Court era"
why_it_matters: The debate over judicial activism goes to the heart of the judiciary's role — should judges interpret the law as written or use their power to achieve just outcomes?
context_example: Critics accused the court of judicial activism for reading a right to privacy into the Constitution, while supporters praised it as necessary to protect fundamental freedoms.
