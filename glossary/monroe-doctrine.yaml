slug: monroe-doctrine
name: Monroe Doctrine
short_definition: An 1823 US policy opposing European colonization in the Americas, later invoked to justify American intervention in the Western Hemisphere.
body_md: ""
category: historical
difficulty: intermediate
status: historical
etymology: Named after President James Monroe, who articulated the policy in his 1823 annual message to Congress. The phrase 'Monroe Doctrine' was not used until 1850
why_it_matters: The Monroe Doctrine established the US as the self-appointed guardian of the Western Hemisphere, a posture that has justified both protection of sovereignty and imperialistic intervention for two centuries.
context_example: The Roosevelt Corollary to the Monroe Doctrine was used to justify American military intervention in the Caribbean and Central America more than 30 times in the early 20th century.
