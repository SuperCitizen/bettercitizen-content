slug: oppo-research
name: Oppo Research
short_definition: Opposition research — the practice of collecting damaging information about a political opponent for use in campaigns.
body_md: ""
category: elections
difficulty: intermediate
status: active
etymology: "English slang: shortened from 'opposition research.' The practice is as old as elections, but professionalized in the 1970s-80s with dedicated campaign research teams"
why_it_matters: Opposition research drives the negative campaigning that dominates modern elections and has produced both legitimate accountability journalism and dirty tricks.
context_example: The oppo research team spent months combing through the candidate's financial records, old social media posts, and court filings for material that could be used in attack ads.
