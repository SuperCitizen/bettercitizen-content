slug: national-front
name: National Front
short_definition: A far-right French political party (now renamed National Rally) founded in 1972, led by Marine Le Pen. Focuses on immigration restriction, national sovereignty, and Euroscepticism.
body_md: ""
category: foreign-policy
difficulty: advanced
status: active
etymology: "French: Front National. Founded in 1972 by Jean-Marie Le Pen and other far-right figures. Renamed Rassemblement National (National Rally) in 2018 by Marine Le Pen as part of a 'de-demonization' strategy"
why_it_matters: The National Front/Rally's evolution from fringe extremism to mainstream contender illustrates how far-right parties can rebrand and gain power across Western democracies.
context_example: Marine Le Pen's rebranding of the National Front as the National Rally softened its image enough to win 41% of the vote in the presidential runoff, the party's best-ever showing.
