slug: hard-power
name: Hard Power
short_definition: The use of military or economic force to influence the behavior or interests of other nations.
body_md: ""
category: foreign-policy
difficulty: intermediate
status: active
etymology: "English: coined by political scientist Joseph Nye as the counterpart to 'soft power.' Hard from Old English heard (firm, strong)"
why_it_matters: Hard power — the threat or use of force — remains the ultimate currency in international relations, though its limits have been painfully demonstrated in Iraq and Afghanistan.
context_example: The deployment of the carrier strike group to the region was a classic exercise in hard power, sending an unmistakable signal without firing a shot.
