slug: descriptive-representation
name: Descriptive representation
short_definition: Representation by members who share the traits of the people they represent, such as race, gender, class, or occupation, so that the legislature mirrors the population. It is usually contrasted with substantive representation, which is about what representatives actually do.
body_md: ""
category: government
difficulty: advanced
status: active
why_it_matters: Congress differs from the country it represents on several measures, most of all education, occupation, and wealth. Whether that gap matters is a long-running argument, from Hanna Pitkin's case for judging representatives by what they do to Jane Mansbridge's "contingent yes" for shared experience.
context_example: Supporters of descriptive representation argued that a legislature with almost no members from working-class jobs would overlook problems that working families live with every day.
