slug: ad-hominem
name: Ad Hominem
short_definition: A logical fallacy that attacks the person making an argument rather than addressing the argument itself.
body_md: ""
category: rhetoric
difficulty: intermediate
status: active
etymology: "Latin: 'to the person.' A shortening of argumentum ad hominem — an argument directed at the person rather than the position"
why_it_matters: Ad hominem attacks are the most common fallacy in political discourse — recognizing them helps you focus on the substance of arguments rather than being distracted by personal attacks.
context_example: Rather than address the policy proposal, the pundit launched an ad hominem attack on the researcher's funding sources and political affiliations.
