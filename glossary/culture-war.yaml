slug: culture-war
name: Culture War
short_definition: A conflict between groups with different ideals, beliefs, or philosophies, particularly over social and moral values.
body_md: ""
category: social-cultural
difficulty: intermediate
status: active
etymology: "German: Kulturkampf (culture struggle) — originally Bismarck's 1870s conflict with the Catholic Church. Applied to American social conflicts by sociologist James Davison Hunter in his 1991 book Culture Wars"
why_it_matters: Culture wars increasingly define American politics, as battles over education, gender, religion, and media consume more political energy than traditional policy debates.
context_example: School board meetings became the frontlines of the culture war as parents clashed over book bans, gender identity policies, and how American history should be taught.
